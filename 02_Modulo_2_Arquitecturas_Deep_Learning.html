                            Idea de la interpolación en el espacio latente: en un latente continuo, desplazarse entre dos puntos produce
                            transiciones graduales, aquí evocadas con orquídeas de distintos tonos. Un barrido real del latente, decodificado
                            por un VAE entrenado en el navegador, se observa en el laboratorio del VAE de la herramienta interactiva que
                            cierra el §6.
                        </PieFigura>
                    </div>

                    {/* ============== 2. Autoencoders ============== */}
                    <h3>2. Autocodificadores (AE): compresión y reconstrucción</h3>
                    <p>
                        Un <Termino def={<>Autocodificador (<em>autoencoder</em>): red de aprendizaje no supervisado que comprime la entrada y la reconstruye, forzando a quedarse con lo esencial.</>}>autocodificador</Termino> aprende
                        representaciones eficientes de forma no supervisada <Cita k="hinton2006reducing" />. Su arquitectura tiene una simetría de «reloj de arena»:
                        un <strong>codificador</strong> (<em>encoder</em>) reduce progresivamente la dimensión de la entrada, un <strong>cuello de
                        botella</strong> (la capa más estrecha) aloja el código latente {String.raw`\(z\)`}, y un
                        <strong> decodificador</strong> (<em>decoder</em>) lo expande para recuperar la entrada.
                    </p>

                    <AutoencoderSVG />

                    <p>
                        La restricción del cuello de botella es crítica: impide que la red aprenda la función identidad (copiar y
                        pegar) y la fuerza a priorizar qué información es esencial y cuál es redundante o ruido. El entrenamiento
                        minimiza una <strong>pérdida de reconstrucción</strong>, usualmente el error cuadrático medio:
                    </p>
                    <Eq>{String.raw`$$ \mathcal{L}_{\text{rec}} = \big\lVert\, x - g(f(x)) \,\big\rVert^{2} $$`}</Eq>
                    <p>
                        donde {String.raw`\(f(x)\)`} es el codificador que produce {String.raw`\(z = f(x)\)`} y {String.raw`\(g(z)\)`}{' '}
                        el decodificador que produce la reconstrucción {String.raw`\(\hat{x} = g(z)\)`}.
                    </p>

                    <CodeBlock title="Autocodificador mínimo" lang="pytorch" code={`import torch
import torch.nn as nn

class Autoencoder(nn.Module):
    def __init__(self):
        super().__init__()
        # Codificador (encoder): comprime 784 -> 128 -> 32
        self.encoder = nn.Sequential(
            nn.Linear(784, 128), nn.ReLU(),
            nn.Linear(128, 32),  nn.ReLU(),   # 32 = código latente z (cuello de botella)
        )
        # Decodificador (decoder): reconstruye 32 -> 128 -> 784
        self.decoder = nn.Sequential(
            nn.Linear(32, 128),  nn.ReLU(),
            nn.Linear(128, 784), nn.Sigmoid(),  # Sigmoid -> píxeles en (0, 1)
        )

    def forward(self, x):
        z = self.encoder(x)        # representación comprimida
        return self.decoder(z)     # reconstrucción

model = Autoencoder()
x = torch.rand(1, 784)             # un dígito aplanado (28x28 = 784), valores en [0, 1]
x_rec = model(x)
print(x_rec.shape)  # torch.Size([1, 784])  -> misma forma que la entrada

# El entrenamiento minimiza la reconstrucción: criterion = nn.MSELoss()
# El cuello de botella (32 << 784) impide copiar la entrada (función identidad).`} />

                    <Box type="tip" label="Analogía local — TransMilenio en hora pico">
                        El flujo de ciudadanos dispersos en los paraderos de Suba o Bosa es la entrada {String.raw`\(x\)`}: rica
                        en detalle pero ineficiente. Los <strong>alimentadores</strong> (codificador) canalizan esa información hacia el
                        portal. En el portal, los pasajeros de decenas de paraderos se comprimen en un <strong>articulado rojo</strong> de
                        unas 160 plazas: ese bus es el vector latente {String.raw`\(z\)`}, donde la identidad individual se vuelve
                        secundaria ante el destino común. Al llegar al centro, las personas se dispersan (decodificador) y la «imagen»
                        de la ciudad activa se reconstruye. La
                        capacidad del bus es la dimensión latente: si es muy pequeña, el sistema colapsa y se pierde información.
                    </Box>

                    <h4>Autocodificadores de eliminación de ruido (DAE)</h4>
                    <p>
                        Una variante poderosa, el <em>denoising autoencoder</em> <Cita k="vincent2008extracting" />, corrompe intencionalmente la entrada con ruido
                        (manchar o borrar partes de una imagen) y entrena al AE para reconstruir la versión <strong>limpia</strong>. En
                        la analogía de TransMilenio, sería como si algunos pasajeros llegaran al portal con la tarjeta borrosa o sin
                        indicar su parada, y el sistema aprendiera igual a llevarlos a su destino correcto: reconstruye la señal limpia
                        a partir de una entrada dañada. El modelo aprende la estructura <em>robusta</em> de los datos, porque el
                        ruido es aleatorio y no tiene estructura comprimible.
                    </p>
                    <h4>Detección de anomalías</h4>
                    <p>
                        Los AE aprenden a reconstruir lo que ven con frecuencia (datos normales). Ante un dato anómalo, el
                        <strong> error de reconstrucción</strong> se dispara. Es como si un elefante intentara entrar al articulado:
                        el sistema no está diseñado para comprimirlo y el proceso falla, generando una alerta.
                    </p>
                    <Box type="info" label="Aplicaciones en Colombia (casos ilustrativos)">
                        Un <strong>banco digital</strong> puede entrenar un AE solo con transacciones normales: un fraude (patrón
                        inusual) genera un alto error de reconstrucción y dispara una alerta. Una <strong>entidad de monitoreo
                        acústico</strong> podría usar un DAE para separar el canto de las aves del ruido de lluvia y motores en sus
                        grabaciones de la selva. En conectividad rural, el AE comprime imágenes de cultivos a un vector minúsculo para
                        transmitirlas por redes 2G/3G y reconstruirlas en la nube.
                    </Box>

                    {/* ============== 3. VAE ============== */}
                    <h3>3. Autocodificadores variacionales (VAE, <em>variational autoencoders</em>): un espacio latente probabilístico</h3>
                    <p>
                        El VAE <Cita k="kingma2014auto" /> introduce una modificación sutil pero revolucionaria. Mientras un AE mapea la entrada a un
                        <strong> punto fijo y determinista</strong>, el VAE la mapea a una <strong>distribución de
                        probabilidad</strong> (una gaussiana definida por la media {String.raw`\(\mu\)`} y la desviación estándar
                        {String.raw` \(\sigma\)`}). El modelo no memoriza una coordenada exacta, sino que aprende una «nube» donde es
                        probable que el dato resida. Esta decisión dota al espacio latente de dos propiedades vitales: la <strong>continuidad</strong>{' '}
                        (puntos cercanos decodifican a salidas parecidas) y la <strong>completitud</strong> (todo punto muestreado del espacio
                        decodifica a una salida plausible, sin «huecos» vacíos).
                    </p>

                    <AEvsVAELatentSVG />

                    <Box type="tip" label="Analogía local — el ajiaco santafereño">
                        Un ajiaco de lata producido en fábrica es un <strong>AE</strong>: una receta exacta, un punto fijo, sin
                        variación. El ajiaco de la tradición oral es un <strong>VAE</strong>, un concepto probabilístico. La
                        <strong> media</strong> {String.raw`\(\mu\)`} es el arquetipo: tres papas, pollo y guascas. La
                        <strong> desviación</strong> {String.raw`\(\sigma\)`} es la tolerancia cultural: ¿más crema de leche? Sí.
                        ¿Alcaparras? Sí. ¿Fideos? No —se saldría de la distribución «ajiaco»—. Entre un ajiaco espeso y uno líquido
                        existen infinitos estados intermedios válidos: se puede navegar suavemente y el resultado siempre tiene sentido.
                    </Box>

                    <p>
                        El VAE se entrena <strong>maximizando</strong> una función objetivo llamada <strong>ELBO</strong>{' '}
                        (<em>Evidence Lower Bound</em>); en la práctica, la pérdida que se minimiza es su negativo
                        {String.raw` \(-\mathcal{L}_{\text{ELBO}}\)`}. El ELBO equilibra dos fuerzas opuestas:
                    </p>
                    <Eq>{String.raw`$$ \mathcal{L}_{\text{ELBO}}(\theta,\phi;\,x) = \underbrace{\mathbb{E}_{q_\phi(z|x)}\big[\log p_\theta(x|z)\big]}_{\text{reconstrucción}} - \underbrace{D_{\text{KL}}\!\big(q_\phi(z|x)\,\|\,p(z)\big)}_{\text{regularización}} $$`}</Eq>
                    <ul>
                        <li><strong>Reconstrucción:</strong> maximiza la log-verosimilitud esperada {String.raw`\(\mathbb{E}_{q_\phi(z|x)}[\log p_\theta(x|z)]\)`} para que el dato generado se parezca al real.</li>
                        <li><strong>Regularización (<Termino def="Divergencia de Kullback-Leibler: mide cuánto difiere una distribución de probabilidad de otra de referencia; vale cero solo si son idénticas.">divergencia KL</Termino>):</strong> el término {String.raw`\(D_{\text{KL}}(q_\phi(z|x)\,\|\,p(z))\)`} fuerza a las distribuciones latentes a parecerse a una normal estándar {String.raw`\(\mathcal{N}(0, I)\)`}, evitando que el modelo «haga trampa» dispersando las nubes de datos para memorizarlas.</li>
                    </ul>
                    <p>
                        <strong>En palabras:</strong> el ELBO exige dos cosas a la vez, en clave de ajiaco. El término de
                        reconstrucción pide que cada plato decodificado sepa a ajiaco (lo generado debe parecerse al dato
                        original); el término KL pide que ninguna receta se aleje demasiado del arquetipo compartido (cada
                        «nube» latente debe quedar cerca de la normal estándar). Entrenar un VAE es negociar ese equilibrio:
                        fidelidad al dato sin memorizar recetas aisladas.
                    </p>
                    <p>
                        El nombre se debe a que el ELBO acota por debajo la <em>evidencia</em> {String.raw`\(\log p_\theta(x)\)`}:
                    </p>
                    <Eq>{String.raw`$$ \log p_\theta(x) = \mathcal{L}_{\text{ELBO}}(\theta,\phi;\,x) + D_{\text{KL}}\!\big(q_\phi(z|x)\,\|\,p_\theta(z|x)\big) \;\ge\; \mathcal{L}_{\text{ELBO}}(\theta,\phi;\,x) $$`}</Eq>
                    <p>
                        porque la divergencia KL nunca es negativa. Maximizar el ELBO sube la verosimilitud y, a la vez, acerca
                        {String.raw` \(q_\phi(z|x)\)`} al posterior verdadero {String.raw`\(p_\theta(z|x)\)`} <Cita k="kingma2019introduction" />.
                    </p>

                    <Box type="info" label="El truco de reparametrización">
                        El muestreo (elegir un punto aleatorio de la distribución) no es derivable, lo que rompería la
                        retropropagación. El VAE lo resuelve expresando el vector latente como {String.raw`\(z = \mu + \sigma \odot \epsilon\)`},
                        con {String.raw`\(\epsilon \sim \mathcal{N}(0, I)\)`} un ruido externo. Así los gradientes fluyen a través de
                        {String.raw` \(\mu\)`} y {String.raw`\(\sigma\)`}, y la red aprende los parámetros de la distribución.
                    </Box>
                    <p>
                        En código, el modelo entero cabe en pocas líneas; conviene notar cómo el truco de reparametrización y
                        la divergencia KL en forma cerrada se traducen directamente desde las ecuaciones anteriores:
                    </p>
                    <CodeBlock title="VAE: reparametrización y pérdida ELBO" lang="pytorch" code={`import torch
import torch.nn as nn
import torch.nn.functional as F

class VAE(nn.Module):
    def __init__(self, d_lat=20):
        super().__init__()
        self.enc   = nn.Linear(784, 400)
        self.fc_mu = nn.Linear(400, d_lat)   # media μ del código latente
        self.fc_lv = nn.Linear(400, d_lat)   # log-varianza log σ^2 (más estable que σ)
        self.dec = nn.Sequential(
            nn.Linear(d_lat, 400), nn.ReLU(),
            nn.Linear(400, 784),   nn.Sigmoid(),   # píxeles reconstruidos en (0, 1)
        )

    def reparametrizar(self, mu, logvar):
        std = torch.exp(0.5 * logvar)        # σ = exp(0.5 * log σ^2)
        eps = torch.randn_like(std)          # ruido externo ε ~ N(0, I)
        return mu + std * eps                # z = μ + σ * ε  (ya es derivable)

    def forward(self, x):
        h = F.relu(self.enc(x))
        mu, logvar = self.fc_mu(h), self.fc_lv(h)
        z = self.reparametrizar(mu, logvar)
        return self.dec(z), mu, logvar

def perdida_elbo(x_rec, x, mu, logvar):
    recon = F.binary_cross_entropy(x_rec, x, reduction='sum')          # término de reconstrucción
    kl    = -0.5 * torch.sum(1 + logvar - mu.pow(2) - logvar.exp())    # KL contra N(0, I), forma cerrada
    return recon + kl        # se minimiza  -ELBO = reconstrucción + regularización

model = VAE()
x = torch.rand(1, 784)              # un dígito aplanado, valores en [0, 1]
x_rec, mu, logvar = model(x)
print(x_rec.shape, mu.shape)        # torch.Size([1, 784]) torch.Size([1, 20])`} />
                    <Box type="info" label="Aplicaciones en Colombia (casos ilustrativos)">
                        En caficultura, un VAE podría modelar el «espacio de fermentación» (pH, temperatura, °Brix) para predecir
                        perfiles de taza. En genética de cultivos, podría interpolar entre variedades (Caturra, Castillo, Geisha) para
                        simular cruces. En suelos, un VAE permitiría inferir de forma probabilística la composición en puntos no
                        medidos de los Llanos y generar mapas de fertilidad más suaves y realistas.
                    </Box>

                    {/* ============== 4. GAN ============== */}
                    <h3>4. Redes generativas antagónicas (GAN, <em>generative adversarial networks</em>): el juego de dos redes</h3>
                    <p>
                        Las GAN, introducidas por <Cita k="goodfellow2014generative" n />, abordan la generación desde la <strong>teoría de
                        juegos</strong>. En lugar de definir una pérdida fija que mida la «calidad» de una imagen (algo notoriamente
                        difícil), una GAN aprende esa noción de forma implícita enfrentando dos redes:
                    </p>
                    <ul>
                        <li><strong>El generador {String.raw`\(G\)`}:</strong> recibe ruido {String.raw`\(z \sim p_z\)`} (la inspiración aleatoria del momento; si además se le impusiera un pie forzado, sería una GAN <em>condicional</em>) y lo transforma en una muestra sintética {String.raw`\(G(z)\)`}. Quiere engañar al discriminador.</li>
                        <li><strong>El discriminador {String.raw`\(D\)`}:</strong> es un clasificador binario que emite la probabilidad {String.raw`\(D(x) \in (0,\,1)\)`} de que una muestra sea real. Quiere no dejarse engañar.</li>
                    </ul>

                    <GanGameSVG />

                    <p>
                        El entrenamiento se formaliza como un <strong>juego minimax de suma cero</strong> sobre una función de valor
                        {String.raw` \(V(D,G)\)`}:
                    </p>
                    <Eq>{String.raw`$$ \min_{G}\max_{D}\, V(D,G) = \mathbb{E}_{x \sim p_{\text{data}}}\big[\log D(x)\big] + \mathbb{E}_{z \sim p_{z}}\big[\log\!\big(1 - D(G(z))\big)\big] $$`}</Eq>
                    <ul>
                        <li><strong>El discriminador maximiza</strong> ({String.raw`\(\max_D\)`}): asigna probabilidad alta a los datos reales y baja a las muestras falsas. Quiere acertar en ambos frentes.</li>
                        <li><strong>El generador minimiza</strong> ({String.raw`\(\min_G\)`}): busca que {String.raw`\(D(G(z)) \to 1\)`}, es decir, que el discriminador crea reales sus falsificaciones.</li>
                    </ul>
                    <p>En la práctica se alternan dos pasos de optimización, cada uno con su pérdida:</p>
                    <Eq>{String.raw`$$ \mathcal{L}_{D} = -\Big( \mathbb{E}_{x \sim p_{\text{data}}}[\log D(x)] + \mathbb{E}_{z \sim p_{z}}[\log(1 - D(G(z)))] \Big) \qquad \mathcal{L}_{G} = \mathbb{E}_{z \sim p_{z}}[\log(1 - D(G(z)))] $$`}</Eq>
                    <p>
                        <strong>En palabras:</strong> {String.raw`\(\mathcal{L}_D\)`} es la tarea del jurado de la piquería: un
                        clasificador binario corriente que aprende a puntuar alto el vallenato auténtico y bajo la imitación.
                        {String.raw` \(\mathcal{L}_G\)`} es la tarea del verseador: ajustar su improvisación hasta que el jurado
                        la dé por auténtica. En cada ronda, una red entrena contra la versión más reciente de la otra.
                    </p>
                    <p>
                        En el equilibrio teórico (un <Termino def="Equilibrio de Nash: ningún jugador mejora cambiando su estrategia unilateralmente.">equilibrio de Nash</Termino>),
                        el generador modela tan bien la distribución real que el discriminador queda reducido a lanzar una moneda:
                        {String.raw` \(D(x) = 1/2\)`} para cualquier muestra.
                    </p>

                    <h4>El truco de la pérdida no saturante (<em>non-saturating loss</em>)</h4>
                    <p>
                        La pérdida original del generador esconde un problema. Al inicio, {String.raw`\(G\)`} produce basura evidente y
                        {String.raw` \(D\)`} la rechaza con altísima confianza ({String.raw`\(D(G(z)) \approx 0\)`}). En esa región,
                        {String.raw` \(\log(1 - D(G(z)))\)`} es casi plana: su gradiente se <strong>satura</strong>, justo cuando
                        {String.raw` \(G\)`} más necesita aprender. La solución estándar (la pérdida no saturante) hace que
                        el generador <strong>maximice</strong> {String.raw`\(\log D(G(z))\)`} en lugar de minimizar el término original:
                    </p>
                    <Eq>{String.raw`$$ \mathcal{L}_{G}^{\text{NS}} = -\,\mathbb{E}_{z \sim p_{z}}\big[\log D(G(z))\big] $$`}</Eq>
                    <p>
                        Conserva el mismo punto de equilibrio pero ofrece gradientes fuertes precisamente cuando las muestras son
                        rechazadas con confianza, acelerando el aprendizaje en las primeras etapas.
                    </p>
                    <p>
                        En código, el detalle clave es el <code>.detach()</code>: al actualizar el discriminador, corta el gradiente hacia el generador
                        para que solo aprenda una red a la vez.
                    </p>
                    <CodeBlock title="GAN: un paso del juego adversario" lang="pytorch" code={`import torch
import torch.nn as nn

# Generador: ruido z (100) -> imagen falsa (784)
G = nn.Sequential(nn.Linear(100, 256), nn.ReLU(),
                  nn.Linear(256, 784), nn.Tanh())
# Discriminador: imagen (784) -> probabilidad de ser real (0..1)
D = nn.Sequential(nn.Linear(784, 256), nn.LeakyReLU(0.2),
                  nn.Linear(256, 1),   nn.Sigmoid())

bce   = nn.BCELoss()   # En la práctica: quitar Sigmoid y usar nn.BCEWithLogitsLoss()
opt_G = torch.optim.Adam(G.parameters(), lr=2e-4)
opt_D = torch.optim.Adam(D.parameters(), lr=2e-4)

def paso(x_real):
    b = x_real.size(0)
    real, fake = torch.ones(b, 1), torch.zeros(b, 1)

    # 1) El discriminador aprende a separar reales de falsas
    x_fake = G(torch.randn(b, 100))
    loss_D = bce(D(x_real), real) + bce(D(x_fake.detach()), fake)
    opt_D.zero_grad(); loss_D.backward(); opt_D.step()

    # 2) El generador busca que D crea reales sus falsificaciones (non-saturating)
    loss_G = bce(D(G(torch.randn(b, 100))), real)   # maximiza log D(G(z))
    opt_G.zero_grad(); loss_G.backward(); opt_G.step()
    return loss_D.item(), loss_G.item()

print(paso(torch.randn(64, 784)))   # (loss_D, loss_G) de un minilote`} />

                    <h4>Colapso de modos e inestabilidad</h4>

                    <ModeCollapseSVG />

                    <Accordion items={[
                        {
                            titulo: <>Colapso de modos (<em>mode collapse</em>)</>,
                            contenido: <span>El generador descubre que un puñado de muestras engaña sistemáticamente a {String.raw`\(D\)`} y se «atrinchera» produciéndolas, ignorando la diversidad real. Es el verseador que, en lugar de improvisar, repite siempre su única estrofa ganadora: técnicamente válida, pero estéril. El modelo deja de cubrir todos los «modos» de la distribución.</span>
                        },
                        {
                            titulo: 'Inestabilidad y oscilación',
                            contenido: <span>Si {String.raw`\(D\)`} se vuelve demasiado bueno demasiado rápido, sus gradientes se saturan y {String.raw`\(G\)`} deja de recibir señal útil; si es demasiado débil, no guía. Mantener ambas redes en un equilibrio dinámico es un acto de funambulismo que a menudo desemboca en pérdidas que oscilan sin converger.</span>
                        },
                    ]} />

                    <CalloutPro tema="warn" titulo="Entrenar una GAN es notoriamente difícil" subtitulo="No hay curva de pérdida monótona que interpretar" icon="fa-triangle-exclamation">
                        A diferencia de un MLP o una CNN supervisada, una GAN <strong>no tiene una curva de pérdida monótona</strong>:
                        una pérdida que baja no garantiza mejores muestras, y una que sube no implica fallo. El equilibrio entre
                        {String.raw` \(G\)`} y {String.raw`\(D\)`} es frágil y muy sensible a la tasa de aprendizaje, la arquitectura y
                        la inicialización. Síntomas a vigilar: <strong>colapso de modos</strong> (todas las muestras se parecen),
                        <strong> gradientes que se desvanecen</strong> (la pérdida de {String.raw`\(G\)`} se estanca porque
                        {String.raw` \(D\)`} «ganó» pronto) y <strong>oscilaciones</strong>. La inspección visual periódica de las
                        muestras suele ser más informativa que las métricas numéricas.
                    </CalloutPro>

                                    <p className="!mb-0">Fue una de las primeras en entrenar GAN convolucionales de forma estable en varios conjuntos de datos y se convirtió en la base práctica para la generación de imágenes con GAN <Cita k="radford2016unsupervised" />.</p>

                                    <p className="!mb-0">Proporciona gradientes útiles incluso cuando las distribuciones real y generada apenas se solapan, y una pérdida que se correlaciona con la calidad de las muestras; como efecto, sus autores no observaron colapso de modos en sus experimentos <Cita k="arjovsky2017wasserstein" />. La restricción de Lipschitz, impuesta al principio recortando los pesos, se sustituyó luego por una penalización del gradiente, la WGAN-GP <Cita k="gulrajani2017improved" />.</p>

                    {/* ============== 5. Modelos de difusión ============== */}
                    <h3>5. Modelos de difusión: destruir para aprender a reconstruir</h3>
                    <p>
                        Desde aproximadamente 2021 <Cita k="dhariwal2021diffusion" />, los <strong>modelos de difusión</strong> son la familia
                        dominante para generar imágenes <Cita k="ho2020denoising, sohldickstein2015deep" />. La idea, de una elegancia notable, invierte el problema: en lugar de generar una imagen de golpe
                        (como una GAN), una red aprende a <strong>deshacer</strong>, paso a paso, un proceso conocido de destrucción de
                        información. El método encadena dos procesos a lo largo de {String.raw`\(T\)`} pasos (cientos o miles):
                    </p>

                    <DiffusionChainSVG />

                    <ul>
                        <li><strong>Proceso directo (<em>forward</em>), que añade ruido:</strong> es <em>fijo, sin parámetros aprendibles</em>. Parte de una imagen real {String.raw`\(x_0\)`} y le añade ruido gaussiano gradualmente hasta que {String.raw`\(x_T\)`} es indistinguible de ruido puro. Cada paso es una cadena de Markov:
                            <Eq>{String.raw`$$ q(x_t \mid x_{t-1}) = \mathcal{N}\!\Big(x_t;\, \sqrt{1 - \beta_t}\,x_{t-1},\, \beta_t I\Big) $$`}</Eq>
                            donde {String.raw`\(\beta_t\)`} es el «calendario de ruido» que controla cuánto se inyecta en cada paso. <em>En palabras:</em> cada paso toma la imagen anterior, la atenúa levemente (el factor {String.raw`\(\sqrt{1-\beta_t}\)`}) y le suma un poco de ruido fresco (la varianza {String.raw`\(\beta_t\)`}): un vertimiento más al río. Como la composición de gaussianas es gaussiana, cualquier nivel de ruido se obtiene en un solo salto <Cita k="ho2020denoising" />:
                            <Eq>{String.raw`$$ q(x_t \mid x_0) = \mathcal{N}\!\Big(x_t;\, \sqrt{\bar{\alpha}_t}\,x_0,\, (1-\bar{\alpha}_t) I\Big), \qquad \bar{\alpha}_t = \prod_{s=1}^{t} (1-\beta_s) $$`}</Eq>
                        </li>
                        <li><strong>Proceso inverso (<em>reverse</em>), que quita ruido:</strong> aquí reside el aprendizaje. Una red {String.raw`\(p_\theta\)`} aprende a revertir cada paso, estimando cómo limpiar el ruido para recuperar una imagen un poco más nítida:
                            <Eq>{String.raw`$$ p_\theta(x_{t-1} \mid x_t) = \mathcal{N}\!\Big(x_{t-1};\, \mu_\theta(x_t, t),\, \Sigma_\theta(x_t, t)\Big) $$`}</Eq>
                            En la práctica, la red {String.raw`\(\epsilon_\theta\)`} se entrena para predecir el ruido añadido con una regresión simple <Cita k="ho2020denoising" />:
                            <Eq>{String.raw`$$ \mathcal{L}_{\text{simple}} = \mathbb{E}_{t,\,x_0,\,\epsilon}\Big[\big\lVert\, \epsilon - \epsilon_\theta\big(\sqrt{\bar{\alpha}_t}\,x_0 + \sqrt{1-\bar{\alpha}_t}\,\epsilon,\; t\big) \big\rVert^{2}\Big] $$`}</Eq>
                            Una vez entrenada, la generación parte de ruido puro {String.raw`\(x_T \sim \mathcal{N}(0, I)\)`} y aplica el proceso inverso {String.raw`\(T\)`} veces.</li>
                    </ul>

                    <AntesDeInteractuar>si a la espiral de la animación se le añade un poco de ruido gaussiano en cada uno de 1.000 pasos, ¿qué forma tendrá la nube al final? ¿Qué calendario de ruido conserva la forma durante más pasos?</AntesDeInteractuar>
                    <div className="my-4">
                        <iframe id="difusion-3d-frame" src="variedad-difusion-3d.html?vista=difusion" title="Animación 3D: proceso de difusión directo e inverso sobre una espiral"
                            className="w-full rounded-lg" style={{ display: 'block', width: '100%', height: 1250, border: 0 }} loading="lazy"></iframe>
                    </div>
                    <PieFigura n="2.3.8" className="-mt-2 mb-4" fuente="elaboración propia (animación interactiva; datos sintéticos con semilla fija).">
                        Proceso de difusión sobre una espiral 3D: el directo sigue {String.raw`\(q(x_t \mid x_0)\)`} con calendario
                        lineal <Cita k="ho2020denoising" /> o coseno <Cita k="nichol2021improved" />; el inverso parte de ruido nuevo
                        y aplica pasos deterministas (DDIM) <Cita k="song2021denoising" /> con el eliminador de ruido ideal calculado
                        sobre los datos de ejemplo, no con una red entrenada.
                    </PieFigura>

                    <Box type="tip" label="Analogía local — la limpieza del río Bogotá">
                        Un río cristalino de páramo es la imagen original {String.raw`\(x_0\)`}. A medida que atraviesa la sabana
                        recibe vertimientos paso a paso —sedimento aquí, residuos allá— hasta volverse una mezcla turbia
                        irreconocible {String.raw`\(x_T\)`}: ese deterioro gradual y predecible es el <strong>proceso directo</strong>{' '}
                        (nadie tuvo que «aprender» a ensuciarlo). Una planta de tratamiento aprende a revertir la contaminación por
                        etapas —sólidos gruesos, sedimentos finos, contaminantes disueltos—: ese es el <strong>proceso inverso</strong>.
                        Bien entrenada, la planta puede tomar <em>cualquier</em> agua turbia (ruido aleatorio) y producir un río limpio
                        plausible que nunca existió exactamente así.
                    </Box>

                    <p>
                        Los modelos de difusión sustentan <strong>DALL·E 2</strong> <Cita k="ramesh2022hierarchical" />, <strong>Stable
                        Diffusion</strong> <Cita k="rombach2022high" /> y buena parte de los generadores actuales de imagen; el DALL·E
                        original (2021), en cambio, era un Transformer autorregresivo que generaba la imagen como una secuencia de
                        <em> tokens</em> <Cita k="ramesh2021zero" />. Sus ventajas frente a las GAN: <strong>estabilidad</strong> (optimizan un
                        objetivo de regresión simple —predecir el ruido— evitando el frágil juego adversario y el colapso de modos),
                        <strong> diversidad</strong> (cubren todo el recorrido de ruido a dato) y <strong>controlabilidad</strong> (se
                        condicionan con naturalidad a texto vía <em>embeddings</em> de Transformers, habilitando «texto a imagen»).
                    </p>
                    <Box type="warn" label="El costo del muestreo">
                        La gran desventaja es el <strong>costo de inferencia</strong>: generar una sola imagen exige ejecutar el
                        proceso inverso decenas o cientos de veces (un paso de red por nivel de ruido), mientras que una GAN o un VAE
                        generan en una sola pasada. Técnicas modernas —muestreadores acelerados <Cita k="song2021denoising" /> y difusión en espacio
                        latente <Cita k="rombach2022high" />— han reducido drásticamente esta brecha.
                    </Box>
                    <Box type="info" label="Nota de vigencia (2026)">
                        Tres ideas explican los generadores actuales: la difusión en el espacio latente de un autocodificador, que
                        abarata cada paso <Cita k="rombach2022high" />; la guía sin clasificador, que refuerza el condicionamiento al texto{' '}
                        <Cita k="ho2022classifier" />; y la lectura de la difusión como una ecuación diferencial —<em>score</em>/SDE{' '}
                        <Cita k="song2021score" />—, de la que derivan el <em>flow matching</em> y el flujo rectificado{' '}
                        <Cita k="lipman2023flow, liu2022flow" />, hoy combinados con redes Transformer en lugar de U-Net{' '}
                        <Cita k="esser2024scaling, peebles2023scalable" />. La destilación permite además muestrear en uno o pocos pasos{' '}
                        <Cita k="song2023consistency" />.
                    </Box>

                    {/* ============== 6. Transformers ============== */}
                    <h3>6. Transformers: autoatención y contexto global</h3>
                    <p>
                        Los Transformers revolucionaron el procesamiento del lenguaje natural al superar las limitaciones de las RNN.
                        Mientras las RNN procesan la información secuencialmente (palabra por palabra) —dificultando las dependencias
                        a larga distancia—, los Transformers introdujeron la <strong>autoatención</strong> (<em>self-attention</em>),
                        que analiza toda la secuencia simultáneamente (paralelización). La idea central: el significado de un elemento
                        no es fijo, sino que depende dinámicamente de su relación con todos los demás.
                    </p>
                    <p>
                        Esta autoatención <strong>generaliza el mecanismo de atención de Bahdanau</strong> (<strong>Capítulo 2.2 §7</strong>):
                        en lugar de alinear dos secuencias distintas —codificador y decodificador—, cada elemento se relaciona con todos los de
                        su <em>propia</em>{' '}
                        secuencia y se prescinde por completo de la recurrencia.
                    </p>

                    <Box type="tip" label="Analogía local — la palabra «vaina»">
                        «Vaina» es un comodín cuyo significado es vacío por sí mismo; solo adquiere valor al conectarse con su
                        contexto. En «Pásame esa vaina de la mesa», la atención la liga a «pásame» y «mesa»: es un <em>objeto
                        físico</em>. En «¡Qué vaina tan buena!», la atención se enfoca en «buena»: es una <em>situación</em>. En «Echó
                        una vaina y se rio», se vuelve <em>chiste</em>. El Transformer resuelve esto con tres vectores: la
                        <strong> consulta</strong> (<em>query</em>, {String.raw`\(Q\)`}) pregunta «¿qué soy en este contexto?»; las{' '}
                        <strong>claves</strong> (<em>keys</em>, {String.raw`\(K\)`}) de las demás palabras ofrecen sus credenciales; y si
                        una clave responde bien a la pregunta, su <strong>valor</strong> (<em>value</em>, {String.raw`\(V\)`}) se transfiere
                        para llenar el significado.
                    </Box>

                    <p>El núcleo del Transformer es la <strong>atención escalada de producto punto</strong> <Cita k="vaswani2017attention" />:</p>
                    <Eq>{String.raw`$$ \mathrm{Attention}(Q, K, V) = \mathrm{softmax}\!\left(\frac{Q K^{\top}}{\sqrt{d_k}}\right) V $$`}</Eq>
                    <ul>
                        <li><strong>Producto punto</strong> ({String.raw`\(Q K^{\top}\)`}): mide la similitud entre la pregunta de una palabra y las claves de todas las demás —una medida de relevancia.</li>
                        <li><strong>Factor de escala</strong> ({String.raw`\(1/\sqrt{d_k}\)`}): evita que los productos punto crezcan en exceso en dimensiones altas, lo que empujaría la softmax hacia regiones de gradiente diminuto.</li>
                        <li><strong>Softmax:</strong> convierte los puntajes en probabilidades que suman 1 —cuánta atención prestar a cada palabra.</li>
                        <li><strong>Suma ponderada</strong> (× {String.raw`\(V\)`}): el resultado es una mezcla de los valores de las palabras relevantes.</li>
                    </ul>
                    <p>
                        <strong>En palabras:</strong> aplicada a «Pásame esa vaina de la mesa», la fórmula calcula cuánto responden
                        «pásame» y «mesa» a la pregunta de «vaina» ({String.raw`\(QK^{\top}\)`}), reparte la atención entre las
                        palabras según esos puntajes (softmax) y rellena el significado de «vaina» con una mezcla de sus valores
                        (× {String.raw`\(V\)`}): un objeto físico que está sobre la mesa. Este ejemplo usa atención
                        <strong> bidireccional</strong>, como un codificador tipo BERT <Cita k="devlin2019bert" />: con la máscara causal que se
                        describe más abajo, «vaina» no vería «mesa», que va después.
                    </p>
                    <SelfAttentionSVG />

                    <p>
                        La fórmula se traduce casi literalmente a código: una sola cabeza de atención son apenas media docena de
                        líneas, donde cada paso —proyectar, puntuar, normalizar con <em>softmax</em> y mezclar— aparece explícito.
                    </p>
                    <CodeBlock title="Autoatención: producto punto escalado" lang="pytorch" code={`import torch
import torch.nn.functional as F

def autoatencion(X, Wq, Wk, Wv):
    Q, K, V = X @ Wq, X @ Wk, X @ Wv                 # proyecciones (en un modelo real, aprendidas)
    d_k = Q.size(-1)
    puntajes = Q @ K.transpose(-2, -1) / d_k**0.5    # QK^T / sqrt(d_k): afinidad token a token
    A = F.softmax(puntajes, dim=-1)                  # pesos de atención: cada fila suma 1
    return A @ V, A                                  # salida = mezcla ponderada de los valores V

torch.manual_seed(0)
X  = torch.randn(4, 8)                # 4 tokens, dimensión del modelo = 8
Wq, Wk, Wv = (torch.randn(8, 8) for _ in range(3))   # tres proyecciones distintas
salida, A = autoatencion(X, Wq, Wk, Wv)
print(salida.shape)   # torch.Size([4, 8])  -> un vector nuevo por token
print(A.shape)        # torch.Size([4, 4])  -> quién atiende a quién
# En la práctica se ejecutan varias cabezas en paralelo: nn.MultiheadAttention
# (o la función fusionada F.scaled_dot_product_attention, PyTorch >= 2.0)`} />

                    <Accordion items={[
                        {
                            titulo: <>Codificación posicional (<em>positional encoding</em>)</>,
                            contenido: <span>Como el Transformer ve todo a la vez, no sabe el orden de las palabras. Se suma a cada <em>embedding</em> una señal de senos y cosenos que codifica su <strong>posición absoluta</strong>; por su forma periódica, además facilita que el modelo infiera distancias relativas <Cita k="vaswani2017attention" />. Es como numerar las baldosas de la foto de fototrampa (Capítulo 2.1): sin ese número, la autoatención ve las mismas piezas sin saber en qué orden van. Muchos modelos actuales codifican directamente la posición relativa <Cita k="shaw2018self" />, p. ej., con rotaciones, como RoPE <Cita k="su2024roformer" />.</span>
                        },
                        {
                            titulo: <>Atención multicabeza (<em>multi-head attention</em>)</>,
                            contenido: <span>El modelo no mira la frase de una sola forma: tiene varias cabezas de atención independientes. Cada cabeza <strong>puede</strong> especializarse en un tipo de relación —sintáctica (quién hizo qué), de tono (queja o halago) o temporal—, aunque esa división no está garantizada ni es siempre interpretable. Esto le da una comprensión «polifónica» del lenguaje.</span>
                        },
                    ]} />

                    <h4>De la atención a la generación: el decodificador autorregresivo</h4>
                    <p>
                        La autoatención explica cómo un Transformer <em>entiende</em> una secuencia, pero ¿cómo la <em>genera</em>?
                        Un Transformer generativo, como los de la familia GPT <Cita k="brown2020language, radford2019language" />, funciona de forma <strong>autorregresiva</strong>: produce el
                        texto <strong>un <em>token</em> a la vez</strong> (un <em>token</em> es la unidad mínima de texto que procesa el modelo: una
                        palabra o, más a menudo, una subpalabra), y cada <em>token</em> nuevo se reinyecta como entrada para predecir el
                        siguiente. Formalmente, modela la probabilidad de la secuencia como un producto de condicionales:
                    </p>
                    <Eq>{String.raw`$$ p(x_1, x_2, \ldots, x_T) = \prod_{t=1}^{T} p_\theta\big(x_t \mid x_1, \ldots, x_{t-1}\big) $$`}</Eq>
                    <p>
                        <strong>En palabras:</strong> la probabilidad de la secuencia completa se descompone en una cadena de
                        decisiones, una por <em>token</em>: cada factor es la probabilidad del <em>token</em> siguiente dado todo lo ya escrito.
                        Es como el verseador de la piquería, que construye la estrofa verso a verso: cada verso nuevo se
                        improvisa condicionado por el pie forzado inicial y por todos los versos ya cantados.
                    </p>

                        generación autorregresiva mediante una softmax con temperatura.
                    </p>
                    <AntesDeInteractuar>en «Pásame esa vaina de la mesa», ¿se espera que «vaina» reparta su atención casi por igual entre las cinco palabras o que la concentre en unas pocas, y en cuáles? En el panel de generación, al bajar la temperatura a 0,3, ¿la distribución del siguiente <em>token</em> se volverá más uniforme o más concentrada?</AntesDeInteractuar>

                    <p>
                        En cada paso, la red estima una distribución sobre el vocabulario y se muestrea el siguiente <em>token</em>. Una
                        <strong> máscara causal</strong> impide que la autoatención «mire hacia el futuro» —a <em>tokens</em> aún no

                        es la cuarta familia generativa del módulo y la que sustenta los grandes modelos de lenguaje actuales.
                    </p>

                    {/* ============== 7. Aplicaciones ============== */}
                    <h3>7. Aplicaciones generativas en Colombia</h3>
                    <CalloutPro tema="info" titulo="De la escasez de datos a la preservación cultural" subtitulo="IA generativa al servicio del territorio (casos ilustrativos)" icon="fa-seedling">
                        En <strong>agricultura</strong>, las GAN pueden generar imágenes sintéticas de hojas enfermas (roya incipiente)
                        para «aumentar» datos escasos y robustecer sistemas de monitoreo antes de que llegue la plaga. En
                        <strong> biodiversidad</strong>, pueden crearse audios sintéticos de fauna elusiva (jaguar) para entrenar
                        clasificadores bioacústicos. En <strong>servicio al cliente</strong>, asistentes conversacionales
                        (<em>chatbots</em>) basados en Transformers pueden entender la jerga local de los usuarios de un banco digital
                        («se me bloqueó la clave», «no me ha bajado la plata»). En <strong>preservación cultural</strong>, los modelos
                        de traducción para lenguas indígenas de bajos recursos (wayuunaiki, nasa yuwe, emberá) pueden facilitar el
                        acceso a derechos.
                    </CalloutPro>

                    <Box type="eth" label="Implicaciones éticas de la IA generativa">
                        Los mismos modelos que aumentan datos de roya permiten fabricar <em>deepfakes</em> de voz o imagen en contextos
                        electorales; los conjuntos de entrenamiento plantean preguntas de autoría y consentimiento; y traducir
                        wayuunaiki, nasa yuwe o emberá exige el consentimiento libre, previo e informado de las comunidades y su
                        soberanía sobre los datos. Los datos sintéticos, además, heredan y pueden amplificar los sesgos del conjunto
                        original. El <em>Marco ético para la inteligencia artificial en Colombia</em> <Cita k="guio2021marco" /> y la
                        política nacional de IA <Cita k="conpes2025ia" /> ofrecen referentes para estas
                        decisiones.
                    </Box>

                    <Box type="tip" label="Síntesis del Capítulo 2.3">
                        Las cuatro familias comparten la idea de la piquería: generar algo nuevo y plausible a partir de una
                        distribución aprendida. El AE comprime y el VAE convierte ese código en una nube navegable (el ajiaco); la
                        GAN añade un juez que obliga a mejorar (el jurado); la difusión aprende a limpiar el ruido por etapas (el río
                        Bogotá); y el Transformer genera <em>token</em> a <em>token</em>, guiado por la atención (la «vaina»). La
                        elección depende del compromiso entre calidad, diversidad, estabilidad y costo de muestreo (tabla de la §5).
                    </Box>

            ['Atención multicabeza (*multi-head attention*)', 'Varias cabezas de atención en paralelo, cada una con sus propias proyecciones Q, K y V; pueden especializarse en relaciones distintas.'],
            ['Autocodificador de eliminación de ruido (DAE)', 'Autocodificador (*denoising autoencoder*) que recibe una entrada corrompida y aprende a reconstruir la versión limpia; capta la estructura robusta de los datos.'],
            ['Convolución separable en profundidad', 'Factoriza la convolución en un filtrado por canal y una mezcla 1×1; reduce las operaciones y es la base de MobileNet.'],
        ];

        const GlosarioSection = () => (
            <div className="prose-usta">
                <SectionHeader title="Glosario" icon={Icons.ListChecks} />

                <Box type="info" label="Sobre este glosario">
                    Reúne, en orden alfabético, los términos clave del Módulo 2: visión (CNN y ViT), datos
                    secuenciales (RNN, LSTM, GRU y atención) y modelos generativos (AE, VAE, GAN, difusión y
                    Transformers). Cada definición es deliberadamente concisa; los detalles y
                    analogías completas residen en los capítulos respectivos.
                </Box>

                <div className="grid md:grid-cols-2 gap-2">
                    {[...GLOSARIO_M2].sort((a, b) => a[0].replace(/\*/g, '').localeCompare(b[0].replace(/\*/g, ''), 'es')).map(([t, d], i) => (
                        <div key={i} className="border border-gray-200 rounded-lg p-3 bg-white">
                            <span className="font-bold text-primary text-sm">{conCursivas(t)}</span>
                            <p className="text-xs text-gray-600 mt-0.5" style={{ margin: '2px 0 0' }}>{conCursivas(d)}</p>
                        </div>
                    ))}
                </div>

                <Box type="tip" label="Total de términos">
                    {GLOSARIO_M2.length} términos clave del módulo. Conviene usarlo como referencia rápida durante
                    la evaluación y como repaso antes del <strong>Módulo 3: Implementación</strong>.
                </Box>

                <Referencias titulo="Bibliografía base" claves={['goodfellow2016deep', 'zhang2023dive', 'chollet2025deep', 'geron2025hands']} />
                <p className="text-sm text-gray-700 mt-3">
                    Las fuentes primarias de cada arquitectura —LeNet, AlexNet, VGG, ResNet, ViT, MLP-Mixer, LSTM, GRU, seq2seq,
                    atención, Transformer, VAE, GAN y difusión— figuran en la lista «Referencias» al final de cada capítulo.
                </p>
                <Box type="info" label="Material de consulta">
                    El <a className="text-primary underline" href="021_material-consulta-modulo-2.html" target="_blank" rel="noopener noreferrer">material
                    de consulta del Módulo 2</a> amplía esta bibliografía con referencias adicionales y enlaces de profundización.
                </Box>
            </div>
        );

        /* ============================================================
           ÍNDICE DEL MÓDULO 2 (sidebar)
        ============================================================ */
        const curriculum = [
            { id: 'portada', title: 'Portada e introducción', icon: 'BookOpen', component: PortadaSection },
            { id: 'cap21', title: '2.1 CNN y Vision Transformers', icon: 'Grid', component: Cap21Section },
            { id: 'cap22', title: '2.2 Secuenciales (RNN/LSTM/GRU) y atención', icon: 'Repeat', component: Cap22Section },
            { id: 'cap23', title: '2.3 Generativos y espacios latentes', icon: 'Sparkles', component: Cap23Section },
            { id: 'eval', title: 'Evaluación final', icon: 'Award', component: EvaluacionSection },
            { id: 'glosario', title: 'Glosario', icon: 'ListChecks', component: GlosarioSection },
        ];

        /* ============================================================
           APP — sidebar + barra de progreso + navegación + reanudar
        ============================================================ */
        const STORAGE_KEY = 'm2_deep_learning_leccion';

        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);   // en móvil y tableta, el menú arranca cerrado

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                const sinMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (cont) cont.scrollTo({ top: 0, behavior: sinMovimiento ? 'auto' : 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all motion-safe:hover:scale-110 usta-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-expanded={sidebarOpen}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`} aria-hidden="true"></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col usta-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">Deep Learning · <span className="text-pink-300">Módulo 2</span></h1>
                            <p className="text-xs text-white/50 mt-1">Arquitecturas de Redes Neuronales Especializadas</p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg usta-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/70 border-t border-white/10">
                            <p>Maestría en Ciencia de Datos · EA-N-F-004</p>
                            <p>NumPy · PyTorch · 3 créditos</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        {/* Barra de progreso */}
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full usta-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3 pl-12 lg:pl-0">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white usta-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                {safeIndex === 0 && (
                                    <>
                                        <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />
                                        <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                            <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">Profundización I · Redes Neuronales</p>
                                            <h1 className="text-2xl font-bold text-primary mb-2">Arquitecturas de Redes Neuronales Especializadas</h1>
                                            <p className="text-gray-600 font-light">De los píxeles a las secuencias y a la generación: redes convolucionales y Vision Transformers, modelos secuenciales (RNN, LSTM, GRU) con atención, y modelos generativos sobre espacios latentes.</p>
                                            <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                                {['Convolución', 'Vision Transformers', 'RNN', 'LSTM/GRU', 'Atención', 'Generativos', 'Difusión', 'Transformers'].map(t => (
                                                    <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                {/* Navegación inferior */}
                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white usta-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="usta-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm"><strong>Módulo 2 · Arquitecturas de Redes Neuronales Especializadas</strong></p>
                                        <p className="text-xs mt-1 text-white/80 italic">Metodología «Ingeniería de Trinchera»: si una arquitectura no corre en Google Colab, no existe.</p>
                                        <p className="text-xs mt-2 text-white/70">Universidad Santo Tomás · Maestría en Ciencia de Datos</p>
                                        <p className="text-xs text-white/70">Profundización I: Redes Neuronales — Deep Learning (EA-N-F-004) · Experto temático: Javier Mauricio Sierra</p>
                                        <p className="text-[10px] mt-2 text-white/50">Material de aprendizaje autónomo. Analogías contextualizadas al entorno colombiano.</p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script defer src="portal-nav.js"></script>
</body>

</html>
