                    {/* ============== 3. Evolución histórica ============== */}
                    <h3>3. Evolución de las arquitecturas CNN</h3>
                    <p>
                        Conocer esta evolución no es cultura general: explica por qué hoy se parte de ResNet o EfficientNet en proyectos
                        de transferencia de aprendizaje.
                    </p>
                    <Timeline eventos={[
                        { year: '1998 · LeNet-5', text: <><Cita k="lecun1998gradient" n /> demuestran que una red aprende patrones visuales desde los píxeles. 7 capas, <em>average pooling</em>, tanh/sigmoide; se evaluó en MNIST y se desplegó para leer cheques bancarios. Limitada a imágenes pequeñas en gris (32×32).</> },
                        { year: '2012 · AlexNet', text: <><Cita k="krizhevsky2012imagenet" n /> ganan ImageNet bajando el error top-5 de ~26 % a 15,3 % <Cita k="russakovsky2015imagenet" />. 8 capas, ReLU, dos GPU en paralelo y <em>dropout</em> para sus 60 millones de parámetros. El «Big Bang» del aprendizaje profundo.</> },
                        { year: '2014 · VGGNet', text: <>Oxford apuesta por la uniformidad <Cita k="simonyan2015very" />: pilas de filtros 3×3. Dos capas 3×3 igualan el campo receptivo de una 5×5 con menos parámetros y más no linealidades. Desventaja: VGG-16 pesa ~138 millones de parámetros.</> },
                        { year: '2014 · GoogLeNet', text: <>El módulo Inception aplica varios tamaños de filtro en paralelo y usa convoluciones 1×1 como cuello de botella: unos 5 millones de parámetros, 12 veces menos que los 60 millones de AlexNet <Cita k="szegedy2015going, szegedy2016rethinking" />.</> },
                        { year: '2015 · ResNet', text: <><Cita k="he2016deep" n /> introducen conexiones de salto: la red aprende F(x) y entrega F(x)+x. Permite entrenar 152 capas y alcanza un error top-5 de 3,57 % (con un ensamble de modelos), por debajo del ~5 % humano de referencia <Cita k="russakovsky2015imagenet" />. Sigue siendo una de las redes troncales (<em>backbones</em>) de referencia; hoy compite con CNN modernizadas como ConvNeXt <Cita k="liu2022convnet" /> y con ViT preentrenados.</> },
                    ]} />
                    <p className="text-xs text-gray-500 italic">
                        Nota sobre las fechas: en la narración se indica el año de presentación de cada trabajo (el <em>preprint</em> o la
                        competición ImageNet); las citas y las referencias usan el año de la versión publicada en actas o revista. Así, VGG
                        —presentada en 2014— se cita como <Cita k="simonyan2015very" n />; ResNet —2015—, como <Cita k="he2016deep" n />, y el ViT
                        —2020—, como <Cita k="dosovitskiy2021image" n />.
                    </p>
                    <Box type="info" label="La intuición de ResNet">
                        Las conexiones de salto permiten que la señal «brinque» capas. La red aprende una función residual
                        {String.raw` \(\mathcal{F}(x)\)`} y la salida es {String.raw`\(\mathcal{F}(x)+x\)`}: si las capas extra no aportan,
                        basta con que {String.raw`\(\mathcal{F}(x)=0\)`} y se propaga la identidad. Así se supera el <strong>problema de
                        degradación</strong> que describieron <Cita k="he2016deep" n />: sin conexiones de salto, añadir capas a una red
                        ya profunda <em>subía</em> el error de entrenamiento.
                    </Box>

                    {/* ============== 4. Vision Transformers ============== */}
                    <h3>4. Vision Transformers (ViT): la alternativa por atención</h3>
                    <p>
                        De LeNet a ResNet se asume que la convolución, con su campo receptivo local, es el operador idóneo para imágenes.
                        En 2020, <Cita k="dosovitskiy2021image" n /> cuestionaron ese supuesto en «An Image is Worth 16×16 Words», adaptando el{' '}
<Termino def="Arquitectura de red basada por completo en atención, surgida en el procesamiento de lenguaje (2017); se detalla en el Capítulo 2.3 §6.">Transformer</Termino> del lenguaje al dominio visual. La idea: en vez de deslizar filtros, trocear la imagen en una
                        cuadrícula de <em>parches</em> cuadrados de lado {String.raw`\(P\)`}. El número de parches es:
                    </p>
                    <Eq>{String.raw`$$ N = \frac{H \cdot W}{P^2} $$`}</Eq>
                    <p>
                        Por ejemplo, una imagen de 224 × 224 con parches de 16 × 16 produce
                        {String.raw` \(N = (224 \cdot 224)/16^2 = 196\)`} parches. Cada parche se aplana, se proyecta linealmente
                        (<em>patch embedding</em>) y la imagen pasa a tratarse como una «frase» de 196 «palabras visuales». Como al trocear
                        se pierde la posición, a cada <em>embedding</em> se le suma una <strong>codificación posicional</strong>. Además, al
                        inicio de la secuencia se antepone un <strong><em>token</em> de clasificación</strong> ([CLS]): tras pasar por el Transformer,
                        su representación final resume la imagen completa y es la que alimenta la cabeza de clasificación.
                    </p>
                    <Box type="tip" label="Analogía local — la foto de fototrampa en baldosas">
                        En lugar de recorrer una foto de fototrampa con una lupa que solo ve un pequeño círculo a la vez (la convolución
                        local), se la divide en una cuadrícula de baldosas numeradas —y ese número <em>es</em> su posición (codificación
                        posicional)— y se comparan de inmediato <em>todas</em> las baldosas entre sí (autoatención) para captar la
                        composición global. Así, el ViT vincula una oreja en una esquina con la cola en la opuesta para confirmar que
                        pertenecen a <em>un solo</em> jaguar.
                    </Box>
                    <p className="text-sm text-gray-600">
                        El mecanismo de <strong>atención</strong> que hace posible esta comparación global no es exclusivo de la visión:
                        se formaliza en el <strong>Capítulo 2.2 §7</strong> (atención de Bahdanau, sobre secuencias) y se generaliza
                        como <strong>autoatención</strong> en el <strong>Capítulo 2.3 §6</strong> (Transformers), donde se introducen
                        los vectores <em>Query</em>, <em>Key</em> y <em>Value</em> (consulta, clave y valor) que aquí operan, implícitamente, entre parches.
                    </p>
                    <Box type="warn" label="Sesgo inductivo y hambre de datos">
                        La convolución trae «de fábrica» dos supuestos útiles —localidad y equivarianza a la traslación: si el objeto se
                        desplaza, su mapa de características se desplaza igual; el <em>pooling</em> añade después una invarianza local—: su
                        <strong> sesgo inductivo</strong> <Cita k="goodfellow2016deep" p="secs. 9.2–9.4" />. El ViT casi carece de él y debe aprenderlo todo desde los datos, por lo que
                        exige conjuntos masivos (de 14 a 300 millones de imágenes, como JFT-300M) o preentrenamiento; con aumento de
                        datos intenso y destilación, DeiT logra entrenarlo solo con ImageNet-1k <Cita k="touvron2021training" />. Con conjuntos de
                        datos pequeños y sin preentrenamiento, una ResNet suele ganarle al ViT.
                    </Box>

                    <h4>CNN vs. ViT: ¿cuál elegir?</h4>
                    <div className="overflow-x-auto my-4">
                        <table>
                            <thead>
                                <tr><th>Criterio</th><th>CNN (p. ej., ResNet)</th><th>Vision Transformer (ViT)</th></tr>
                            </thead>
                            <tbody>
                                <tr><td><strong>Sesgo inductivo</strong></td><td>Fuerte (localidad y equivarianza)</td><td>Débil (aprende la estructura)</td></tr>
                                <tr><td><strong>Datos necesarios</strong></td><td>Moderados (miles de imágenes)</td><td>Muy altos (millones) o preentrenamiento</td></tr>
                                <tr><td><strong>Campo receptivo</strong></td><td>Local, crece con la profundidad</td><td>Global desde la 1.ª capa (atención)</td></tr>
                                <tr><td><strong>Costo de entrenamiento</strong></td><td>Menor en conjuntos de datos pequeños</td><td>Alto; escala con datos y cómputo</td></tr>
                                <tr><td><strong>Latencia en inferencia</strong></td><td>Baja y predecible</td><td>Sensible al n.º de parches ({String.raw`\(N\)`})</td></tr>
                                <tr><td><strong>Interpretabilidad</strong></td><td><Termino def={<>Técnica de interpretabilidad que resalta, como mapa de calor, las regiones de la imagen más influyentes en la predicción de una CNN <Cita k="selvaraju2017grad" />.</>}>Grad-CAM</Termino> / mapas de activación</td><td>Mapas de atención</td></tr>
                            </tbody>
                        </table>
                        <p className="text-xs text-gray-500 italic">Elaboración propia basada en <Cita k="dosovitskiy2021image" n />.</p>
                    </div>
                    <Box type="tip" label="¿CNN o ViT para un proyecto de campo?">
                        Para clasificar fauna con unos pocos miles de imágenes de cámaras trampa, conviene partir de una CNN
                        preentrenada (ResNet, EfficientNet) por su eficiencia muestral. El ViT brilla con preentrenamiento a gran escala
                        —monitoreo satelital de deforestación o colecciones de millones de fotos ciudadanas (iNaturalist), donde la escala
                        juega a su favor— o en arquitecturas híbridas (convolución inicial + atención posterior), que combinan las
                        virtudes de ambos enfoques. Hoy también es habitual reutilizar, sin reentrenarlas, las características de un
                        modelo fundacional autosupervisado, como DINOv2 <Cita k="oquab2023dinov2" />.
                    </Box>

                    {/* ============== Herramienta interactiva: ViT vs CNN ============== */}
                    <h4>ViT por dentro: explorador interactivo</h4>
                    <p>
                        Para fijar las ideas del Vision Transformer, este explorador contrasta CNN y ViT en cuatro vistas: la animación
                        comparativa, la anatomía del ViT (CLS, parches, codificación posicional, atención), el campo receptivo local
                        frente al global, y el bloque codificador (<em>encoder</em>). Las pestañas permiten pasar de una vista a otra, y los
                        controles de reproducción, avanzar paso a paso.
                    </p>
                    <AntesDeInteractuar>en la vista del campo receptivo, al elegir un parche de una esquina, ¿se espera que la CNN lo relacione ya en la primera capa con el parche de la esquina opuesta? ¿Y el ViT? Conviene anotar la respuesta antes de comparar las dos rejillas.</AntesDeInteractuar>
                    <div className="bg-white border border-gray-200 rounded-xl p-2 shadow-sm my-4 overflow-hidden">
                        <iframe id="vit-anatomia-frame" src="vit-anatomia-interactiva.html"
                            title="Explorador interactivo: Vision Transformer frente a CNN (anatomía, campo receptivo, codificador)"
                            className="w-full rounded-lg" style={{ display: 'block', width: '100%', height: 1600, border: 0 }} loading="lazy"></iframe>
                        <p className="text-xs text-gray-500 italic text-center mt-2 px-2">
                            Explorador interactivo ViT vs CNN: animación comparativa, anatomía del ViT, campo receptivo (local/global)
                            y bloque codificador. Fuente: elaboración propia.
                        </p>
                    </div>

                    <Box type="info" label="Un tercer camino — el MLP-Mixer (2021)">
                        Si la convolución aporta localidad y el ViT aporta atención, ¿hace falta alguna de las dos? <Cita k="tolstikhin2021mlp" n />{' '}
                        mostraron que <strong>no</strong>: el <strong>MLP-Mixer</strong> prescinde de ambas y solo usa perceptrones
                        multicapa. La clave es que <em>no</em> es el MLP «aplanado» que fracasó al inicio del capítulo: primero trocea la
                        imagen en parches (como el ViT) y luego alterna dos MLP con pesos compartidos —uno que <strong>mezcla entre
                        parches</strong> (<em>token-mixing</em>) y otro que <strong>mezcla entre canales</strong> (<em>channel-mixing</em>)—,
                        esquivando así la explosión de parámetros. La lección de fondo: lo decisivo no fue el operador (convolución,
                        atención o MLP), sino el <strong>troceo en parches y el sesgo inductivo</strong>. El precio es coherente con lo ya
                        visto: con un sesgo inductivo aún más débil que el del ViT, el Mixer solo iguala a CNN y Transformers cuando se
                        preentrena a escala masiva (JFT-300M), por lo que rara vez es la opción para los datos escasos del trabajo de campo.
                    </Box>

                    {/* ============== 5. Transfer learning ============== */}
                    <h3>5. Transferencia de aprendizaje y ajuste fino</h3>
                    <p>
                        En Colombia, el acceso a grandes clústeres y a millones de imágenes etiquetadas (p. ej., orquídeas del Chocó) es
                        limitado. La solución estándar es la <strong>transferencia de aprendizaje</strong> (<em>transfer learning</em>):
                        reutilizar el «conocimiento» de una red entrenada en un conjunto de datos masivo, como ImageNet <Cita k="deng2009imagenet" />, con 1,2 millones de imágenes. Las capas iniciales aprenden bordes, colores
                        y texturas <em>universales</em> <Cita k="yosinski2014transferable" />: un borde en la foto de un perro es igual a un borde en una radiografía.
                    </p>
                    <Tabs tabs={[
                        {
                            label: 'Extracción de características',
                            content: (
                                <div>
                                    <p className="!mt-0"><strong>Cuándo:</strong> conjunto de datos pequeño y similar al original.</p>
                                    <p><strong>Técnica:</strong> se <em>congelan</em> todos los pesos de la red preentrenada (p. ej., ResNet50), se quita la última capa de 1.000 clases y se reemplaza por una nueva adaptada al problema (p. ej., enfermo/sano). Solo se entrena esa capa final.</p>
                                    <p className="!mb-0"><strong>Por qué:</strong> con pocos datos, reentrenar todo causaría sobreajuste inmediato; la red actúa como extractor fijo de características.</p>
                                </div>
                            )
                        },
                        {
                            label: <>Ajuste fino (<em>fine-tuning</em>)</>,
                            content: (
                                <div>
                                    <p className="!mt-0"><strong>Cuándo:</strong> conjunto de datos grande o muy distinto (imágenes médicas, satelitales, espectrales).</p>
                                    <p><strong>Técnica:</strong> se parte de los pesos preentrenados y se <em>descongelan</em> algunas (o todas) las últimas capas convolucionales, entrenando con una tasa de aprendizaje muy baja.</p>
                                    <p className="!mb-0"><strong>Por qué:</strong> los rasgos de alto nivel de ImageNet (ojos de perro, llantas) no sirven para tumores en rayos X; la red debe reajustar sus filtros superiores al nuevo dominio.</p>
                                </div>
                            )
                        },
                    ]} />
                    <Box type="warn" label="Precaución con la tasa de aprendizaje">
                        Las capas descongeladas requieren una tasa de aprendizaje <strong>menor</strong> que la nueva capa de
                        clasificación, para no destruir con gradientes grandes los pesos preentrenados útiles al inicio del ajuste.
                    </Box>

                    {/* ============== 6. Biodiversidad ============== */}
                    <h3>6. Biodiversidad: ojos digitales en la selva</h3>
                    <p>
                        Colombia es uno de los países con mayor biodiversidad del planeta y ocupa el primer lugar mundial en especies de
                        aves, orquídeas y mariposas <Cita k="sibcolombia2026cifras" />. Las cámaras trampa generan miles de imágenes, muchas de ellas disparos en vacío
                        (fotos sin animales, por ramas o viento). En la estrategia de ciencia participativa «Días de Cámara Trampa»,
                        que organizaron en 2023 el Instituto Humboldt, la Red Colombiana de Fototrampeo y Neotropical Innovation{' '}
                        <Cita k="elcolombiano2023dias" />, la ciudadanía instaló cámaras en todo el país; clasificar a mano esos volúmenes es inviable.
                    </p>
                    <CalloutPro tema="info" titulo="Wildlife Insights y la reidentificación de individuos" subtitulo="CNN al servicio de la conservación" icon="fa-paw">
                        La plataforma <strong>Wildlife Insights</strong>, una alianza de Conservation International, Google y otras
                        organizaciones de conservación <Cita k="ahumada2020wildlife" />, usa CNN entrenadas con
                        millones de imágenes globales para filtrar fotos vacías y clasificar especies elusivas como el oso andino,
                        la danta, el jaguar y el tigrillo en la Orinoquía y los Andes. Más allá de la especie, los patrones únicos de
                        pelaje permiten la <strong>reidentificación de individuos</strong> («Jaguar #04»), clave para estimar densidades
                        poblacionales reales y verificar corredores biológicos Andes–Amazonía.
                    </CalloutPro>

                    {/* ============== 7. Optimización para Edge ============== */}
                    <h3>7. Cómputo en el borde: llevar el modelo al campo</h3>
                    <p>
                        Una cámara trampa en la Orinoquía o un sensor de hojas de café en el Quindío imponen restricciones severas: sin
                        internet, energía de paneles o baterías y procesadores diminutos. Desplegar el modelo en el propio dispositivo,
                        sin depender de la nube, es el <strong>cómputo en el borde</strong> (<em>edge computing</em>), que exige técnicas
                        de optimización.
                    </p>
                    <h4>Cuantización (FP32 → INT8)</h4>
                    <p>
                        Por defecto los pesos se guardan como flotantes de 32 bits. La <strong>cuantización</strong> baja la precisión,
                        típicamente a enteros de 8 bits, mapeando el rango continuo a 256 niveles. El modelo queda ≈ 4 veces más pequeño
                        y, en hardware con aritmética entera de 8 bits, más rápido <Cita k="jacob2018quantization" />. Para 25 millones de parámetros:
                    </p>
                    <Eq>{String.raw`$$ 25\,000\,000 \times 4\,\text{bytes} \approx 100\,\text{MB (FP32)} \;\longrightarrow\; 25\,000\,000 \times 1\,\text{byte} \approx 25\,\text{MB (INT8)} $$`}</Eq>
                    <p>
                        Esa reducción es la diferencia entre que el modelo quepa o no en un dispositivo de borde modesto —una placa tipo
                        Raspberry Pi o Jetson en una cámara trampa con batería, en pleno dosel—. En un microcontrolador, cuya memoria es dos
                        o tres órdenes de magnitud menor que la de un teléfono, solo caben redes diseñadas para ese presupuesto <Cita k="lin2020mcunet" />.
                    </p>
                    <Accordion items={[
                        {
                            titulo: <>Poda (<em>pruning</em>): eliminar conexiones inútiles</>,
                            contenido: <span>Elimina pesos o neuronas con contribución cercana a cero, generando una red dispersa (<em>sparse</em>). Comparte el espíritu de la regularización L1 —favorecer modelos dispersos—, aunque difiere en el modo: L1 induce la dispersión <em>durante</em> el entrenamiento penalizando los pesos, mientras la poda retira pesos ya entrenados según su magnitud <Cita k="han2015learning" />. Si una conexión apenas aporta, retirarla aligera sin sacrificar exactitud. <em>Analogía local:</em> como el guardaparques que despeja una trocha —retira la maleza improductiva para que el sendero, la información útil, quede transitable—.</span>
                        },
                        {
                            titulo: <>Destilación del conocimiento (<em>knowledge distillation</em>)</>,
                            contenido: <span>Entrena un modelo pequeño («estudiante») para imitar las salidas de uno grande y preciso («maestro»). En vez de aprender solo de etiquetas duras, absorbe las probabilidades suaves del maestro, capturando matices <Cita k="hinton2015distilling" />. <em>Analogía local:</em> es el guardaparques novato («estudiante») que, observando al rastreador veterano («maestro»), aprende a reconocer un jaguar por su huella sin revisar millones de fotos de fototrampa.</span>
                        },
                        {
                            titulo: 'Arquitecturas eficientes por diseño',
                            contenido: <span><strong>MobileNet</strong> <Cita k="howard2017mobilenets" /> sustituye la convolución estándar por convoluciones separables en profundidad (<em>depthwise separable</em>), reduciendo operaciones. <strong>EfficientNet</strong> <Cita k="tan2019efficientnet" /> aplica un escalado compuesto que equilibra profundidad, anchura y resolución. Ambas son puntos de partida naturales para la transferencia de aprendizaje en el borde.</span>
                        },
                    ]} />
                    <CalloutPro tema="warn" titulo="El compromiso exactitud ↔ tamaño" subtitulo="Comprimir nunca es gratis" icon="fa-triangle-exclamation">
                        Cada técnica de compresión recorta recursos a cambio de cierta pérdida de exactitud. Una cuantización demasiado
                        agresiva o una poda excesiva pueden degradar el modelo hasta confundir un jaguar con un ocelote, el par manchado del
                        caso del Módulo 1. En un escenario crítico —alertar a tiempo de la presencia de un jaguar cerca de un poblado para
                        prevenir conflictos con el ganado— conviene medir el desempeño del modelo
                        comprimido sobre el conjunto de prueba y verificar que la caída de sensibilidad permanezca dentro de un margen
                        tolerable antes de desplegarlo en campo.
                    </CalloutPro>

                    <Box type="tip" label="Puntos clave del Capítulo 2.1">
                        <ul>
                            <li>La <strong>convolución</strong> sustituye la conexión total por conectividad local y pesos compartidos: conserva la estructura espacial con pocos parámetros.</li>
                            <li>Al apilar capas surge la jerarquía <strong>bordes → texturas → partes → objeto</strong>, y el <em>pooling</em> aporta tolerancia a la posición.</li>
                            <li><strong>ResNet</strong> permite entrenar redes muy profundas gracias a las conexiones de salto.</li>
                            <li>El <strong>ViT</strong> cambia el sesgo inductivo de la convolución por atención global y exige preentrenamiento masivo.</li>
                            <li>Con pocos miles de fotos de cámaras trampa conviene partir de una <strong>CNN preentrenada</strong>; para llevarla al campo se comprime y se mide sobre el conjunto de prueba.</li>
                        </ul>
                        El Capítulo 2.2 pasa de la rejilla espacial a los datos ordenados en el tiempo.
                    </Box>

        /* ============================================================

        const AtencionSVG = () => {

                        <text x={gx + (3 * cel) / 2} y="40" textAnchor="middle" fontSize="13" fill="#3D008D" fontWeight="bold">Pesos de atención α</text>

                                <rect x={gx + i * cel} y={gy + t * cel} width={cel} height={cel}

                                <text x={gx + i * cel + cel / 2} y={gy + t * cel + cel / 2 + 4} textAnchor="middle"

                        <text x={gx + (3 * cel) / 2} y={gy + 3 * cel + 56} textAnchor="middle" fontSize="11" fill="#64748B" fontStyle="italic">

        const Cap22Section = () => {

            return (
                <div ref={ref} className="prose-usta">
                    <SectionHeader title="Capítulo 2.2 — Modelos secuenciales (RNN, LSTM, GRU) y atención" icon={Icons.Repeat} />

                    <p>
                        Mientras que las redes convolucionales asumen una rejilla espacial estática, una enorme porción de los datos
                        relevantes para Colombia es <strong>secuencial</strong>: el clima de los Andes, el habla del español
                        colombiano, las transacciones bancarias y los pedidos de domicilios suceden <em>en el tiempo</em>, y el
                        significado de cada elemento depende de lo que vino antes. Este capítulo recorre por qué las redes
                        recurrentes (<strong>RNN</strong>) capturan esa memoria pero colapsan en secuencias largas, cómo la
                        <strong> LSTM</strong> y la <strong>GRU</strong> rescatan el gradiente con compuertas, y cómo el
                        <strong> mecanismo de atención</strong> de Bahdanau rompió el cuello de botella del esquema
                        codificador-decodificador (<em>encoder-decoder</em>), abriendo la puerta a los Transformers del <strong>Capítulo 2.3 §6</strong>.
                    </p>

                    {/* ============== 1. Fenomenología de los datos secuenciales ============== */}
                    <h3>1. La naturaleza secuencial del dato colombiano</h3>
                    <p>
                        En el aprendizaje supervisado clásico se asume que las muestras son <em>independientes e idénticamente
                        distribuidas</em>. La realidad, sin embargo, es dependiente del contexto histórico. Dos dominios lo ilustran
                        con nitidez.
                    </p>
                    <h4>Series hidrometeorológicas</h4>
                    <p>
                        La ubicación ecuatorial y la trisección de los Andes generan en Colombia regímenes de lluvia bimodales y
                        unimodales que no caben en el patrón de cuatro estaciones. La precipitación de Bogotá sigue un
                        régimen bimodal. En la estación El Dorado Catam, las normales climatológicas 1991–2020 del IDEAM dan
                        unos 33 mm en enero, el mes más seco, y de 107 a 117 mm en las temporadas lluviosas (abril-mayo y
                        octubre-noviembre), cuando llueve 12 o 13 días al mes, frente a unos 5 en enero <Cita k="ideam2026normales" />.
                        Así, el estado del clima en un mes <em>t</em> está correlacionado no
                        solo con <em>t−1</em>, sino con la estacionalidad de <em>t−12</em>. Un modelo de riego de precisión para
                        café o flores que ignore la secuencia de lluvias de los meses previos (y, a escala diaria, de las últimas
                        semanas) recomendaría riegos innecesarios.
                    </p>
                    <h4>Lenguaje natural: el español colombiano</h4>
                    <p>
                        Una «bolsa de palabras» que ignora el orden pierde el significado pragmático. «No <strong>dar papaya</strong>»
                        no habla de fruta sino de evitar riesgos; «<strong>hacer una vaca</strong>» es una colecta, no un bovino. El
                        modelo debe procesar <Termino def={<><em>Token</em>: unidad mínima en que se segmenta el texto (palabra, subpalabra o carácter) antes de pasar por la red.</>}><em>token</em></Termino> a{' '}
                        <em>token</em> manteniendo un «estado mental» que evolucione con la oración.
                    </p>
                    <div className="overflow-x-auto my-4">
                        <table>
                            <thead>
                                <tr><th>Expresión</th><th>Sentido literal (sin secuencia)</th><th>Sentido pragmático (con secuencia)</th></tr>
                            </thead>
                            <tbody>
                                <tr><td><strong>«No dar papaya»</strong></td><td>No entregar una fruta</td><td>Evitar exponerse a un riesgo</td></tr>
                                <tr><td><strong>«Estar moscas»</strong></td><td>Presencia de insectos</td><td>Estar alerta y atento</td></tr>
                                <tr><td><strong>«Hacer una vaca»</strong></td><td>Acción sobre un bovino</td><td>Colecta de dinero entre amigos</td></tr>
                                <tr><td><strong>«Tener un filo»</strong></td><td>Objeto cortante</td><td>Tener mucha hambre</td></tr>
                            </tbody>
                        </table>
                        <p className="text-xs text-gray-500 italic">Ambigüedad semántica y dependencia secuencial en modismos colombianos.</p>
                    </div>

                    {/* ============== 2. RNN y desvanecimiento del gradiente ============== */}
                    <h3>2. Redes recurrentes (RNN): memoria y su talón de Aquiles</h3>
                    <p>
                        Una <Termino def="Recurrent Neural Network: red que reutiliza el mismo bloque en cada paso temporal, propagando un estado oculto que actúa como memoria.">RNN</Termino> es
                        una serie de copias de la misma red, cada una pasando un mensaje a su sucesora <Cita k="olah2015understanding" />. En el instante {String.raw`\(t\)`} recibe
                        la entrada {String.raw`\(x_t\)`} y el estado oculto previo {String.raw`\(h_{t-1}\)`}, y calcula el nuevo estado, que es la memoria
                        acumulada <Cita k="elman1990finding, goodfellow2016deep@cap. 10" />:
                    </p>
                    <Eq>{String.raw`$$ h_t = \tanh\!\big(W_{xh}\, x_t + W_{hh}\, h_{t-1} + b_h\big) \qquad \hat{y}_t = \mathrm{softmax}\!\big(W_{hy}\, h_t + b_y\big) $$`}</Eq>

                    <RNNUnrolledSVG />

                    <p>
                        El entrenamiento usa <strong>retropropagación a través del tiempo</strong> (BPTT), descrita por <Cita k="werbos1990backpropagation" n />: como los pesos se comparten
                        en todos los pasos, el gradiente total es la suma de los gradientes de cada paso. El problema aparece en el
                        término {String.raw`\(\partial h_t / \partial h_k\)`}, que se expande como un producto de matrices jacobianas:
                    </p>
                    <Eq>{String.raw`$$ \frac{\partial h_t}{\partial h_k} = \prod_{j=k+1}^{t} \frac{\partial h_j}{\partial h_{j-1}} = \prod_{j=k+1}^{t} \mathrm{diag}\!\big(1-h_j^{2}\big)\, W_{hh} $$`}</Eq>
                    <p className="text-xs text-gray-500 italic">
                        Cada factor es el jacobiano {String.raw`\(\partial h_j/\partial h_{j-1}\)`} (como {String.raw`\(h_j=\tanh(\cdot)\)`}, su derivada es {String.raw`\(1-h_j^2\)`}); el producto se ordena de {String.raw`\(j=t\)`}, a la izquierda, a {String.raw`\(j=k+1\)`}. Con la convención de gradiente (vectores columna) cada factor aparece traspuesto, {String.raw`\(W_{hh}^{\top}\,\mathrm{diag}(1-h_j^2)\)`}, y el orden se invierte; la norma —y por tanto el argumento del desvanecimiento— es la misma.
                    </p>
                    <p>
                        Como la derivada de {String.raw`\(\tanh\)`} está acotada en {String.raw`\((0,\,1]\)`}, si el mayor valor singular de
                        {String.raw` \(W_{hh}\)`} es menor que 1 (condición suficiente), el producto de {String.raw`\(t-k\)`} matrices tiende
                        <strong> exponencialmente a cero</strong>: el <strong>desvanecimiento del gradiente</strong> <Cita k="bengio1994learning, pascanu2013difficulty" />. La red aprende
                        dependencias cortas, pero olvida las largas.
                    </p>

                    <VanishingGradientSVG />

                    <Box type="tip" label="Analogía local — el teléfono roto">
                        Como en el juego del <strong>teléfono roto</strong>: una frase —«aumentar la producción de café suave»— se
                        susurra de oído en oído a lo largo de una fila de 50 personas (los pasos temporales) y en cada relevo se
                        distorsiona un poco; al final llega irreconocible (la señal hacia adelante se <strong>desvanece</strong>). Y como
                        nadie puede rastrear en qué oído se torció el mensaje para enmendarlo, la <em>corrección</em> (el gradiente)
                        tampoco alcanza a las primeras personas de la fila: la red ajusta bien lo reciente, pero no las dependencias de
                        largo plazo.
                    </Box>
                    <Box type="warn" label="El olvido en dos dominios">
                        <strong>Clima:</strong> una RNN predice la lluvia de mañana a partir de la de hoy, pero no captura el ciclo de
                        «El Niño», que depende de temperaturas oceánicas de hace meses. <strong>Lenguaje:</strong> en «Los
                        estudiantes… que estudiaron toda la noche, están…», la RNN olvida el sujeto plural y rompe la concordancia.
                    </Box>

                    <h4>La otra cara: la explosión del gradiente</h4>
                    <p>
                        El mismo producto de jacobianas explica el fenómeno opuesto. Si el mayor valor singular de
                        {String.raw` \(W_{hh}\)`} <strong>supera</strong> 1, el producto de {String.raw`\(t-k\)`} matrices
                        <strong> puede</strong> crecer <strong>exponencialmente</strong>: el <strong>gradiente explota</strong>, las actualizaciones se
                        vuelven enormes y la pérdida diverge (suelen aparecer valores <span className="inline-code">NaN</span>).
                        Es la imagen especular del desvanecimiento: con {String.raw`\(\lVert W_{hh}\rVert < 1\)`} la señal se
                        diluye y con {String.raw`\(\lVert W_{hh}\rVert > 1\)`} puede amplificarse sin control; esa es la condición necesaria de la explosión <Cita k="pascanu2013difficulty" />.
                    </p>
                    <Box type="warn" label={<>Remedio estándar — recorte de gradiente (<em>gradient clipping</em>)</>}>
                        El <strong>recorte de gradiente</strong> <Cita k="pascanu2013difficulty" /> acota la norma del gradiente a un umbral {String.raw`\(\tau\)`} antes de cada actualización: si
                        {String.raw` \(\lVert g\rVert > \tau\)`}, se reescala
                        {String.raw` \(g \leftarrow \tau\, g/\lVert g\rVert\)`}, conservando la <em>dirección</em> del gradiente
                        pero limitando su <em>magnitud</em>. Es la salvaguarda habitual al entrenar redes recurrentes con
                        secuencias largas: barata, sencilla y muy eficaz frente a la divergencia. El desvanecimiento, en cambio,
                        no se corrige recortando: exige el rediseño arquitectónico que introduce la LSTM.
                    </Box>

                    {/* ============== 3. LSTM ============== */}
                    <h3>3. LSTM: ingeniería de la memoria persistente</h3>
                    <p>
                        Para mantener dependencias largas, <Cita k="hochreiter1997long" n /> introdujeron la <strong>Long Short-Term
                        Memory</strong> (LSTM). Su innovación es separar la memoria en dos canales: el <strong>estado de celda</strong>
                        {String.raw` \(C_t\)`} —memoria de largo plazo, una «cinta transportadora» con interacciones lineales, en la
                        metáfora de <Cita k="olah2015understanding" n />— y el <strong>estado oculto</strong> {String.raw`\(h_t\)`} (memoria de corto plazo y salida
                        filtrada). El flujo se regula con tres <strong>compuertas</strong> sigmoides que emiten valores entre 0
                        (cerrar/olvidar) y 1 (abrir/recordar). La compuerta de olvido, hoy estándar, la introdujeron <Cita k="gers2000learning" n />:
                        la LSTM original de 1997 solo tenía compuertas de entrada y de salida.
                    </p>

                    <LSTMCellSVG cita={<Cita k="olah2015understanding" n />} />

                    <h4>Compuerta de olvido</h4>
                    <p>Decide qué información del estado anterior {String.raw`\(C_{t-1}\)`} es irrelevante y debe descartarse:</p>
                    <Eq>{String.raw`$$ f_t = \sigma\!\big(W_{xf}\, x_t + W_{hf}\, h_{t-1} + b_f\big) $$`}</Eq>

                    <h4>Compuerta de entrada y candidatos</h4>
                    <p>El filtro de selección {String.raw`\(i_t\)`} decide qué se actualiza y el generador {String.raw`\(\tilde{C}_t\)`} crea los nuevos valores candidatos:</p>
                    <Eq>{String.raw`$$ i_t = \sigma\!\big(W_{xi}\, x_t + W_{hi}\, h_{t-1} + b_i\big) \qquad \tilde{C}_t = \tanh\!\big(W_{xc}\, x_t + W_{hc}\, h_{t-1} + b_c\big) $$`}</Eq>

                    <h4>Actualización del estado de celda</h4>
                    <p>El paso clave: el nuevo estado se obtiene por <strong>suma</strong>, no por multiplicación encadenada.</p>
                    <Eq>{String.raw`$$ C_t = f_t \odot C_{t-1} + i_t \odot \tilde{C}_t $$`}</Eq>
                    <Box type="tip" label="Analogía local — la cinta transportadora">
                        El estado de celda {String.raw`\(C_t\)`} es una cinta transportadora que recorre toda la secuencia: en cada
                        estación (cada paso temporal), la compuerta de olvido le quita parte de la carga y la de entrada le suma piezas
                        nuevas, pero la cinta no se reemplaza. Por eso la información viaja lejos sin degradarse. La metáfora es de{' '}
                        <Cita k="olah2015understanding" n />.
                    </Box>
                    <Box type="info" label="Por qué la suma protege el gradiente">
                        Por la ruta directa de la cinta, {String.raw`\(\partial C_t/\partial C_{t-1}=\mathrm{diag}(f_t)\)`}: no intervienen
                        ni {String.raw`\(W_{hh}\)`} ni la derivada de tanh, solo la compuerta de olvido. Mientras la red mantenga
                        {String.raw` \(f_t\approx 1\)`}, el gradiente cruza muchos pasos casi intacto. Es el <em>carrusel de error
                        constante</em> de <Cita k="hochreiter1997long" n />, que en su versión original fijaba ese factor en 1. Si
                        {String.raw` \(f_t\)`} se cierra, la cinta olvida a propósito, y con ella el gradiente. Por eso la LSTM puede
                        recordar el sujeto plural del inicio de una oración larga («Los estudiantes… que estudiaron toda la noche…»)
                        para concordar el verbo al final.
                    </Box>

                    <h4>Compuerta de salida</h4>
                    <p>Decide qué parte del estado interno {String.raw`\(C_t\)`} se expone como salida {String.raw`\(h_t\)`}:</p>
                    <Eq>{String.raw`$$ o_t = \sigma\!\big(W_{xo}\, x_t + W_{ho}\, h_{t-1} + b_o\big) \qquad h_t = o_t \odot \tanh(C_t) $$`}</Eq>

                    <CalloutPro tema="info" titulo="Detección de fraude: una anomalía secuencial (caso ilustrativo)" subtitulo="El fraude es una anomalía secuencial, no un evento aislado" icon="fa-shield-halved">
                        Considérese el sistema antifraude de un banco digital. Una compra de 200.000 pesos es normal. Pero la <em>secuencia</em> consulta de saldo (Bogotá) → compra pequeña
                        (Bogotá) → compra grande (Miami, una hora después) es físicamente imposible. La LSTM mantiene en {String.raw`\(C_t\)`} el
                        perfil de comportamiento del usuario; al procesar la transacción de Miami detecta la discrepancia con el estado
                        previo y dispara una verificación. La <strong>compuerta de olvido</strong> es la que aprende a descartar la
                        ubicación antigua cuando el cliente se muda, evitando marcar como fraude todas sus nuevas compras legítimas.
                    </CalloutPro>

                    {/* ============== 4. GRU + comparativa ============== */}
                    <h3>4. GRU: eficiencia y velocidad</h3>
                    <p>
                        <Cita k="cho2014learning" n /> propusieron la <strong>Gated Recurrent Unit</strong> (GRU) como simplificación de la LSTM:
                        fusiona el estado de celda y el estado oculto en un solo vector, y combina olvido y entrada en una única
                        <strong> compuerta de actualización</strong> {String.raw`\(z_t\)`}. Una <strong>compuerta de reinicio</strong>
                        {String.raw` \(r_t\)`} decide cuánto del pasado se ignora al construir el candidato:
                    </p>
                    <Eq>{String.raw`$$ z_t = \sigma\!\big(W_{xz} x_t + W_{hz} h_{t-1} + b_z\big) \qquad r_t = \sigma\!\big(W_{xr} x_t + W_{hr} h_{t-1} + b_r\big) $$`}</Eq>
                    <Eq>{String.raw`$$ \tilde{h}_t = \tanh\!\big(W_{xh} x_t + W_{hh}\,(r_t \odot h_{t-1}) + b_h\big) \qquad h_t = z_t\odot h_{t-1} + (1 - z_t)\odot \tilde{h}_t $$`}</Eq>

                    <GRUCellSVG cita={<Cita k="cho2014learning" n />} />

                    <p className="text-xs text-gray-500 italic">
                        Nota de convención: este material sigue a <Cita k="cho2014learning" n />, a PyTorch (<span className="inline-code">nn.GRU</span>)
                        y a <Cita k="goodfellow2016deep" n p="ec. 10.45" />: {String.raw`\(z_t\)`} pondera la memoria {String.raw`\(h_{t-1}\)`}, de modo que
                        {String.raw` \(z_t\approx 1\)`} conserva el estado y {String.raw`\(z_t\approx 0\)`} lo reemplaza por el candidato. Otras
                        fuentes <Cita k="chung2014empirical, olah2015understanding" /> escriben la forma espejo
                        {String.raw` \(h_t=(1-z_t)\odot h_{t-1}+z_t\odot\tilde{h}_t\)`}; ambas son equivalentes al renombrar
                        {String.raw` \(z_t\leftrightarrow 1-z_t\)`}. PyTorch, además, aplica el reinicio después de la transformación lineal,
                        {String.raw` \(\tilde{h}_t=\tanh\big(W_{xh}x_t+b_{xh}+r_t\odot(W_{hh}h_{t-1}+b_{hh})\big)\)`}, y llama {String.raw`\(n_t\)`} al candidato.
                    </p>

                    <p>El estado nuevo es una <strong>interpolación lineal</strong> entre el pasado y el candidato, regulada por {String.raw`\(z_t\)`}. ¿LSTM o GRU?</p>

                    <Tabs tabs={[
                        {
                            label: 'Comparativa LSTM vs GRU',
                            content: (
                                <div className="overflow-x-auto">
                                    <table>
                                        <thead>
                                            <tr><th>Característica</th><th>LSTM</th><th>GRU</th></tr>
                                        </thead>

                                            <tr><td><strong>Mecanismo de olvido</strong></td><td>Explícito (compuerta de olvido)</td><td>Implícito en {String.raw`\(z_t\)`}</td></tr>

                                    <p className="!mb-0"><strong>GRU:</strong> empresas emergentes, aplicaciones móviles, computación en el borde agrícola (IoT) y sistemas con reentrenamiento frecuente, como una plataforma de domicilios, donde la ligereza y el menor costo por paso son críticos.</p>

                    <CodeBlock title="LSTM vs GRU: huella de parámetros" lang="pytorch" code={`import torch
import torch.nn as nn

# Mismo tamaño de entrada y de estado oculto para comparar de forma justa
lstm = nn.LSTM(input_size=10, hidden_size=20, batch_first=True)
gru  = nn.GRU(input_size=10, hidden_size=20, batch_first=True)

# Se cuentan los parámetros entrenables de cada celda recurrente
n_lstm = sum(p.numel() for p in lstm.parameters())
n_gru  = sum(p.numel() for p in gru.parameters())
print("LSTM:", n_lstm)              # 2560 = 4 * (20*10 + 20*20 + 2*20)
print("GRU :", n_gru)               # 1920 = 3 * (20*10 + 20*20 + 2*20)
print("Ratio GRU/LSTM:", n_gru / n_lstm)  # 0.75  -> la GRU usa 3/4

# LSTM: 4 conjuntos de pesos (compuertas de entrada, olvido y salida, y candidato)
# GRU : 3 conjuntos (compuertas de actualización y de reinicio, y candidato)

# Secuencia de ejemplo: (lote=1, pasos=5, características=10)
seq = torch.randn(1, 5, 10)
out_lstm, _ = lstm(seq)
out_gru,  _ = gru(seq)
print(out_lstm.shape)  # torch.Size([1, 5, 20])
print(out_gru.shape)   # torch.Size([1, 5, 20])`} />

                    {/* ============== 5. Caso Rappi ============== */}
                    <h3>5. Caso ilustrativo: la demanda de última milla de Rappi</h3>
                    <p>
                        Rappi, el primer «unicornio» colombiano (empresa emergente valorada en más de 1.000 millones de dólares, 2018),
                        promete con su servicio <em>Turbo</em> entregas ultrarrápidas. En un servicio así, la predicción de demanda no
                        puede ser un proceso por lotes nocturno: debe ocurrir en tiempo real.
                    </p>
                    <Box type="warn" label="El problema en tiempo real">
                        Predecir cuántos pedidos de hamburguesas o cerveza se harán en <strong>Chapinero Alto</strong> en los próximos
                        20 minutos, a partir de la secuencia de pedidos de la última hora, el clima actual (una lluvia repentina en
                        Bogotá dispara la demanda) y el tráfico.
                    </Box>
                    <p>
                        Para este problema, una GRU <strong>sería</strong> una elección razonable por dos razones: <strong>latencia</strong>{' '}
                        (al ser más ligera, la inferencia es casi instantánea en los servidores de despacho) y <strong>volatilidad de
                        corto plazo</strong> (lo ocurrido hace 30 minutos pesa más que lo de hace seis meses, justo lo que la GRU captura
                        bien). La comprensión de pedidos en lenguaje natural, en cambio, corresponde hoy a modelos basados en
                        Transformers (Capítulo 2.3 §6); la GRU se reserva para la serie numérica de la demanda.
                    </p>

                    {/* ============== 6. Codificador-decodificador y su cuello de botella ============== */}
                    <h3>6. El cuello de botella del esquema codificador-decodificador</h3>
                    <p>
                        Resuelta la memoria dentro de una sola secuencia, surge un reto mayor: la <Termino def="Convertir una secuencia de entrada en otra secuencia de salida, posiblemente de longitud distinta (traducir, resumir, responder).">transducción</Termino> de una
                        secuencia de entrada en otra de longitud distinta (traducir del <Termino def="Lengua del pueblo wayuu, hablada en La Guajira (Colombia) y el noroeste de Venezuela.">wayuunaiki</Termino> al
                        español, resumir un documento jurídico, responder en un asistente conversacional o <em>chatbot</em>). <Cita k="sutskever2014sequence" n /> —y, en paralelo, <Cita k="cho2014learning" n />— propusieron la arquitectura
                        <strong> secuencia a secuencia</strong> (seq2seq), con dos redes recurrentes acopladas:
                    </p>
                    <Pipeline steps={[
                        { num: '1', title: <>Codificador (<em>encoder</em>)</>, desc: 'Una RNN (LSTM/GRU) lee toda la entrada y la comprime en un solo vector de contexto c.' },
                        { num: '2', title: 'Vector de contexto c', desc: 'Resumen de tamaño fijo de todo el mensaje: \\(c = h_T\\).' },
                        { num: '3', title: <>Decodificador (<em>decoder</em>)</>, desc: <>Otra RNN se inicializa con c y genera la salida <em>token</em> por <em>token</em>.</> },
                    ]} />
                    <Eq>{String.raw`$$ c = h_T = \mathrm{Codificador}(x_1, x_2, \ldots, x_T) \qquad P(y_t \mid y_1,\ldots,y_{t-1},\, c) = g(s_t,\, y_{t-1},\, c) $$`}</Eq>
                    <p>
                        donde {String.raw`\(s_t\)`} es el estado oculto del decodificador en el paso {String.raw`\(t\)`} y {String.raw`\(g\)`}, su capa de salida.
                        El problema estructural: toda la información —tenga la secuencia cinco o quinientas palabras— debe caber en un
                        <strong> único vector {String.raw`\(c\)`} de tamaño fijo</strong>. En secuencias largas ese vector se satura y
                        los primeros elementos quedan diluidos, reproduciendo a otra escala el desvanecimiento de información.
                    </p>
                    <Box type="tip" label="Analogía local — el resumen en una sola frase">
                        Un mensajero del centro de Bogotá lleva un recado entre dos oficinas con una regla estricta: solo puede
                        memorizar <strong>una sola frase</strong>, sin papel. Si le dictan «dígale a don Jaime que la reunión es el
                        martes», funciona. Pero si le dictan tres párrafos con cifras, proveedores en Barranquilla y condiciones de
                        pago, se ve forzado a comprimirlo todo en esa única frase y entrega un resumen empobrecido: conserva el final
                        y olvida el inicio. El vector {String.raw`\(c\)`} es exactamente esa «única frase»: un canal de capacidad fija.
                    </Box>

                    {/* ============== 7. Atención de Bahdanau ============== */}
                    <h3>7. El mecanismo de atención de Bahdanau</h3>
                    <p>
                        <Cita k="bahdanau2015neural" n /> propusieron una idea a la vez simple y profunda: en lugar de obligar al decodificador a
                        depender de un único vector estático, se le permite <strong>mirar de regreso a toda la secuencia de entrada</strong>{' '}
                        en cada paso y decidir dinámicamente qué partes son relevantes. El codificador ya no descarta sus estados
                        intermedios: conserva todos los {String.raw`\(h_1, h_2, \ldots, h_T\)`}. En cada paso {String.raw`\(t\)`} del decodificador se
                        construye un <strong>vector de contexto dinámico</strong> {String.raw`\(c_t\)`} como suma ponderada:
                    </p>
                    <Eq>{String.raw`$$ c_t = \sum_{i=1}^{T} \alpha_{t,i}\, h_i $$`}</Eq>
                    <p>
                        Los pesos {String.raw`\(\alpha_{t,i}\)`} indican cuánta atención presta el decodificador al elemento {String.raw`\(i\)`} de la
                        entrada al producir la salida {String.raw`\(t\)`}. Se obtienen normalizando con softmax una puntuación de afinidad
                        entre {String.raw`\(s_{t-1}\)`}, el estado oculto del decodificador en el paso anterior, y cada {String.raw`\(h_i\)`}:
                    </p>
                    <Eq>{String.raw`$$ \alpha_{t,i} = \frac{\exp\!\big(\mathrm{score}(s_{t-1},\, h_i)\big)}{\sum_{j=1}^{T}\exp\!\big(\mathrm{score}(s_{t-1},\, h_j)\big)} $$`}</Eq>
                    <p>En la formulación original (atención <strong>aditiva</strong>), la puntuación es una pequeña red con parámetros aprendibles {String.raw`\(v_a,\, W_a,\, U_a\)`}:</p>
                    <Eq>{String.raw`$$ \mathrm{score}(s_{t-1},\, h_i) = v_a^{\top}\, \tanh\!\big(W_a\, s_{t-1} + U_a\, h_i\big) $$`}</Eq>

                    <AtencionSVG />

                    <Box type="tip" label="Analogía local — el examen con apuntes abiertos">
                        El seq2seq clásico es un examen de memoria: el estudiante resume todo en una hoja mental (el vector
                        {String.raw` \(c\)`}) y responde sin volver al texto. La atención es un <strong>examen con apuntes abiertos</strong>:
                        para cada pregunta el estudiante recorre de nuevo el documento y subraya con resaltador las frases relevantes
                        para <em>esa</em> pregunta. Los pesos {String.raw`\(\alpha_{t,i}\)`} son justamente la intensidad del resaltador sobre
                        cada parte del texto.
                    </Box>

                    {/* ============== 8. Puente a Transformers ============== */}
                    <h3>8. Puente hacia los Transformers</h3>
                    <CalloutPro tema="info" titulo="De la atención a la autoatención" subtitulo="La pregunta que abrió la era de los Transformers" icon="fa-arrow-right-arrow-left">
                        El mecanismo de Bahdanau conecta <em>dos</em> secuencias distintas (entrada y salida) y todavía descansa sobre
                        una red recurrente que procesa los datos paso a paso. La pregunta natural fue: ¿qué ocurre si una secuencia se
                        «presta atención a sí misma», relacionando cada elemento con todos los demás dentro del mismo texto, y se
                        elimina por completo la recurrencia? Esa generalización —la <strong>autoatención</strong> (<em>self-attention</em>)— es
                        el corazón de la arquitectura <strong>Transformer</strong> <Cita k="vaswani2017attention" />, que se desarrolla en el <strong>Capítulo 2.3 §6</strong>{' '}
                        junto con sus vectores de consulta, clave y valor (<em>query</em>, <em>key</em> y <em>value</em>). La recurrencia, sin
                        embargo, no ha desaparecido: desde 2023 resurge en variantes de espacio de estados y de memoria exponencial
                        —Mamba <Cita k="gu2023mamba" /> y xLSTM <Cita k="beck2024xlstm" />— que combinan entrenamiento paralelo con un costo de
                        inferencia constante por paso.
                    </CalloutPro>

                    <Box type="tip" label="Puntos clave del Capítulo 2.2">
                        <ul>
                            <li>Las <strong>RNN</strong> comparten pesos en el tiempo, pero el producto de jacobianas desvanece (o hace explotar) el gradiente; el recorte acota la explosión, no el desvanecimiento.</li>
                            <li>La <strong>LSTM</strong> separa la memoria en {String.raw`\(C_t\)`} y {String.raw`\(h_t\)`} y la actualiza por suma: por la cinta, el gradiente solo se escala por la compuerta de olvido.</li>
                            <li>La <strong>GRU</strong> fusiona los estados, usa dos compuertas y tiene menos parámetros; en muchas tareas rinde como la LSTM.</li>
                            <li>El <strong>seq2seq</strong> comprime todo en un vector {String.raw`\(c\)`} de tamaño fijo, y la <strong>atención de Bahdanau</strong> lo sustituye por un contexto dinámico {String.raw`\(c_t\)`}, antesala de la autoatención (Capítulo 2.3 §6).</li>
                        </ul>
                    </Box>

                    <SectionHeader title="Capítulo 2.3 — Modelos generativos y espacios latentes" icon={Icons.Sparkles} />

                    <p>
                        Los <strong>modelos generativos</strong> representan un cambio de paradigma. A diferencia de los modelos
                        discriminativos —que trazan fronteras entre clases (distinguir un cafetal sano de uno con roya)—, los
                        generativos aprenden la estructura intrínseca de los datos: modelan la distribución de probabilidad

                    <Box type="tip" label="Analogía local — la piquería vallenata">

                        algo nuevo y plausible a partir de una distribución aprendida —en vez de copiar lo memorizado— es el corazón
                        común a las cuatro familias de este capítulo.</strong> El público y el jurado que abuchean los versos flojos
                        añaden una segunda vuelta —la tensión entre <em>crear</em> y <em>juzgar</em>—, que es precisamente el motor de

                    </Box>

                    {/* ============== 1. Espacios latentes y manifolds ============== */}
                    <h3>1. Espacios latentes y la hipótesis de la variedad</h3>
                    <p>
                        La arquitectura de buena parte de los modelos generativos —autocodificadores, GAN y difusión latente; no así
                        los modelos autorregresivos de lenguaje ni la difusión en píxeles— gira en torno a la manipulación de vectores en un
                        <strong> espacio latente</strong> {String.raw`\(z \in \mathbb{R}^{d}\)`}. La <strong>hipótesis de la
                        variedad</strong> (<em>manifold hypothesis</em>) sostiene que los datos de alta dimensión (una foto de {String.raw`\(1024 \times 1024\)`}{' '}
                        píxeles) no llenan todo el espacio, sino que se concentran en una superficie curvada de dimensión mucho
                        menor incrustada en él: una <em>variedad</em> <Cita k="bengio2013representation, goodfellow2016deep@sec. 5.11.3" />. El modelo aprende a mapear puntos de esa variedad simplificada a la complejidad del
                        espacio de datos real.
                    </p>

                    <AntesDeInteractuar>los puntos A y B de la animación están muy cerca en el espacio de tres dimensiones. ¿Son parecidos para un modelo que aprendió la hoja? ¿Qué pasa con su distancia al desenrollarla?</AntesDeInteractuar>
                    <div className="my-4">
                        <iframe id="variedad-3d-frame" src="variedad-difusion-3d.html?vista=variedad" title="Animación 3D: hipótesis de la variedad (rollo suizo que se desenrolla)"

                    </div>

                        Hipótesis de la variedad (<em>manifold</em>): la nube parece ocupar un volumen, pero cada punto tiene solo dos
                        coordenadas propias sobre una hoja enrollada. Desenrollada, la distancia en línea recta entre A y B coincide con la
                        distancia a lo largo de la variedad; en el rollo, la recta atraviesa espacio vacío.
                    </PieFigura>

                    <ul>
                        <li><strong>Muestreo:</strong> para generar un dato, se toma un vector aleatorio {String.raw`\(z\)`} (ruido) y se pasa por una red profunda que aplica transformaciones no lineales sucesivas hasta convertir el ruido simple en una estructura compleja (imagen, audio).</li>
                        <li><strong>Navegabilidad:</strong> si el espacio latente es continuo, moverse suavemente por él produce transiciones graduales y coherentes entre datos —se puede «interpolar» entre dos conceptos.</li>
                    </ul>
