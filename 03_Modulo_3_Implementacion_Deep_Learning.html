    <!-- ============================================================
         MODELOS PUROS DE LAS SIMULACIONES DEL MÓDULO 3 (auditoría 2026-10, M3-D-04)
         S-A «¿Qué llena la bodega?» (VRAM, Cap 3.2) y S-B «El mesero y el chef» (prefetch, Cap 3.3).
         JavaScript plano, sin React ni DOM: lo usan las vistas (CalculadoraVRAM, LineaPrefetch) y el arnés
         ?selftest=1, que comprueba los casos V1–V8 y P1–P3 de la ficha M3-C con tolerancia de ±0,5 %.
         Unidades: bytes y milisegundos; 1 GB = 1e9 B (decimal), como en las fichas de prueba.
    ============================================================ -->
    <script>
        (function () {
            'use strict';
            var IMG = 3 * 224 * 224 * 4;   // imagen de 224 × 224 × 3 en FP32: bytes por muestra

            /* Activaciones guardadas para el paso hacia atrás, por muestra (224 × 224, train(), deduplicadas por
               almacenamiento), medidas por M3-C con torch.autograd.graph.saved_tensors_hooks (PyTorch 2.12).
               medidaConEntrada: la medición incluye el tensor de entrada, porque la primera capa lo guarda
               (MLP: 1.168 = 784 + 256 + 128). En FP32 es el MISMO tensor que el término «entrada», así que
               activaciones() lo descuenta para no contarlo dos veces (auditoría M3-E8). Con autocast, la primera
               capa guarda una copia en 16 bits (otro almacenamiento) y la entrada FP32 sigue viva: no se descuenta. */
            var MODELOS = {
                resnet50: { nombre: 'ResNet-50', tipo: 'cnn', P: 25557032, a32: 85.91e6, a16: 44.78e6, entrada: IMG, medidaConEntrada: true },
                resnet18: { nombre: 'ResNet-18', tipo: 'cnn', P: 11689512, a32: 22.18e6, a16: 12.15e6, entrada: IMG, medidaConEntrada: true },
                mobilenetv3l: { nombre: 'MobileNetV3-L', tipo: 'cnn', P: 5483032, a32: 44.11e6, a16: 23.31e6, entrada: IMG, medidaConEntrada: true },
                mlp: { nombre: 'MLP 784-256-128-10', tipo: 'mlp', P: 235146, a32: 1168 * 4, a16: null, entrada: 784 * 4, medidaConEntrada: true },
                transformer125m: { nombre: 'Transformer 125M (L = 12, h = 768, a = 12, v = 50.257)', tipo: 'transformer', P: 124439808, L: 12, h: 768, a: 12, v: 50257 },
                personalizado: { nombre: 'Personalizado', tipo: 'personalizado' }
            };
            /* Capacidad nominal (GB decimales) y reserva fija para el contexto CUDA (estimación). */
            var GPUS = {
                t4: { nombre: 'T4 de Colab (≈15 GB visibles)', cap: 15e9 },
                p100: { nombre: 'P100 de Kaggle (16 GB)', cap: 16e9 },
                l4: { nombre: 'L4 (24 GB)', cap: 24e9 },
                a100_40: { nombre: 'A100 (40 GB)', cap: 40e9 },
                a100_80: { nombre: 'A100 (80 GB)', cap: 80e9 }
            };
            var RESERVA = 0.5e9;
            var OPT = { sgd: 0, momento: 4, adam: 8 };        // estados del optimizador en FP32, bytes por parámetro
            var OPT_ZERO = { sgd: 4, momento: 8, adam: 12 };  // K de ZeRO: copia FP32 de los pesos + estados (Rajbhandari et al., 2020)

            function modeloDe(c) {
                var m = MODELOS[c.modelo];
                if (m.tipo !== 'personalizado') return m;
                var P = Math.max(0, +c.pMillones || 0) * 1e6;
                var a = Math.max(0, +c.actMB || 0) * 1e6;
                return { nombre: 'Personalizado', tipo: 'personalizado', P: P, a32: a, a16: null, entrada: IMG };
            }

            /* Estados del modelo. precision: 'fp32' | 'amp' (autocast de PyTorch) | 'zero' (contabilidad 2P + 2P + KP). */
            function estados(P, precision, opt, inferencia) {
                if (inferencia) return { pesos: (precision === 'fp32' ? 4 : 2) * P, gradientes: 0, optimizador: 0, cacheAmp: 0 };
                if (precision === 'zero') return { pesos: 2 * P, gradientes: 2 * P, optimizador: OPT_ZERO[opt] * P, cacheAmp: 0 };
                return { pesos: 4 * P, gradientes: 4 * P, optimizador: OPT[opt] * P, cacheAmp: precision === 'amp' ? 2 * P : 0 };
            }

            /* Activaciones. Transformer: Korthikanti et al. (2023), ec. 1 y §4.3 con t = p = 1, en 16 bits y con
               los logits en FP32; atención eficiente → sin el término 5as/h; recomputación completa → 2sbh por capa.
               En FP32 se duplican los términos de 16 bits (aproximación). CNN y MLP: b · a_muestra; sin medición en
               16 bits se supone la mitad. En FP32, a_muestra excluye la entrada si la medición la incluía (véase
               MODELOS); el valor del modelo personalizado se toma tal cual, sin la entrada. */
            function activaciones(m, c) {
                var b = c.b;
                if (m.tipo === 'transformer') {
                    var s = c.s, h = m.h, sbh = s * b * h;
                    var capa = c.recomputacion ? 2 * sbh : sbh * (34 + (c.eficiente ? 0 : 5 * m.a * s / h));
                    var resto = sbh * 5, logits = sbh * 4 * m.v / h;
                    if (c.precision === 'fp32') { capa *= 2; resto *= 2; }
                    return m.L * capa + resto + logits;
                }
                var a = c.precision === 'fp32' ? (m.medidaConEntrada ? m.a32 - m.entrada : m.a32) : (m.a16 != null ? m.a16 : m.a32 / 2);
                return b * a;
            }

            function entrada(m, c) {
                return m.tipo === 'transformer' ? c.b * c.s * 8 : c.b * m.entrada;   // fichas int64 o imagen FP32
            }

            /* c = { modelo, b, precision, opt, inferencia, s, eficiente, recomputacion, pMillones, actMB, gpu } */
            function vram(c) {
                var m = modeloDe(c);
                var e = estados(m.P, c.precision, c.opt, c.inferencia);
                var comp = {
                    pesos: e.pesos, gradientes: e.gradientes, optimizador: e.optimizador, cacheAmp: e.cacheAmp,
                    activaciones: activaciones(m, c), entrada: entrada(m, c)
                };
                var total = 0; for (var k in comp) total += comp[k];
                var gpu = GPUS[c.gpu] || GPUS.t4;
                var util = gpu.cap - RESERVA;
                return {
                    P: m.P, comp: comp, total: total,
                    estados: e.pesos + e.gradientes + e.optimizador + e.cacheAmp,
                    capacidad: gpu.cap, util: util, cabe: total <= util
                };
            }

            /* Lote máximo = ⌊(capacidad − reserva − estados) / (activaciones + entrada por muestra)⌋ */
            function loteMaximo(c) {
                var r1 = vram(Object.assign({}, c, { b: 1 }));
                var porMuestra = r1.comp.activaciones + r1.comp.entrada;
                var libre = r1.util - r1.estados;
                if (libre <= 0 || porMuestra <= 0) return libre <= 0 ? 0 : Infinity;
                return Math.floor(libre / porMuestra);
            }

            /* Ahorro de la precisión mixta frente a FP32 con la misma configuración (en FP32 se compara con autocast). */
            function ahorroAMP(c) {
                var fp32 = vram(Object.assign({}, c, { precision: 'fp32' })).total;
                var mixta = vram(Object.assign({}, c, { precision: c.precision === 'fp32' ? 'amp' : c.precision })).total;
                return fp32 > 0 ? 1 - mixta / fp32 : 0;
            }

            /* S-B · eventos discretos y deterministas (idéntico a sims2.py de M3-C).
               Lote k: empieza a prepararse en s_k = max(trabajador libre, g_{k−(B+W)}) y queda listo en r_k = s_k + tCPU.
               En la GPU: g_k = max(e_{k−1}, r_k) y e_k = g_k + tCopia + tGPU.
               B = 0 (sin precarga): el proceso principal prepara cada lote cuando la GPU lo pide (secuencial). */
            function simularPrefetch(p) {
                var N = p.N, tc = p.tCPU, tg = p.tGPU, W = p.B === 0 ? 1 : Math.max(1, p.W), B = p.B, tcp = p.tCopia || 0;
                var prep = [], gpu = [], g = [], libre = [], ePrev = 0, k, w, i;
                for (i = 0; i < W; i++) libre.push(0);
                for (k = 0; k < N; k++) {
                    var s;
                    if (B === 0) { w = 0; s = ePrev; }
                    else {
                        w = 0; for (i = 1; i < W; i++) if (libre[i] < libre[w]) w = i;
                        var j = k - (B + W);
                        s = Math.max(libre[w], j >= 0 ? g[j] : 0);
                    }
                    var r = s + tc; libre[w] = r;
                    prep.push({ k: k, w: w, ini: s, fin: r });
                    var gk = Math.max(ePrev, r), ek = gk + tcp + tg;
                    g.push(gk); gpu.push({ k: k, ini: gk, copia: tcp, fin: ek }); ePrev = ek;
                }
                var T = ePrev;
                return { T: T, U: T > 0 ? N * tg / T : 0, prep: prep, gpu: gpu, W: W, secuencial: N * (tc + tcp + tg) };
            }

            /* ---------- Arnés de verificación (?selftest=1) ---------- */
            function selftest() {
                var GB = 1e9, MB = 1e6, casos = [];
                var tol = 0.005;
                function chk(id, desc, obtenido, esperado) {
                    var ok = Math.abs(obtenido - esperado) <= tol * Math.abs(esperado);
                    casos.push({ id: id, desc: desc, obtenido: obtenido, esperado: esperado, ok: ok });
                }
                var base = { modelo: 'resnet50', b: 32, precision: 'fp32', opt: 'adam', inferencia: false, gpu: 't4', s: 1024, eficiente: false, recomputacion: false };
                function cfg(o) { return Object.assign({}, base, o); }
                var v1 = vram(base);
                chk('V1', 'ResNet-50 · pesos (MB)', v1.comp.pesos / MB, 102.2);
                chk('V1', 'gradientes (MB)', v1.comp.gradientes / MB, 102.2);
                chk('V1', 'Adam (MB)', v1.comp.optimizador / MB, 204.5);
                chk('V1', 'activaciones sin la entrada (MB)', v1.comp.activaciones / MB, 2729.9);
                chk('V1', 'entrada (MB)', v1.comp.entrada / MB, 19.3);
                chk('V1', 'activaciones + entrada = 32 × medida (MB) [entrada contada una vez]', (v1.comp.activaciones + v1.comp.entrada) / MB, 2749.1);
                chk('V1', 'total (GB)', v1.total / GB, 3.158);
                chk('V1', 'activaciones (%)', 100 * v1.comp.activaciones / v1.total, 86.4);
                chk('V1', 'optimizador (%)', 100 * v1.comp.optimizador / v1.total, 6.47);
                var v2 = vram(cfg({ precision: 'amp' }));
                chk('V2', 'caché AMP (MB)', v2.comp.cacheAmp / MB, 51.1);
                chk('V2', 'activaciones AMP (MB)', v2.comp.activaciones / MB, 1433.0);
                chk('V2', 'total AMP (GB)', v2.total / GB, 1.912);
                chk('V2', 'ahorro AMP (%)', 100 * ahorroAMP(cfg({ precision: 'amp' })), 39.45);
                chk('V3', 'ResNet-18 FP32 (GB)', vram(cfg({ modelo: 'resnet18' })).total / GB, 0.897);
                chk('V3', 'ResNet-18 AMP (GB)', vram(cfg({ modelo: 'resnet18', precision: 'amp' })).total / GB, 0.618);
                chk('V3', 'ahorro (%)', 100 * ahorroAMP(cfg({ modelo: 'resnet18', precision: 'amp' })), 31.0);
                var v4 = vram(cfg({ modelo: 'mlp', b: 64 }));
                chk('V4', 'MLP · P', v4.P, 235146);
                chk('V4', 'total (MB)', v4.total / MB, 4.061);
                chk('V4', 'optimizador (%)', 100 * v4.comp.optimizador / v4.total, 46.3);
                var tr = { modelo: 'transformer125m', s: 1024, b: 8, precision: 'zero' };
                var v5 = vram(cfg(tr)), v5e = vram(cfg(Object.assign({}, tr, { eficiente: true })));
                chk('V5', 'Transformer · estados 16P (GB)', v5.estados / GB, 1.991);
                chk('V5', 'activaciones (GB)', v5.comp.activaciones / GB, 10.285);
                chk('V5', 'total (GB)', v5.total / GB, 12.28);
                chk('V5', 'total con atención eficiente (GB)', v5e.total / GB, 6.24);
                var v6 = vram(cfg({ modelo: 'transformer125m', s: 512, b: 1, precision: 'zero', recomputacion: true }));
                chk('V6', 'activaciones con recomputación (MB)', v6.comp.activaciones / MB, 114.3);
                chk('V6', 'estados del modelo (%)', 100 * v6.estados / v6.total, 94.6);
                chk('V6', 'Adam, 12P (%)', 100 * v6.comp.optimizador / v6.total, 70.9);
                chk('V7', 'ZeRO 1,5B · 16P (GB)', vram(cfg({ modelo: 'personalizado', pMillones: 1500, actMB: 0, precision: 'zero' })).estados / GB, 24.0);
                chk('V8', 'lote máx. T4 · ResNet-50 FP32', loteMaximo(base), 164);
                chk('V8', 'lote máx. T4 · ResNet-50 AMP', loteMaximo(cfg({ precision: 'amp' })), 309);
                chk('V8', 'lote máx. T4 · ResNet-18 FP32', loteMaximo(cfg({ modelo: 'resnet18' })), 645);
                chk('V8', 'lote máx. T4 · ResNet-18 AMP', loteMaximo(cfg({ modelo: 'resnet18', precision: 'amp' })), 1120);
                function pf(N, tc, tg, W, B) { return simularPrefetch({ N: N, tCPU: tc, tGPU: tg, W: W, B: B, tCopia: 0 }); }
                var a = pf(10, 30, 50, 1, 0), bb = pf(10, 30, 50, 1, 1);
                chk('P1', 'sin precarga · T (ms)', a.T, 800); chk('P1', 'sin precarga · U (%)', 100 * a.U, 62.5);
                chk('P1', 'B = 1 · T (ms)', bb.T, 530); chk('P1', 'B = 1 · U (%)', 100 * bb.U, 94.3);
                var c0 = pf(10, 80, 50, 1, 0), c1 = pf(10, 80, 50, 1, 1), c2 = pf(10, 80, 50, 2, 2);
                chk('P2', 'sin precarga · T (ms)', c0.T, 1300); chk('P2', 'sin precarga · U (%)', 100 * c0.U, 38.5);

                chk('P3', 'N = 3 · sin precarga (ms)', pf(3, 70, 70, 1, 0).T, 420);
                chk('P3', 'N = 3 · B = 1 (ms)', pf(3, 70, 70, 1, 1).T, 280);
                var d0 = pf(100, 70, 70, 1, 0), d1 = pf(100, 70, 70, 1, 1);
                chk('P3', 'N = 100 · sin precarga (ms)', d0.T, 14000);
                chk('P3', 'N = 100 · B = 1 (ms)', d1.T, 7070);
                chk('P3', 'N = 100 · U (%)', 100 * d1.U, 99.0);
                chk('P3', 'N = 100 · aceleración (×)', d0.T / d1.T, 1.98);
                var fallas = casos.filter(function (x) { return !x.ok; }).length;
                return { ok: fallas === 0, total: casos.length, fallas: fallas, casos: casos };
            }

            window.M3SIMS = {
                MODELOS: MODELOS, GPUS: GPUS, RESERVA: RESERVA,
                vram: vram, loteMaximo: loteMaximo, ahorroAMP: ahorroAMP, simularPrefetch: simularPrefetch
            };
            window.__m3sims = { selftest: selftest, resultado: null };

            if (/[?&]selftest=1(&|$)/.test(location.search)) {
                var r = selftest();
                window.__m3sims.resultado = r;
                if (console.table) console.table(r.casos);
                console.info('M3 selftest S-A/S-B: ' + (r.ok ? 'PASA' : 'FALLA') + ' (' + (r.total - r.fallas) + '/' + r.total + ')');
                var pintar = function () {
                    var d = document.createElement('div');

                    var h = '<strong>Selftest S-A/S-B: ' + (r.ok ? 'PASA' : 'FALLA') + ' (' + (r.total - r.fallas) + '/' + r.total + ', ±0,5 %)</strong>';
                    r.casos.forEach(function (x) {
                        h += '<div style="color:' + (x.ok ? '#15803D' : '#B91C1C') + '">' + x.id + ' ' + x.desc + ': ' + (+x.obtenido.toFixed(4)) + ' / ' + x.esperado + (x.ok ? ' ✓' : ' ✗') + '</div>';
                    });
                    d.innerHTML = h;
                    document.body.appendChild(d);
                };
                if (document.body) pintar(); else document.addEventListener('DOMContentLoaded', pintar);
            }
        })();

        /* ============================================================

        const CodeBlock = ({ title, code, lang = 'python' }) => {
            const [copied, setCopied] = useState(false);
            const [hidden, setHidden] = useState(false);

            const handleCopy = () => {
                navigator.clipboard.writeText(code).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            const meta = {
                python: { icon: 'fab fa-python text-yellow-400', label: title || 'Python' },
                pytorch: { icon: 'fas fa-fire text-orange-400', label: title || 'PyTorch' },
                shell: { icon: 'fas fa-terminal text-green-400', label: title || 'Terminal' },
                text: { icon: 'fas fa-file-alt text-gray-300', label: title || 'Salida' },
            }[lang] || { icon: 'fas fa-code text-gray-300', label: title || 'Código' };

            const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const protect = (src, patterns) => {
                const tokens = [];
                let out = src;
                patterns.forEach(({ re, cls }) => {
                    out = out.replace(re, (m) => {
                        const ch = String.fromCharCode(0xE000 + tokens.length);
                        tokens.push({ text: m, cls });
                        return ch;
                    });
                });
                return { out, tokens };
            };
            // Reconstruye los <span>: cada caracter del Area de Uso Privado (>= 0xE000)
            // que se inserto en "protect" se reemplaza por su token original.
            const restore = (src, tokens) => {
                let out = '';
                for (const ch of src) {
                    const code = ch.charCodeAt(0);
                    const t = (code >= 0xE000 && code <= 0xF8FF) ? tokens[code - 0xE000] : null;
                    out += t ? `<span class="${t.cls}">${t.text}</span>` : ch;
                }
                return out;
            };

            // Todo el resaltado se hace en UNA sola pasada de "protect": cada coincidencia
            // (strings y comentarios primero, luego palabras clave, tipos y numeros) se
            // sustituye por un caracter opaco que no es \w ni digito; asi ninguna regex
            // posterior puede tocar el marcado ya generado.
            const highlightPython = (raw) => {
                const escaped = escapeHtml(raw);
                const { out, tokens } = protect(escaped, [
                    { re: /"""[\s\S]*?"""|'''[\s\S]*?'''/g, cls: 'text-green-500 italic' },
                    { re: /#[^\n]*/g, cls: 'text-green-500 italic' },
                    { re: /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/g, cls: 'text-emerald-300' },
                    { re: /\b(?:class|def|from|import|return|if|else|elif|for|while|async|await|try|except|finally|raise|del|as|in|not|and|or|is|with|yield|lambda|pass|break|continue|None|True|False|global|nonlocal|assert|print)\b/g, cls: 'text-pink-400' },
                    { re: /\b(?:self|cls)\b/g, cls: 'text-orange-300 italic' },
                    { re: /\b(?:np|torch|nn|optim|F|plt|tensor|Tensor|array|ndarray|Linear|Sequential|ReLU|Sigmoid|Module|Adam|SGD|Dropout|BatchNorm1d|MSELoss|BCELoss|CrossEntropyLoss|matmul|dot|maximum|exp|sum|mean|zeros|ones|randn|float|int)\b/g, cls: 'text-yellow-300' },
                    { re: /\b\d+(?:\.\d+)?\b/g, cls: 'text-amber-300' },
                ]);
                return restore(out, tokens);
            };

            const html = highlightPython(code);

            return (
                <div className="my-4 rounded-xl overflow-hidden border border-gray-700 bg-gray-900 text-gray-100 shadow-lg">
                    <div className="bg-gray-800 px-4 py-2 text-xs font-mono text-gray-400 border-b border-gray-700 flex flex-wrap gap-y-1 justify-between items-center">

        /* ============================================================

        const Box = ({ type = 'info', label, children }) => {

        /* ============================================================

        ============================================================ */
        const Pipeline = ({ steps }) => (
            <div className="flex items-stretch flex-wrap gap-2 my-6 justify-between">
                {steps.map((s, i) => (
                    <React.Fragment key={i}>
                        <div className="flex-1 min-w-[140px] bg-white border border-gray-200 rounded-xl px-3 py-3 text-center text-sm shadow-sm" style={{ borderTop: '4px solid #3D008D' }}>

        /* ============================================================

        /* ============================================================

        /* ============================================================

        const Accordion = ({ items }) => {

            useTypeset(ref, [open]);
            return (
                <div ref={ref} className="space-y-2 my-5">

        /* ============================================================
           RETO con SOLUCIÓN OCULTA
        ============================================================ */
        const Reto = ({ titulo = 'Reto práctico', children, solucion }) => {
            const [show, setShow] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [show]);
            return (

                    <div className="flex items-center gap-2 font-bold text-navy mb-2">
                        <i className="fas fa-dumbbell text-gold"></i>{titulo}
                    </div>
                    <div className="text-gray-700 text-[0.95rem] mb-3">{children}</div>
                    <button onClick={() => setShow(s => !s)}
                        className="text-xs font-bold px-3 py-1.5 rounded-full text-white usta-gradient hover:opacity-90 transition-opacity">
                        <i className={`fas ${show ? 'fa-eye-slash' : 'fa-key'} mr-1`}></i>
                        {show ? 'Ocultar solución' : 'Mostrar solución'}
                    </button>
                    {show && <div className="mt-3 animate-fade-in">{solucion}</div>}
                </div>
            );
        };

        /* ============================================================
           QUIZ — mini-cuestionario con puntuación visual
        ============================================================ */
        const Quiz = ({ titulo = 'Minicuestionario', preguntas }) => {
            const [resp, setResp] = useState({});
            const [enviado, setEnviado] = useState(false);

            const toggle = (qi, oi, multiple) => {
                if (enviado) return;
                setResp(prev => {
                    const actual = prev[qi] || [];
                    if (multiple) {
                        return { ...prev, [qi]: actual.includes(oi) ? actual.filter(x => x !== oi) : [...actual, oi] };
                    }
                    return { ...prev, [qi]: [oi] };
                });
            };

            const esCorrecta = (qi) => {
                const correctSet = preguntas[qi].opciones.map((o, i) => o.correcta ? i : -1).filter(i => i >= 0);
                const sel = resp[qi] || [];
                return sel.length === correctSet.length && sel.every(i => preguntas[qi].opciones[i].correcta);
            };

            const score = preguntas.reduce((acc, _, qi) => acc + (esCorrecta(qi) ? 1 : 0), 0);
            const total = preguntas.length;
            const pct = Math.round((score / total) * 100);
            const todasResp = preguntas.every((_, qi) => (resp[qi] || []).length > 0);

            const color = pct >= 80 ? '#15803D' : pct >= 50 ? '#B45309' : '#B91C1C';
            const mensaje = pct >= 80 ? '¡Excelente dominio del tema!' : pct >= 50 ? 'Buen resultado; conviene repasar los puntos fallados.' : 'Conviene releer la lección antes de continuar.';
            const ref = useRef(null);
            useTypeset(ref, [enviado]);

            return (
                <div ref={ref} className="my-8 rounded-2xl border border-primary/20 bg-white p-6 shadow-md">
                    <div className="flex items-center gap-2 mb-4">
                        <span className="usta-gradient text-white p-2 rounded-lg"><i className="fas fa-clipboard-question"></i></span>
                        <h3 className="text-lg font-bold text-primary" style={{ margin: 0 }}>{titulo}</h3>
                    </div>

                    {preguntas.map((q, qi) => (
                        <div key={qi} className="mb-5">
                            <div className="font-semibold text-navy text-[0.95rem] mb-2">
                                {qi + 1}. {q.pregunta}
                                {q.multiple && <span className="ml-2 text-xs text-gray-500 font-normal">(selección múltiple)</span>}
                            </div>
                            <div className="space-y-1.5">
                                {q.opciones.map((o, oi) => {
                                    const sel = (resp[qi] || []).includes(oi);
                                    let cls = 'border-gray-200 hover:border-primary/40';
                                    if (enviado) {
                                        if (o.correcta) cls = 'border-green-500 bg-green-50';
                                        else if (sel) cls = 'border-red-400 bg-red-50';
                                        else cls = 'border-gray-200 opacity-70';
                                    } else if (sel) cls = 'border-secondary bg-pink-50';
                                    return (
                                        <button key={oi} onClick={() => toggle(qi, oi, q.multiple)} disabled={enviado} aria-pressed={sel}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.9rem] flex items-center gap-2.5 transition-all ${cls}`}>
                                            <span className={`flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[0.7rem] font-bold ${sel ? 'usta-gradient text-white' : 'bg-gray-100 text-gray-600'}`}>
                                                {String.fromCharCode(97 + oi)}
                                            </span>
                                            <span className="flex-1 text-gray-700">{o.texto}</span>
                                            {enviado && o.correcta && <i className="fas fa-check text-green-600 text-xs" aria-hidden="true"></i>}
                                            {enviado && sel && !o.correcta && <i className="fas fa-xmark text-red-500 text-xs" aria-hidden="true"></i>}
                                            {enviado && <span className="sr-only">{o.correcta ? '(correcta)' : sel ? '(incorrecta)' : ''}</span>}
                                        </button>
                                    );
                                })}
                            </div>
                            {enviado && q.justificacion && (
                                <p className="text-xs text-gray-600 mt-1.5 ml-1 italic">{q.justificacion}</p>
                            )}
                        </div>
                    ))}

                    {!enviado
                        ? <button onClick={() => todasResp && setEnviado(true)} disabled={!todasResp}
                            className="text-sm font-bold px-5 py-2 rounded-full text-white usta-gradient disabled:opacity-40">
                            <i className="fas fa-flag-checkered mr-2"></i>Calificar ({Object.keys(resp).length}/{total})
                        </button>
                        : (
                            <div className="animate-fade-in">
                                <div className="flex items-center gap-4 p-4 rounded-xl" style={{ background: '#FAFAFA' }}>
                                    <div className="relative w-20 h-20 flex-shrink-0">
                                        <svg viewBox="0 0 36 36" className="w-20 h-20" aria-hidden="true">
                                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#eee" strokeWidth="3" />
                                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke={color} strokeWidth="3" strokeDasharray={`${pct}, 100`} strokeLinecap="round" />
                                        </svg>
                                        <span className="absolute inset-0 flex items-center justify-center font-extrabold text-sm" style={{ color }}>{pct} %</span>
                                    </div>
                                    <div>
                                        <div className="font-bold text-navy">Puntaje: {score} / {total}</div>
                                        <div className="text-sm" style={{ color }}>{mensaje}</div>
                                    </div>
                                </div>
                                <button onClick={() => { setEnviado(false); setResp({}); }}
                                    className="mt-3 text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                            </div>
                        )}
                </div>
            );
        };

        /* ============================================================
           TÉRMINO con definición emergente (tooltip por portal)
        ============================================================ */
        const Termino = ({ children, def }) => {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState(null);
            const btnRef = useRef(null);
            const popRef = useRef(null);
            const closeTimer = useRef(null);

            // Cierre con periodo de gracia: permite mover el cursor del termino al
            // cuadro (que estan separados unos pixeles) sin que se cierre de inmediato.
            const cancelClose = () => { if (closeTimer.current) { clearTimeout(closeTimer.current); closeTimer.current = null; } };
            const scheduleClose = () => { cancelClose(); closeTimer.current = setTimeout(() => setOpen(false), 150); };
            const openNow = () => { cancelClose(); setOpen(true); };
            useEffect(() => cancelClose, []); // limpia el temporizador al desmontar

            // Calcula la posición del cuadro en coordenadas del viewport (position: fixed)
            // y decide si abrir hacia abajo o hacia arriba según el espacio disponible.
            const place = () => {
                if (!btnRef.current) return;
                const r = btnRef.current.getBoundingClientRect();
                const margin = 12;
                const w = Math.min(300, window.innerWidth - margin * 2);
                let left = r.left;
                if (left + w > window.innerWidth - margin) left = window.innerWidth - margin - w;
                if (left < margin) left = margin;
                const abreArriba = (window.innerHeight - r.bottom) < 180; // poco espacio abajo
                setPos({
                    left, width: w,
                    top: abreArriba ? null : Math.round(r.bottom + 6),
                    bottom: abreArriba ? Math.round(window.innerHeight - r.top + 6) : null,
                });
            };

            useEffect(() => {
                if (!open) { setPos(null); return; }
                place();
                const reflow = () => place();
                const onDoc = (e) => {
                    if (popRef.current && popRef.current.contains(e.target)) return;
                    if (btnRef.current && btnRef.current.contains(e.target)) return;
                    setOpen(false);
                };
                // 'true' captura también el scroll del contenedor interno de la lección.
                const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };   // WCAG 1.4.13: se descarta con Escape
                window.addEventListener('scroll', reflow, true);
                window.addEventListener('resize', reflow);
                document.addEventListener('mousedown', onDoc);
                document.addEventListener('keydown', onKey);
                return () => {
                    window.removeEventListener('scroll', reflow, true);
                    window.removeEventListener('resize', reflow);
                    document.removeEventListener('mousedown', onDoc);
                    document.removeEventListener('keydown', onKey);
                };
            }, [open]);

            return (
                <span className="inline-block">
                    <button ref={btnRef} type="button" onClick={openNow} onMouseEnter={openNow} onMouseLeave={scheduleClose}
                        className="text-primary font-semibold cursor-help bg-primary/5 hover:bg-primary/10 rounded px-1 transition-colors"
                        style={{ borderBottom: '1px dotted #3D008D' }} title="Ver definición rápida" aria-expanded={open}>
                        {children}<i className="fas fa-circle-info text-[0.6em] align-super ml-0.5 text-secondary" aria-hidden="true"></i>
                    </button>
                    {open && pos && ReactDOM.createPortal(
                        <span ref={popRef} role="tooltip"
                            onMouseEnter={cancelClose} onMouseLeave={scheduleClose}
                            className="block rounded-lg bg-white shadow-2xl border border-primary/30 p-3 text-[0.8rem] font-normal text-gray-700 leading-snug animate-fade-in text-left"
                            style={{ position: 'fixed', left: pos.left, top: pos.top == null ? 'auto' : pos.top, bottom: pos.bottom == null ? 'auto' : pos.bottom, width: pos.width, zIndex: 200 }}>
                            <span className="block font-bold text-primary mb-1 text-[0.72rem] uppercase tracking-wide">{children}</span>
                            {def}
                        </span>,
                        document.body
                    )}
                </span>
            );
        };

        /* ============================================================
           FIGURAS Y TABLAS: pie normalizado, coma decimal y aviso de desplazamiento (canon del M2)
        ============================================================ */
        /* Número con coma decimal y punto de miles para el texto visible (coma en prosa, leyendas, SVG y UI;
           punto en código y LaTeX). */
        const fmtDec = (v, d) => v.toFixed(d).replace('.', ',');
        const fmtNum = (v, d = 0) => {
            const [ent, dec] = Math.abs(v).toFixed(d).split('.');
            const miles = ent.length > 3 ? ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : ent;
            return (v < 0 ? '−' : '') + miles + (dec ? ',' + dec : '');
        };

        /* Pie de figura normalizado: «Figura 3.c.n.» + descripción + fuente.
           Numeración del M3: 3.c.n, con c = capítulo del módulo (3.1, 3.2, 3.3) y n = orden de aparición
           dentro del capítulo (las simulaciones S-A y S-B ocupan el número de la figura que sustituyen). */
        const PieFigura = ({ n, fuente = 'elaboración propia.', className = '', children }) => (
            <p className={`text-xs text-gray-500 italic text-center ${className}`}>
                <strong className="not-italic text-navy">Figura {n}.</strong> {children} <span className="not-italic">Fuente: {fuente}</span>
            </p>
        );

        /* Pie de tabla con la misma convención: «Tabla 3.c.n.» */
        const PieTabla = ({ n, fuente = 'elaboración propia.', className = '', children }) => (

                    <p>
                        Tener datos y fundamentos matemáticos no basta: hace falta una herramienta que organice, calcule y ejecute

                    {/* ============== 1.1 TensorFlow + Keras ============== */}
                    <h3>1. TensorFlow 2.x y su API de alto nivel: Keras</h3>
                    <p>
                        <strong>TensorFlow</strong> es un <em>framework</em> de código abierto del equipo de Google Brain, publicado en 2015. Su
                        nombre proviene de su operación fundamental: transformaciones matemáticas sobre <Termino def="Arreglos multidimensionales de datos numéricos que fluyen por un grafo computacional.">tensores</Termino> que
                        fluyen por un grafo computacional <Cita k="abadi2016tensorflow" />. La versión de referencia del curso es la 2.21, publicada en marzo de 2026 <Cita k="tensorflow_v221" />, y TensorFlow
                        sigue siendo uno de los <em>frameworks</em> más usados en producción empresarial.
                    </p>

                    <h4>La evolución: de TensorFlow 1.x a 2.x</h4>
                    <Box type="info" label="Analogía local — la notaría de los años 90 frente a la notaría digital">
                        Trabajar con TensorFlow 1.x era como un trámite en una <strong>notaría colombiana de los años 90</strong>:
                        primero llenar todos los formularios (definir el grafo estático completo), luego hacer la fila (crear una{' '}
                        <span className="inline-code">tf.Session</span>) y solo al final, cuando por fin llegaba el turno, ejecutar. Si había
                        un error, tocaba volver al principio. <strong>TensorFlow 2.x</strong> es la <strong>notaría digital moderna</strong>:
                        se ejecuta cada paso de inmediato (ejecución <em>eager</em>), se verifica el resultado en el acto y, si algo sale mal,
                        se corrige sobre la marcha.
                    </Box>
                    <p>
                        La versión 1.x empleaba <strong>grafos estáticos</strong>: se definía toda la estructura, se compilaba y se ejecutaba
                        dentro de una <span className="inline-code">tf.Session</span>. Era poco intuitivo y difícil de depurar. Con
                        <strong> TensorFlow 2.0 (2019)</strong> Google adoptó la <strong>ejecución inmediata</strong> (<em>eager</em>) por defecto,
                        integró Keras como API principal y simplificó drásticamente el código.
                    </p>

                    <h4>Keras: aprendizaje profundo para humanos</h4>
                    <p>
                        <strong>Keras</strong>, creado por François Chollet en 2015, resume su filosofía en un lema, «aprendizaje profundo
                        para humanos», y en un principio de diseño: una API pensada «para seres humanos, no para máquinas»{' '}
                        <Cita k="chollet2015keras" />. Desde TensorFlow 2.x es la interfaz oficial de alto nivel (<span className="inline-code">tf.keras</span>).
                        A finales de 2023 se lanzó <strong>Keras 3</strong>, una reescritura completa que lo convirtió en un <em>framework</em>{' '}
                        <strong>multi-<em>backend</em></strong> <Cita k="keras3_intro" />: el mismo código se ejecuta sobre TensorFlow, PyTorch, JAX u OpenVINO (este último solo
                        para inferencia) cambiando una variable de entorno.
                    </p>

                    <h4>Las tres puertas de Keras: API de construcción de modelos</h4>
                    <KerasAPIsSVG />
                    <Tabs tabs={[
                        {
                            label: '1 · Sequential', content: (
                                <>
                                    <p><strong>La línea de ensamblaje.</strong> La forma más sencilla: se apilan capas una sobre otra, como una
                                        línea de producción de café donde el grano pasa de una etapa a la siguiente sin desviarse. Ideal para
                                        redes prealimentadas (<em>feedforward</em>); cada capa tiene exactamente una entrada y una salida.</p>
                                    <CodeBlock lang="python" title="API Sequential" code={`import keras

modelo = keras.Sequential([
    keras.Input(shape=(4,)),
    keras.layers.Dense(128, activation='relu'),
    keras.layers.Dropout(0.3),
    keras.layers.Dense(64, activation='relu'),
    keras.layers.Dense(1, activation='sigmoid')
])

modelo.compile(
    optimizer='adam',
    loss='binary_crossentropy',
    metrics=['accuracy']
)`} />
                                </>
                            )
                        },
                        {
                            label: '2 · Funcional', content: (
                                <>
                                    <p><strong>El diagrama de flujo.</strong> Permite múltiples entradas, múltiples salidas y ramas que se
                                        separan y vuelven a unirse (topologías no secuenciales). Es como el <strong>sistema de acueducto de Bogotá</strong>: el agua (los datos) puede
                                        bifurcarse, unirse y fluir por caminos paralelos. Se usa cuando la arquitectura es un grafo dirigido
                                        acíclico (DAG), no una cadena lineal.</p>
                                    <CodeBlock lang="python" title="API Funcional" code={`entrada_imagen = keras.Input(shape=(64, 64, 3), name='imagen')
entrada_metadata = keras.Input(shape=(10,), name='metadata')

x = keras.layers.Conv2D(32, 3, activation='relu')(entrada_imagen)
x = keras.layers.GlobalAveragePooling2D()(x)

combinado = keras.layers.concatenate([x, entrada_metadata])
salida = keras.layers.Dense(1, activation='sigmoid')(combinado)

modelo = keras.Model(
    inputs=[entrada_imagen, entrada_metadata],
    outputs=salida
)`} />
                                </>
                            )
                        },
                        {
                            label: '3 · Subclassing', content: (
                                <>
                                    <p><strong>El taller artesanal.</strong> Control total heredando de <span className="inline-code">keras.Model</span>:
                                        se declaran las capas en el constructor y la propagación en <span className="inline-code">call()</span>.
                                        La opción más flexible —como un artesano que fabrica cada pieza a mano— pero también la más compleja.
                                        Se emplea cuando se necesita lógica condicional o dinámica dentro del modelo.</p>
                                    <CodeBlock lang="python" title="Subclassing" code={`class MiModelo(keras.Model):
    def __init__(self):
        super().__init__()
        self.densa1 = keras.layers.Dense(64, activation='relu')
        self.salida = keras.layers.Dense(1, activation='sigmoid')

    def call(self, x):
        x = self.densa1(x)
        return self.salida(x)`} />
                                </>
                            )
                        },
                    ]} />
                    <Box type="code" label="Lectura del código">
                        Cada pestaña muestra la API en el caso que mejor la justifica. <span className="inline-code">Sequential</span> apila
                        capas en línea recta (lo más rápido para un prototipo); la API funcional conecta entradas y salidas como un grafo,
                        necesaria para modelos con varias ramas —aquí, uno que combina la <strong>foto de la hoja</strong> y los{' '}
                        <strong>metadatos de la finca</strong>—; y <span className="inline-code">Subclassing</span> entrega el control
                        total del método <span className="inline-code">call()</span> para lógica dinámica. Regla práctica: se empieza
                        por Sequential y solo se sube de nivel cuando la arquitectura lo exige.
                    </Box>

                    <h4>El ecosistema de producción de TensorFlow</h4>
                    <p>Una de las mayores fortalezas de TensorFlow es su ecosistema completo de despliegue:</p>
                    <ul>
                        <li><strong>TensorFlow Serving:</strong> sistema de alto rendimiento en C++ para servir modelos en producción, con control de versiones, pruebas A/B y API REST/gRPC. Estándar de facto en despliegues empresariales de gran escala.</li>
                        <li><strong>LiteRT</strong> (antes TensorFlow Lite): optimiza modelos para móviles y borde (cuantización, reducción de tamaño). Permite ejecutar modelos de aprendizaje profundo en un Android de una zona rural del Cauca sin internet. Desde TensorFlow 2.20, <span className="inline-code">tf.lite</span> queda en desuso <Cita k="tensorflow_v220" /> y el desarrollo continúa en LiteRT, un proyecto independiente con API nativas en Kotlin y C++ <Cita k="google_litert" />.</li>
                        <li><strong>TensorFlow.js:</strong> ejecuta modelos en el navegador o en Node.js (IA del lado del cliente).</li>
                        <li><strong>TFX (TensorFlow Extended):</strong> flujos (<em>pipelines</em>) de aprendizaje automático de extremo a extremo, de la validación de datos al monitoreo en producción.</li>
                        <li><strong>TensorBoard:</strong> visualización de curvas de pérdida, histogramas de pesos, grafos y métricas durante el entrenamiento.</li>
                    </ul>

                    {/* ============== 1.2 PyTorch ============== */}
                    <h3>2. PyTorch: tensores, grafos dinámicos y módulos</h3>
                    <p>
                        <strong>PyTorch</strong>, desarrollado por Facebook AI Research (FAIR, hoy Meta) y publicado en 2016, opera desde
                        2022 bajo la Linux Foundation. Domina la investigación académica: desde 2019 la mayoría de los artículos con código
                        de las grandes conferencias usa PyTorch <Cita k="he2019state" />, y las implementaciones de referencia de GPT, LLaMA, Stable
                        Diffusion y los modelos de Hugging Face se escriben sobre él.
                    </p>

                    <h4>El tensor: la moneda corriente del aprendizaje profundo</h4>
                    <Box type="info" label="Analogía local — la cosecha de café">
                        Si un dato individual es un <strong>grano de café</strong>, un <strong>vector</strong> es un saco de granos (una
                        dimensión), una <strong>matriz</strong> es una estiba de sacos (dos dimensiones) y un <strong>tensor</strong> es un
                        contenedor lleno de estibas (tres o más dimensiones). Toda la información —imágenes, textos, audio— se empaqueta en
                        estos «contenedores multidimensionales» antes de ser procesada.
                    </Box>
                    <p>
                        Un tensor de PyTorch es conceptualmente idéntico a un <span className="inline-code">ndarray</span> de NumPy, pero con
                        dos capacidades críticas: puede residir en la <strong>GPU</strong> —y sus operaciones ejecutarse allí— y puede{' '}
                        <strong>rastrear automáticamente</strong> las operaciones para calcular gradientes (diferenciación automática).
                    </p>
                    <CodeBlock lang="pytorch" title="Tensores y dispositivo" code={`import torch

# Detectar dispositivo disponible
device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')

# Crear tensores y moverlos al mismo dispositivo
datos_sensor = torch.tensor([23.5, 67.8, 45.2, 91.0]).to(device)

# Tensor con rastreo de gradientes (pesos de la red)
pesos = torch.randn(3, 4, requires_grad=True, device=device)

# Operaciones (ambos tensores en el mismo dispositivo)
resultado = datos_sensor @ pesos.T   # Multiplicación matricial`} />
                    <Box type="warn" label="Alerta — mismo dispositivo">
                        Todos los tensores de una operación deben estar en el <strong>mismo dispositivo</strong> (CPU o GPU); de lo contrario
                        PyTorch lanza un error de ejecución. <span className="inline-code">requires_grad=True</span> es la señal que activa el
                        rastreo de operaciones: la base del sistema <strong>Autograd</strong>.
                    </Box>

                    <h4>Grafos computacionales dinámicos: «define-by-run»</h4>
                    <Box type="info" label="Analogía local — el río Magdalena">
                        Un grafo estático (TensorFlow 1.x) es como construir un <strong>canal de riego de concreto</strong> antes de la
                        temporada de lluvias: el agua solo puede fluir por ese camino fijo. Un grafo dinámico (PyTorch) es el{' '}
                        <strong>río Magdalena</strong>: su recorrido no está trazado de antemano; lo decide cada crecida según el agua que
                        llega. Si el flujo de datos debe cambiar según una condición (¿la imagen tiene nubes o no?), el grafo dinámico lo
                        permite con un <span className="inline-code">if/else</span> de Python.
                    </Box>
                    <p>
                        En PyTorch el grafo se construye <strong>en tiempo real</strong>, operación por operación, a medida que el código se
                        ejecuta <Cita k="paszke2019pytorch" />. Esto permite usar las herramientas estándar de depuración de Python (<span className="inline-code">print()</span>,{' '}
                        <span className="inline-code">pdb</span>, puntos de interrupción) para inspeccionar cualquier tensor intermedio. Esa inmediatez es la
                        razón principal de su adopción masiva en investigación. La ejecución inmediata (<em>eager</em>) de TensorFlow 2.x y
                        el <em>define-by-run</em> de PyTorch son la misma idea vista desde dos lados; TensorFlow puede volver a un grafo
                        estático con <span className="inline-code">tf.function</span>.
                    </p>

                    <h4>El sistema Autograd: la bitácora automática</h4>
                    <p>
                        Al operar sobre tensores con <span className="inline-code">requires_grad=True</span>, PyTorch registra cada operación en un
                        grafo dirigido acíclico (DAG). Al invocar <span className="inline-code">.backward()</span> sobre la pérdida, el motor recorre
                        el grafo en orden inverso aplicando la regla de la cadena <Cita k="baydin2018automatic, paszke2019pytorch" />. Es la implementación práctica de la retropropagación del
                        Módulo 1 (Capítulo 1.4): el «secretario invisible» que anota cada operación en la bitácora y luego la lee al revés.
                    </p>
                    <CodeBlock lang="pytorch" title="Autograd en acción" code={`x = torch.tensor(2.0, requires_grad=True)
y = 2 * x**2 + 3 * x + 5    # y = 2(4) + 6 + 5 = 19
y.backward()                # Calcula dy/dx = 4x + 3
print(x.grad)               # tensor(11.)  ->  4(2) + 3 = 11`} />
                    <Box type="code" label="Lectura del código">
                        El gradiente <span className="inline-code">x.grad</span> devuelve <strong>11</strong> (la salida{' '}
                        <span className="inline-code">tensor(11.)</span>), exactamente el valor de la
                        derivada <span className="inline-code">dy/dx = 4x + 3</span> evaluada en <span className="inline-code">x = 2</span>.
                        Autograd no derivó la fórmula a mano: reconstruyó la regla de la cadena recorriendo hacia atrás el grafo de operaciones
                        que registró durante el paso hacia adelante. Ese mismo mecanismo, aplicado a millones de parámetros, es lo que permite entrenar una
                        red sin calcular una sola derivada de forma manual.
                    </Box>

                    <h4>El módulo torch.nn: construcción de redes</h4>
                    <p>
                        PyTorch organiza las redes alrededor de <span className="inline-code">torch.nn.Module</span>. Todo modelo se define como una
                        clase que hereda de <span className="inline-code">nn.Module</span> e implementa dos elementos: el constructor{' '}
                        <span className="inline-code">__init__()</span> (donde se declaran las capas) y <span className="inline-code">forward()</span>{' '}
                        (cómo fluyen los datos).
                    </p>
                    <CodeBlock lang="pytorch" title="Definir un modelo con nn.Module" code={`import torch.nn as nn

class DetectorRoya(nn.Module):
    def __init__(self):
        super().__init__()
        self.red = nn.Sequential(
            nn.Linear(4, 128),
            nn.ReLU(),
            nn.Dropout(0.3),
            nn.Linear(128, 64),
            nn.ReLU(),
            nn.Linear(64, 1),
            nn.Sigmoid()
        )

    def forward(self, x):
        return self.red(x)

modelo = DetectorRoya()`} />
                    <CalloutPro tema="info" titulo="Control explícito frente a abstracción" subtitulo="Keras model.fit() ↔ bucle de PyTorch" icon="fa-code-branch">
                        En Keras, <span className="inline-code">model.fit()</span> encapsula todo el ciclo de entrenamiento. En PyTorch el
                        programador escribe explícitamente el <em>bucle de entrenamiento</em>. Más laborioso al inicio, pero otorga control total sobre
                        cada paso, facilitando técnicas avanzadas como la precisión mixta o la acumulación de gradientes.
                    </CalloutPro>

                    <h4>El ecosistema de PyTorch</h4>
                    <ul>
                        <li><strong>TorchVision, TorchAudio, TorchText:</strong> visión, audio y PLN (procesamiento de lenguaje natural), con conjuntos de datos, transformaciones y modelos preentrenados. El desarrollo de TorchText se detuvo en 2024, con la versión 0.18, y su repositorio está archivado <Cita k="torchtext_repo" />; para texto se usan hoy las bibliotecas <span className="inline-code">tokenizers</span> y <span className="inline-code">datasets</span> de Hugging Face.</li>
                        <li><strong>Hugging Face Transformers:</strong> la biblioteca de modelos de lenguaje (BERT, GPT, LLaMA) más popular del mundo, construida primordialmente sobre PyTorch <Cita k="wolf2020transformers" />.</li>
                        <li><strong>torch.export y ONNX:</strong> <span className="inline-code">torch.export</span> (introducido en PyTorch 2.1; base del exportador ONNX predeterminado desde la 2.9) captura el modelo como un grafo de compilación anticipada (AOT, <em>ahead-of-time</em>) y es el sucesor de TorchScript, declarado obsoleto <Cita k="pytorch_export, pytorch_jit, pytorch_v210" />; para ejecutarlo sin Python se compila con AOTInductor (C++) o se convierte con ExecuTorch (móvil). ONNX es el formato abierto de interoperabilidad.</li>
                        <li><strong>TorchServe</strong> (AWS y Meta) fue el servidor de referencia para PyTorch; desde 2025 está archivado y sin parches de seguridad <Cita k="torchserve_repo" />. Hoy se sirve con <strong>FastAPI + ONNX Runtime</strong> en servicios sencillos o con <strong>NVIDIA Triton Inference Server</strong> <Cita k="triton_server" /> en producción multi-<em>framework</em>.</li>
                        <li><strong>torch.compile()</strong> (PyTorch 2.x): con una línea, compila el modelo a código de máquina optimizado; en un banco de 163 modelos de código abierto resultó ≈21 % más rápido en FP32 y ≈51 % con precisión mixta en una A100 <Cita k="ansel2024pytorch, pytorch2x" />. En GPU de escritorio la ganancia suele ser menor.</li>
                        <li><strong>ExecuTorch:</strong> entorno de ejecución (<em>runtime</em>) oficial para móviles y borde (sucesor de PyTorch Mobile); consume modelos de <span className="inline-code">torch.export</span> y soporta aceleradores Arm, Apple y Qualcomm <Cita k="executorch_docs" />.</li>
                    </ul>

                    {/* ============== 1.3 Comparativa ============== */}
                    <h3>3. Comparativa y flujos de trabajo</h3>
                    <Box type="info" label="Analogía local — TransMilenio frente a bicicleta">
                        Elegir entre TensorFlow y PyTorch es como decidir entre <strong>TransMilenio</strong> y <strong>bicicleta</strong> en
                        Bogotá. TransMilenio (TF) tiene troncales y estaciones ya construidas para mover a miles de personas (TF Serving,
                        LiteRT, TFX), pero sus rutas son las del sistema. La bicicleta (PyTorch) ofrece libertad total de ruta y se adapta al tráfico, pero exige más esfuerzo del
                        ciclista (el programador). Ninguno es «mejor»: depende de a dónde se vaya y de las condiciones del día.
                    </Box>

                    <h4>Comparativa entre ambos <em>frameworks</em></h4>

                    <h4>El mismo problema en ambos <em>frameworks</em></h4>
                    <p>
                        Considérese entrenar un <strong>clasificador binario</strong> que determine si una muestra de agua del
                        <strong> río Bogotá</strong> supera los límites de contaminación, a partir de cuatro variables químicas (pH, oxígeno
                        disuelto, DBO —demanda bioquímica de oxígeno— y sólidos suspendidos). Así se ve en cada <em>framework</em>:
                    </p>
                    <div className="grid lg:grid-cols-2 gap-3">
                        <CodeBlock lang="python" title="Flujo en Keras (TensorFlow)" code={`# 1. Definir el modelo
modelo = keras.Sequential([
    keras.Input(shape=(4,)),
    keras.layers.Dense(64, activation='relu'),
    keras.layers.Dropout(0.3),
    keras.layers.Dense(32, activation='relu'),
    keras.layers.Dense(1, activation='sigmoid')
])

# 2. Compilar
modelo.compile(optimizer='adam',
               loss='binary_crossentropy',
               metrics=['accuracy'])

# 3. Entrenar (una sola línea)
historia = modelo.fit(X_train, y_train,
                      validation_split=0.2,
                      epochs=50, batch_size=32)

# 4. Evaluar
modelo.evaluate(X_test, y_test)`} />
                        <CodeBlock lang="pytorch" title="Flujo en PyTorch" code={`# 1. Definir el modelo
class ClasificadorAgua(nn.Module):
    def __init__(self):
        super().__init__()
        self.red = nn.Sequential(
            nn.Linear(4, 64), nn.ReLU(), nn.Dropout(0.3),
            nn.Linear(64, 32), nn.ReLU(),
            nn.Linear(32, 1))  # Sin Sigmoid: la incluye la pérdida

    def forward(self, x):
        return self.red(x)

modelo = ClasificadorAgua().to(device)
criterio = nn.BCEWithLogitsLoss()   # Sigmoid + BCE (estable)
optimizador = torch.optim.Adam(modelo.parameters())

# 2. Bucle de entrenamiento explícito
for epoca in range(50):
    modelo.train()
    for batch_x, batch_y in dataloader:
        batch_x, batch_y = batch_x.to(device), batch_y.to(device)
        optimizador.zero_grad()           # Limpiar gradientes
        prediccion = modelo(batch_x)      # Paso hacia adelante (logits)
        perdida = criterio(prediccion, batch_y)
        perdida.backward()                # Retropropagación
        optimizador.step()                # Actualizar pesos

# 3. Evaluar
modelo.eval()
with torch.no_grad():
    logits = modelo(X_test.to(device))
    probabilidades = torch.sigmoid(logits)`} />
                    </div>
                    <Box type="tip" label="Nota técnica — BCEWithLogitsLoss">
                        En PyTorch se usa <span className="inline-code">nn.BCEWithLogitsLoss()</span> en lugar de{' '}
                        <span className="inline-code">nn.BCELoss()</span> + <span className="inline-code">nn.Sigmoid()</span>: fusiona internamente
                        la sigmoide con la entropía cruzada binaria en una operación numéricamente más estable, evitando desbordamientos con
                        valores extremos. El modelo produce <em>logits</em> crudos; para obtener probabilidades en inferencia se aplica{' '}
                        <span className="inline-code">torch.sigmoid()</span>.
                    </Box>

                    <h4>Keras 3: el puente entre mundos</h4>
                    <p>
                        Con Keras 3 (finales de 2023), Keras se volvió <strong>agnóstico del <em>backend</em></strong>: el mismo código corre sobre
                        TensorFlow, PyTorch o JAX <Cita k="bradbury2018jax" /> configurando una variable de entorno. Esto elimina la falsa dicotomía: se prototipa con la
                        simplicidad de Keras, se depura con PyTorch y se despliega con TensorFlow o JAX, sin reescribir el modelo <Cita k="chollet2025deep" />.
                    </p>
                    <CodeBlock lang="python" title="Seleccionar backend en Keras 3" code={`import os
os.environ['KERAS_BACKEND'] = 'torch'   # o 'tensorflow', 'jax'
import keras
# ... el resto del código Keras es idéntico para cualquier backend`} />
                    <Box type="code" label="Lectura del código">
                        La única línea que cambia entre un <em>backend</em> y otro es <span className="inline-code">os.environ['KERAS_BACKEND']</span>, y
                        debe fijarse <strong>antes</strong> de importar Keras (de lo contrario el <em>backend</em> ya quedó elegido). El resto del modelo
                        —capas, entrenamiento, guardado— permanece idéntico: esa es la promesa multi-<em>backend</em> de Keras 3 convertida en código.
                    </Box>

                    <h4>¿Cuál elegir? Guía para el contexto colombiano</h4>
                    <Accordion items={[
                        { titulo: 'Keras / TensorFlow', contenido: <p>Para <strong>desplegar rápido</strong>, sobre todo en móviles o borde, o con un equipo de experiencia limitada que prioriza velocidad de desarrollo. Ejemplo hipotético: una aplicación móvil de alerta de inundaciones con datos del IDEAM.</p> },
                        { titulo: 'PyTorch', contenido: <p>Para <strong>investigación</strong>, arquitecturas novedosas, modelos de lenguaje e IA generativa, valorando la depuración intuitiva. Ejemplo hipotético: un grupo universitario que ajusta un Transformer para el análisis de sentimiento de publicaciones sobre política colombiana.</p> },
                        { titulo: 'Keras 3 multi-backend', contenido: <p>Para <strong>flexibilidad máxima</strong> y evitar dependencia de un solo proveedor. La opción más pragmática ante distintos requisitos de hardware. Ejemplo hipotético: una entidad de tecnología cívica que atiende a varias entidades del Estado con infraestructuras diferentes.</p> },
                    ]} />
                    <CalloutPro tema="warn" titulo="La regla de oro del curso" subtitulo="Todo el código del capítulo corre en Colab" icon="fa-cloud">
                        Recuérdese la regla de oro: <strong>«si no corre en Google Colab, no existe»</strong>. TensorFlow/Keras y PyTorch
                        ya vienen preinstalados en Colab, con GPU gratuita: no hace falta una supercomputadora ni una tarjeta gráfica
                        costosa.
                    </CalloutPro>

                    <Box type="tip" label="Puntos clave del Capítulo 3.1">
                        <ul>
                            <li>TensorFlow 2.x y PyTorch convergen en la <strong>ejecución inmediata</strong>; TensorFlow conserva el grafo estático con <span className="inline-code">tf.function</span>.</li>
                            <li>Keras ofrece tres API (Sequential, funcional y Subclassing); solo se sube de nivel cuando la arquitectura lo exige.</li>
                            <li>PyTorch hace explícito el bucle (<span className="inline-code">zero_grad</span> → paso hacia adelante → pérdida → retropropagación → paso), y <strong>Autograd</strong> calcula los gradientes.</li>
                            <li>Keras 3 elige el <em>backend</em> con una variable de entorno, que se fija antes de importar Keras.</li>
                            <li>La elección depende del despliegue: LiteRT o TF Serving frente a ExecuTorch u ONNX.</li>
                            <li><strong>De vuelta al caso:</strong> para la aplicación de Planadas, la propuesta de María es la más pragmática: prototipar en Keras 3 —con el <em>backend</em> de PyTorch mientras se investiga, como prefiere Samuel— y, sin reescribir el modelo, cambiar al de TensorFlow para exportarlo a LiteRT y llevarlo al Android de gama media, como pide Daniela.</li>
                        </ul>

        /* ============================================================

        const fmtPct = (p) => `${fmtNum(p, 1)} %`;

        const CalculadoraVRAM = ({ citaKorthikanti = null, fuente = 'elaboración propia (simulación interactiva); activaciones por muestra medidas con PyTorch 2.12.' }) => {

            const b = 2 ** bExp, s = 2 ** sExp;
            const esTr = modelo === 'transformer125m', esPers = modelo === 'personalizado';

            const bMax = S.loteMaximo(c);
            const ahorro = S.ahorroAMP(c);
            const gpuNombre = S.GPUS[gpu].nombre;

            let acc = 0;
            const segs = SA_COMP.filter(t => r.comp[t.k] > 0).map(t => {

                return { ...t, x, w: px(r.comp[t.k]), v: r.comp[t.k], pct: r.total > 0 ? 100 * r.comp[t.k] / r.total : 0 };
            });
            const mayor = segs.reduce((m, t) => (!m || t.v > m.v ? t : m), null);
            const xUtil = X0 + px(r.util), xCap = X0 + px(r.capacidad), xTot = X0 + px(r.total);
            const paso = pasoEje(escala / 1e9, [0.5, 1, 2, 5, 10, 20, 50, 100]);

            const resumen = `${S.MODELOS[modelo].tipo === 'personalizado' ? 'Modelo personalizado' : S.MODELOS[modelo].nombre.split(' (')[0]}, lote de ${b}${esTr ? ` y secuencias de ${fmtNum(s)} fichas` : ''}, ${inferencia ? 'solo inferencia' : SA_PRECISION[precision].replace(/^Precisión/, 'precisión') + ' y ' + SA_OPT[opt]}: ` +

                    <SectionHeader title="Capítulo 3.2 — Computación de alto rendimiento" icon={Icons.Cpu} />

                    <p>
                        Se construyeron los cimientos matemáticos y se eligieron los <em>frameworks</em>, pero todo es inútil sin
                        <strong> capacidad de cómputo</strong> para entrenar. Este capítulo aborda dos dimensiones: el hardware acelerado

                    </p>
                    <Box type="info" label="Nota de vigencia">

                    </Box>
                    <Box type="info" label="Analogía local — la despulpadora">
                        Un caficultor del Huila debe despulpar 500 kilos de café antes del amanecer. A mano, grano por grano, no
                        termina a tiempo; una <strong>despulpadora industrial</strong> procesa cientos de granos a la vez. La{' '}
                        <strong>CPU</strong> es el trabajador manual (hábil, pero de grano en grano); la <strong>GPU</strong> es la
                        despulpadora (menos versátil, pero con miles de operaciones en paralelo). Con modelos grandes, la diferencia
                        puede ser la que separa días de horas.
