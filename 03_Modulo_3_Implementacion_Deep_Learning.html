                    {/* ============== 2.1 GPU ============== */}
                    <h3>1. Entrenamiento acelerado con GPU</h3>
                    <h4>¿Por qué una GPU y no una CPU?</h4>
                    <p>
                        Una <strong>CPU</strong> tiene de unos pocos núcleos (portátil) a más de un centenar (servidor), optimizados para
                        tareas secuenciales complejas. Una <strong>GPU</strong> contiene <strong>miles de núcleos pequeños</strong> que
                        realizan la misma operación sobre miles de datos a la vez: el paradigma <Termino def="Single Instruction, Multiple Threads: una misma instrucción se ejecuta en paralelo sobre muchos hilos con datos distintos.">SIMT</Termino> <Cita k="nickolls2008scalable" />.
                        Entrenar una red es multiplicar matrices enormes —miles de operaciones idénticas sobre datos distintos—, justo el
                        trabajo para el que está hecha la GPU.
                    </p>
                    <CPUvsGPUSVG fuente={<>elaboración propia, inspirada en la figura «The GPU devotes more transistors to data processing» de la guía de programación de CUDA <Cita k="nvidia_cudaguide" />.</>} />
                    <p>
                        Como orden de magnitud, entrenar una CNN en una GPU de consumo es varias veces más rápido que en CPU, y en modelos
                        grandes la diferencia llega a uno o dos órdenes de magnitud <Cita k="raina2009large" />.
                    </p>

                    <h4>Núcleos CUDA frente a Tensor Cores</h4>
                    <p>
                        Los <strong>núcleos CUDA</strong> son procesadores de propósito general (una multiplicación-suma, FMA, por ciclo,
                        que cuenta como dos operaciones de punto flotante). Los <strong>Tensor Cores</strong> (desde la arquitectura Volta,
                        2017) son unidades especializadas en multiplicación-acumulación de matrices (MMA): en Volta <Cita k="nvidia2017volta" />, cada Tensor Core
                        ejecuta en cada ciclo de reloj una multiplicación-acumulación de matrices 4×4 (64 FMA). Según <Cita k="nvidia2020a100" n />, en una A100 los núcleos
                        CUDA dan 19,5 TFLOPS (billones de operaciones de punto flotante por segundo) en FP32 y los Tensor Cores{' '}
                        <strong>312 TFLOPS en FP16</strong> (16× más para la matemática matricial que domina el aprendizaje profundo).
                    </p>

                    <h4>La pila de software: CUDA y cuDNN</h4>
                    <p>
                        <strong>CUDA</strong> (2006) es la plataforma de computación paralela de NVIDIA <Cita k="nickolls2008scalable, nvidia_cudatoolkit" />. Sobre ella se construye
                        <strong> cuDNN</strong>, con implementaciones optimizadas de convoluciones, normalización, activaciones y atención{' '}
                        <Cita k="chetlur2014cudnn, nvidia_cudnn" />.
                        Cuando se invoca <span className="inline-code">torch.nn.Conv2d</span> o <span className="inline-code">keras.layers.Conv2D</span>,
                        internamente se despacha a cuDNN. Otras bibliotecas: <strong>NCCL</strong> (comunicación multi-GPU) y
                        <strong> TensorRT</strong> (optimización de inferencia).
                    </p>
                    <Box type="tip" label="Contexto — por qué NVIDIA domina">
                        Cuando un estudiante ejecuta <span className="inline-code">modelo.fit()</span> en Colab con una T4 gratuita, detrás de
                        esa línea se activan automáticamente CUDA, cuDNN y los Tensor Cores, sin escribir una sola línea de bajo nivel. Esa pila
                        de software es la verdadera ventaja competitiva de NVIDIA.
                    </Box>
                    <CudaStackSVG />

                    <h4>VRAM: el recurso más escaso</h4>
                    <p>
                        La <strong>VRAM</strong> (memoria de video de la GPU) almacena simultáneamente los pesos, los estados del
                        optimizador, los gradientes, las activaciones y el lote actual. Regla práctica:
                    </p>
                    <Eq>{String.raw`$$ \text{VRAM}_{\text{pesos}} \approx 2N\ \text{GB} \quad(\text{para } N\text{ mil millones de parámetros en FP16})$$`}</Eq>
                    <p>
                        y entrenar con Adam exige unas 8 veces esa cantidad solo para pesos, gradientes y estados del optimizador
                        (≈16 bytes por parámetro), más las activaciones, que crecen con el lote y suelen ser el mayor consumo en las
                        CNN <Cita k="rajbhandari2020zero" />.
                    </p>
                    <Box type="danger" label="Analogía local — la bodega y el error CUDA OOM">
                        La VRAM es la <strong>bodega de una plaza de mercado</strong>. No importa cuántos camiones (datos) lleguen ni cuántos
                        vendedores (núcleos) haya: si la bodega se llena, no entra más mercancía. El temido error{' '}
                        <span className="inline-code">CUDA out of memory</span> (OOM) es el administrador diciendo «no hay más espacio,
                        devuelvan el camión». La primera solución siempre es <strong>reducir el tamaño del lote</strong> (<em>batch size</em>).
                    </Box>
                    <AntesDeInteractuar>
                        en un ResNet-50 con Adam y lote 32, ¿ocupan más VRAM los estados del optimizador o las activaciones? ¿Qué
                        fracción de la memoria ahorrará la precisión mixta? Conviene anotar la predicción antes de mover los controles.
                    </AntesDeInteractuar>
                    <CalculadoraVRAM
                        citaKorthikanti={<Cita k="korthikanti2022reducing" n />}
                        fuente={<>elaboración propia (simulación interactiva) a partir de <Cita k="micikevicius2018mixed" n />, <Cita k="rajbhandari2020zero" n /> y <Cita k="korthikanti2022reducing" n />; activaciones por muestra medidas con PyTorch 2.12.</>} />

                    <h4>Precisión mixta: hacer más con menos</h4>
                    <p>
                        El entrenamiento con <strong>precisión mixta</strong> realiza la mayoría de los cálculos en 16 bits (FP16 o BF16)
                        mientras mantiene los pesos maestros en FP32 para la estabilidad. Formatos clave:
                    </p>
                    <ul>
                        <li><strong>FP32</strong> (32 bits): precisión completa, para pesos maestros y la pérdida final.</li>
                        <li><strong>BF16</strong> (16 bits, exponente de 8): preferido en Ampere+ (A100, H100); su rango iguala al de FP32, sin necesidad de escalado <Cita k="kalamkar2019study" />.</li>
                        <li><strong>FP16</strong> (16 bits, exponente de 5): requiere <em>escalado de pérdida</em> para que los gradientes pequeños no se anulen por subdesbordamiento (<em>underflow</em>): el menor valor positivo de FP16 es ≈ 6·10⁻⁸; el escalado dinámico reduce el factor si aparece un desbordamiento <Cita k="micikevicius2018mixed" />. Lo aceleran todas las GPU con Tensor Cores, incluida la T4.</li>
                        <li><strong>FP8</strong> (8 bits): en Ada Lovelace (L4, RTX 4090), Hopper (H100) y Blackwell (B200), con E4M3 para pesos y activaciones y E5M2 para gradientes <Cita k="micikevicius2022fp8" />; según <Cita k="nvidia_h100" n />, la H100 alcanza ≈1.979 TFLOPS en FP8 (3.958 TFLOPS con dispersión estructurada).</li>
                    </ul>
                    <FormatosNumericosSVG />
                    <p>
                        Resultado: la precisión mixta acelera hasta <strong>2–3×</strong> en GPU con Tensor Cores <Cita k="nvidia_mixedprecision" /> y reduce sobre todo la
                        memoria de las <strong>activaciones</strong>, que se guardan en 16 bits. Los pesos maestros, sus gradientes y los
                        estados de Adam siguen en FP32, así que el ahorro total es <strong>menor que la mitad</strong>: del orden de un
                        tercio en una CNN mediana con lote 32 (≈31 % en ResNet-18 y ≈39 % en ResNet-50, medición propia con PyTorch 2.12),
                        y se acerca a la mitad solo cuando las activaciones dominan la memoria <Cita k="micikevicius2018mixed" />.
                    </p>
                    <AMPSVG fuente={<>elaboración propia a partir de <Cita k="micikevicius2018mixed" n /> y de la documentación de PyTorch AMP <Cita k="pytorch_amp" />.</>} />

                    <h4>Uso práctico de GPU</h4>
                    <Tabs tabs={[
                        {
                            label: 'PyTorch', content: (
                                <CodeBlock lang="pytorch" title="Mover a GPU + AMP" code={`import torch

# Detección del dispositivo
device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
if device.type == 'cuda':
    print(f'Usando: {torch.cuda.get_device_name(0)}')   # p. ej.: 'Tesla T4'

modelo = ClasificadorAgua().to(device)   # el del Capítulo 3.1: devuelve logits
criterio = torch.nn.BCEWithLogitsLoss()
optimizador = torch.optim.Adam(modelo.parameters())

# Precisión mixta automática (AMP); sin GPU, autocast y GradScaler se desactivan
usa_amp = device.type == 'cuda'
scaler = torch.amp.GradScaler(device.type, enabled=usa_amp)
for entradas, objetivos in dataloader:
    entradas, objetivos = entradas.to(device), objetivos.to(device)
    optimizador.zero_grad()
    with torch.autocast(device_type=device.type, dtype=torch.float16, enabled=usa_amp):
        salida = modelo(entradas)                # paso hacia adelante en 16 bits
        perdida = criterio(salida, objetivos)
    scaler.scale(perdida).backward()
    scaler.step(optimizador)
    scaler.update()`} />
                            )
                        },
                        {
                            label: 'TensorFlow/Keras', content: (
                                <CodeBlock lang="python" title="Crecimiento gradual de memoria + precisión mixta" code={`import tensorflow as tf   # solo para tf.config, exclusivo de TensorFlow
import keras

# Evitar que TF reserve toda la VRAM al iniciar
gpus = tf.config.list_physical_devices('GPU')
for gpu in gpus:
    tf.config.experimental.set_memory_growth(gpu, True)

# Precisión mixta en una sola línea (alias de keras.config.set_dtype_policy)
keras.mixed_precision.set_global_policy('mixed_float16')`} />
                            )
                        },
                    ]} />
                    <Box type="code" label="Lectura del código">
                        Ambos fragmentos activan la <strong>precisión mixta</strong>, pero con distinto nivel de control. En PyTorch,{' '}
                        <span className="inline-code">autocast</span> ejecuta cada operación en FP16 donde es seguro <Cita k="pytorch_amp" /> y{' '}
                        <span className="inline-code">GradScaler</span> escala la pérdida para que los gradientes diminutos no se anulen (es el
                        ciclo de la <strong>Figura 3.2.5</strong>: escalar → retropropagar → desescalar → paso). Bajo{' '}
                        <span className="inline-code">autocast</span>, la pérdida se calcula sobre <em>logits</em> con{' '}
                        <span className="inline-code">BCEWithLogitsLoss</span>: <span className="inline-code">BCELoss</span> no es segura en
                        16 bits (véase la nota técnica del Capítulo 3.1). En Keras el escalado queda oculto: basta una línea,{' '}
                        <span className="inline-code">set_global_policy('mixed_float16')</span> <Cita k="keras_mixedprecision" />. La instrucción{' '}
                        <span className="inline-code">set_memory_growth</span> es un asunto aparte: evita que TensorFlow reserve toda la VRAM al
                        arrancar; la memoria se asigna a medida que se necesita, de modo que otros procesos de la misma sesión puedan usar
                        la GPU.
                    </Box>

                    <h4>Gestión de memoria: cuando la GPU dice «no más»</h4>
                    <p>La <strong>acumulación de gradientes</strong> simula lotes grandes sin memoria adicional:</p>
                    <CodeBlock lang="pytorch" title="Acumulación de gradientes" code={`pasos_acumulacion = 8
for i, (entradas, etiquetas) in enumerate(dataloader):
    perdida = criterio(modelo(entradas.to(device)),
                       etiquetas.to(device)) / pasos_acumulacion
    perdida.backward()
    if (i + 1) % pasos_acumulacion == 0:
        optimizador.step()
        optimizador.zero_grad()   # aquí zero_grad va tras el paso: se acumulan k lotes`} />
                    <ul>
                        <li><strong>Recomputación de activaciones (<em>gradient checkpointing</em>):</strong> descarta activaciones intermedias y las recalcula en el paso hacia atrás; ahorra mucha memoria a costa de ≈ un paso hacia adelante extra por lote <Cita k="chen2016training" />.</li>
                        <li><strong>FlashAttention:</strong> reduce la memoria extra de la atención de O(N²) a O(N) y la acelera 2–4× <Cita k="dao2022flashattention" />; FlashAttention-2 la duplica de nuevo <Cita k="dao2023flashattention2" />. En PyTorch se usa vía <span className="inline-code">F.scaled_dot_product_attention</span> en GPU Ampere o posteriores.</li>
                        <li><strong>torch.no_grad():</strong> envolver la validación evita construir el grafo de operaciones y guardar las activaciones para el paso hacia atrás.</li>
                    </ul>

                    <h4>Entrenamiento multi-GPU: escalar la potencia</h4>
                    <Box type="info" label="Analogía local — la minga">
                        En comunidades indígenas y campesinas de los Andes colombianos —en el Cauca o en Nariño, por ejemplo—, la{' '}
                        <strong>minga</strong> es un trabajo colectivo en el que decenas de personas colaboran en una tarea común. El
                        entrenamiento con varias GPU funciona igual: cada GPU procesa una porción de los datos y, al final de cada paso,
                        todas comparten sus gradientes para avanzar al unísono.
                    </Box>
                    <p>
                        <strong>DataParallel (DP)</strong> es simple pero ineficiente (cuello de botella en la GPU 0).
                        <strong> DistributedDataParallel (DDP)</strong> lanza un proceso por GPU y sincroniza con NCCL; es notablemente más
                        eficiente que DP, incluso en un solo nodo, y es la opción recomendada <Cita k="li2020pytorch" />. <strong>FSDP</strong>{' '}
                        fragmenta parámetros, gradientes y estados del optimizador, lo que permite entrenar modelos que exceden la VRAM de
                        una sola GPU <Cita k="zhao2023pytorch" />. En TensorFlow,{' '}
                        <span className="inline-code">tf.distribute.MirroredStrategy()</span> ofrece multi-GPU de un nodo de forma transparente.
                    </p>

import torch

# Guardar checkpoints cada N épocas
def guardar_checkpoint(modelo, optimizador, epoca, perdida):
    ruta = '/content/drive/MyDrive/checkpoints/'

                    <h3>1. Flujos de datos eficientes</h3>

                        (<span className="inline-code">prefetch</span>) y tener a la mano lo más usado (<span className="inline-code">cache</span>).

                        <Cita k="tensorflow_tfdata" />.

                    <CodeBlock lang="python" title="Flujo óptimo con tf.data" code={`import tensorflow as tf

# 1. Cargar los datos
dataset = tf.data.Dataset.from_tensor_slices((imagenes, etiquetas))

# 2. Transformar (preprocesar en paralelo)
dataset = dataset.map(preprocesar, num_parallel_calls=tf.data.AUTOTUNE)

# 3. Caché (evita releer del disco en cada época)
dataset = dataset.cache()

# 4. Mezclar aleatoriamente
dataset = dataset.shuffle(buffer_size=1000)

# 5. Agrupar en lotes
dataset = dataset.batch(32)

# 6. Precargar el siguiente lote (SIEMPRE al final)
dataset = dataset.prefetch(tf.data.AUTOTUNE)`} />

                    <h4>DataLoader: el flujo explícito de PyTorch</h4>
                    <p>
                        PyTorch usa dos abstracciones <Cita k="pytorch_dataloading" />: <span className="inline-code">Dataset</span> (qué datos cargar y cómo) y{' '}
                        <span className="inline-code">DataLoader</span> (cómo entregarlos: en lotes, mezclados, con varios procesos). A
                        diferencia de tf.data (declarativo), el DataLoader ofrece <strong>control explícito</strong> de cada parámetro.
                    </p>
                    <CodeBlock lang="pytorch" title="DataLoader optimizado" code={`import os
from torch.utils.data import Dataset, DataLoader

class DatasetCafe(Dataset):
    def __init__(self, rutas, etiquetas, transform=None):
        self.rutas = rutas
        self.etiquetas = etiquetas
        self.transform = transform
    def __len__(self):
        return len(self.rutas)
    def __getitem__(self, idx):
        imagen = cargar_imagen(self.rutas[idx])
        if self.transform:
            imagen = self.transform(imagen)
        return imagen, self.etiquetas[idx]

dataloader = DataLoader(
    dataset=DatasetCafe(rutas, etiquetas, transform=mis_transforms),
    batch_size=32,
    shuffle=True,
    num_workers=min(4, os.cpu_count()),   # Colab gratuito: 2 vCPU
    pin_memory=True,         # Memoria fijada: copia rápida a la GPU
    prefetch_factor=2,       # Lotes precargados por proceso de carga
    persistent_workers=True  # Mantener los procesos entre épocas
)`} />
                    <ul>
                        <li><strong>num_workers:</strong> procesos de carga (<em>workers</em>) que trabajan en paralelo. Conviene empezar por el número de núcleos disponibles (en Colab gratuito, 2) y ajustar midiendo; demasiados consumen RAM y generan contención.</li>
                        <li><strong>pin_memory=True:</strong> asigna tensores en memoria fijada (<em>page-locked</em>) de la CPU para transferencias asíncronas más rápidas a la GPU. Combinar con <span className="inline-code">.to(device, non_blocking=True)</span>. Solo útil con GPU.</li>
                        <li><strong>prefetch_factor:</strong> lotes precargados por proceso de carga (el valor por defecto, 2, funciona bien).</li>
                        <li><strong>persistent_workers=True:</strong> mantiene los procesos vivos entre épocas, evitando el costo de reiniciarlos. Útil con épocas cortas.</li>
                    </ul>
                    <div className="overflow-x-auto">
                        <table>
                            <thead><tr><th>Característica</th><th>tf.data (TensorFlow)</th><th>DataLoader (PyTorch)</th></tr></thead>
                            <tbody>
                                <tr><td>Paradigma</td><td>Declarativo (cadena de transformaciones)</td><td>Explícito (clases Dataset + DataLoader)</td></tr>
                                <tr><td>Paralelismo</td><td>num_parallel_calls en .map()</td><td>num_workers (multiproceso)</td></tr>
                                <tr><td>Precarga</td><td>.prefetch(AUTOTUNE) automático</td><td>prefetch_factor (manual)</td></tr>
                                <tr><td>Caché</td><td>.cache() integrado</td><td>Manual (precargar en RAM)</td></tr>
                                <tr><td>Transferencia CPU→GPU</td><td>Automática: el motor de TF gestiona la VRAM</td><td>pin_memory=True (explícito)</td></tr>
                                <tr><td>Depuración</td><td>Compleja (ejecución diferida)</td><td>Sencilla (Python estándar)</td></tr>
                            </tbody>
                        </table>
                    </div>

                    {/* ============== 3.2 Data Augmentation ============== */}
                    <h3>2. Estrategias de aumento de datos</h3>
                    <Box type="info" label="Analogía local — el director técnico de la Selección Colombia">
                        Si el DT solo entrena al equipo contra el mismo rival, en la misma cancha y con el mismo clima, el equipo no se adapta
                        cuando juega en la altura de La Paz o bajo la lluvia de Barranquilla. El <strong>aumento de datos</strong> es entrenar
                        en <strong>condiciones variadas</strong>: cambiar iluminación, ángulo, rotación y ruido para que el modelo aprenda
                        patrones esenciales y no memorización superficial.
                    </Box>
                    <p>
                        Es una técnica de <strong>regularización</strong> <Cita k="shorten2019survey" /> que aplica transformaciones aleatorias a los datos de entrenamiento:
                        aumenta el tamaño efectivo del conjunto de datos, reduce el sobreajuste y mejora la generalización. <strong>Solo se aplica al
                        conjunto de entrenamiento</strong>, nunca a validación o prueba, y en tiempo de ejecución (<em>on-the-fly</em>), generando
                        variaciones distintas en cada época.
                    </p>
                    <AugmentationSVG />
                    <p>Las transformaciones se clasifican en:</p>
                    <ul>
                        <li><strong>Geométricas:</strong> <span className="inline-code">RandomHorizontalFlip</span> (útil en escenas naturales; contraindicado en texto o dígitos), <span className="inline-code">RandomRotation</span>, <span className="inline-code">RandomResizedCrop</span>, <span className="inline-code">RandomAffine</span>.</li>
                        <li><strong>Fotométricas:</strong> <span className="inline-code">ColorJitter</span> (brillo, contraste, saturación y tono, para simular sol o nublado), <span className="inline-code">GaussianBlur</span>, <span className="inline-code">Normalize</span> (con media/desviación de ImageNet; es preprocesamiento esencial, no un aumento en sí).</li>
                        <li><strong>Mezcla entre muestras:</strong> <strong>Mixup</strong> interpola linealmente dos imágenes y sus etiquetas <Cita k="zhang2018mixup" />; <strong>CutMix</strong> recorta una región de una imagen y la pega en otra, ajustando las etiquetas por área <Cita k="yun2019cutmix" />. Mejoran calibración y robustez.</li>
                    </ul>
                    <Tabs tabs={[
                        {
                            label: 'PyTorch (transforms.v2)', content: (
                                <CodeBlock lang="pytorch" title="torchvision.transforms.v2" code={`import torch
from torchvision.transforms import v2 as transforms

transform_entrenamiento = transforms.Compose([
    transforms.RandomResizedCrop(224),
    transforms.RandomHorizontalFlip(p=0.5),
    transforms.ColorJitter(brightness=0.2, contrast=0.2,
                           saturation=0.2, hue=0.1),
    transforms.RandomRotation(15),
    transforms.ToImage(), transforms.ToDtype(torch.float32, scale=True),
    transforms.Normalize(mean=[0.485, 0.456, 0.406],
                         std=[0.229, 0.224, 0.225])
])

# La validación NO lleva aumento aleatorio
transform_validacion = transforms.Compose([
    transforms.Resize(256),
    transforms.CenterCrop(224),
    transforms.ToImage(), transforms.ToDtype(torch.float32, scale=True),
    transforms.Normalize(mean=[0.485, 0.456, 0.406],
                         std=[0.229, 0.224, 0.225])
])`} />
                            )
                        },
                        {
                            label: 'Keras (capas)', content: (
                                <CodeBlock lang="python" title="keras.layers de aumento" code={`import keras

aumento = keras.Sequential([
    keras.layers.RandomFlip('horizontal'),
    keras.layers.RandomRotation(0.1),
    keras.layers.RandomZoom(0.1),
    keras.layers.RandomContrast(0.2),
])

# Las capas de aumento se integran al modelo
modelo = keras.Sequential([
    aumento,   # Activo solo cuando training=True (.fit())
    keras.layers.Conv2D(32, 3, activation='relu'),
    # ... resto del modelo
])`} />
                            )
                        },
                    ]} />
                    <Box type="tip" label="Nota técnica — el parámetro training">
                        Las capas de preprocesamiento de Keras verifican el argumento <span className="inline-code">training</span>: durante{' '}
                        <span className="inline-code">.fit()</span> es <span className="inline-code">True</span> y aplican las transformaciones;
                        durante <span className="inline-code">.predict()</span>/<span className="inline-code">.evaluate()</span> es{' '}
                        <span className="inline-code">False</span> y las omiten. Así no se transforma por error la validación o prueba.
                    </Box>

                        <Cita k="albumentations_repo" />, y su desarrollo continúa en{' '}
                        <strong>AlbumentationsX</strong> (<span className="inline-code">pip install albumentationsx</span>), compatible con
                        su API <Cita k="albumentationsx" />. AlbumentationsX se distribuye con licencia <strong>AGPL-3.0</strong> (<em>copyleft</em>: el código que la

                        <span className="inline-code">torchvision.transforms.v2</span> (BSD-3), que cubre todos los aumentos de este

                    <h4>Aumento de datos de texto (PLN)</h4>
                    <ul>
                        <li><strong>Reemplazo de sinónimos:</strong> «el cultivo está enfermo» → «el cultivo está dañado».</li>
                        <li><strong>Inserción / eliminación aleatoria:</strong> agregar o quitar palabras, simulando texto ruidoso <Cita k="wei2019eda" />.</li>
                        <li><strong>Retrotraducción (<em>back-translation</em>):</strong> traducir al inglés y de vuelta al español genera paráfrasis naturales <Cita k="sennrich2016improving" />.</li>
                    </ul>
                    <Box type="eth" label="Contexto local — opiniones políticas en redes sociales">
                        Para analizar el sentimiento de tuits sobre política, el aumento de texto puede imitar el registro coloquial del
                        país (contracciones como «pa'l», regionalismos como «bacano», «chévere» o «parce»), siempre que las
                        transformaciones <strong>no inviertan la polaridad</strong> del texto original. Además, las opiniones políticas son{' '}
                        <strong>datos sensibles</strong> según la Ley 1581 de 2012: aunque los tuits sean públicos, perfilar a personas
                        identificables por su postura exige una finalidad legítima, anonimización y especial cuidado al publicar los
                        resultados.
                    </Box>

                    {/* ============== 3.3 Guardado y despliegue ============== */}
                    <h3>3. Guardado de modelos y despliegue</h3>
                    <Box type="info" label="Analogía local — la maqueta y la obra real">
                        Un modelo entrenado en Colab es como la <strong>maqueta de un puente</strong> en el laboratorio de una universidad:
                        funciona en el laboratorio, pero no sirve para cruzar un río. Para que la gente lo cruce hay que <strong>desplegarlo</strong>:
                        construirlo con materiales reales, en el sitio real, con las condiciones reales de carga y clima.
                    </Box>

                    <h4>Guardado en PyTorch: state_dict frente a modelo completo</h4>
                    <p>
                        El método <strong>recomendado</strong> es guardar solo los pesos (<span className="inline-code">state_dict</span>): más
                        portable, liviano y compatible entre versiones. Requiere tener la definición de la arquitectura al cargar.
                    </p>
                    <CodeBlock lang="pytorch" title="Guardar y cargar state_dict" code={`# Guardar
torch.save(modelo.state_dict(), 'detector_roya.pth')

# Cargar (requiere definir la arquitectura primero)
modelo = DetectorRoya()   # Misma clase del entrenamiento
modelo.load_state_dict(
    torch.load('detector_roya.pth', weights_only=True)
)
modelo.eval()             # Cambiar a modo evaluación`} />
                    <Box type="danger" label="Nota de seguridad — weights_only=True">
                        <span className="inline-code">weights_only=True</span> es <strong>el comportamiento por defecto desde PyTorch 2.6</strong> <Cita k="pytorch_v26" /> y recomendado desde
                        2.4. Sin él, <span className="inline-code">torch.load()</span> usa Pickle, que permite ejecución de código arbitrario al
                        cargar archivos de fuentes no confiables. Con <span className="inline-code">weights_only=True</span> solo se deserializan
                        tensores y tipos primitivos. Guardar el <em>modelo completo</em> es más cómodo pero menos portable y hereda los riesgos de
                        Pickle; úsese solo para guardados temporales.
                    </Box>
                    <p>Para entrenamientos largos, el <strong>punto de control</strong> (<em>checkpoint</em>) guarda también el optimizador, la época y la pérdida para reanudar:</p>
                    <CodeBlock lang="pytorch" title="Punto de control de entrenamiento" code={`checkpoint = {
    'epoca': epoca,
    'modelo_state_dict': modelo.state_dict(),
    'optimizador_state_dict': optimizador.state_dict(),
    'perdida': float(perdida_actual),   # float: weights_only=True no admite numpy.float64
}
torch.save(checkpoint, f'checkpoint_epoca_{epoca}.pth')

# Reanudar tras una desconexión
ck = torch.load(f'checkpoint_epoca_{epoca}.pth')   # weights_only=True por defecto
modelo.load_state_dict(ck['modelo_state_dict'])
optimizador.load_state_dict(ck['optimizador_state_dict'])
epoca_inicial = ck['epoca'] + 1`} />
                    <Box type="code" label="Lectura del código">
                        A diferencia del <span className="inline-code">state_dict</span> (que guarda solo los pesos), el punto de control es un diccionario
                        que almacena también el <span className="inline-code">optimizador_state_dict</span>, la época y la pérdida. Con esos cuatro
                        elementos, un entrenamiento que Colab interrumpe por desconexión se reanuda <strong>exactamente</strong> donde quedó —incluido
                        el estado interno de Adam (sus medias móviles)—, en lugar de recomenzar desde cero.
                    </Box>

                    <h4>Guardado en TensorFlow/Keras: .keras frente a SavedModel</h4>
                    <CodeBlock lang="python" title="Formatos de Keras" code={`# Formato .keras (Keras 3, multi-backend)
modelo.save('clasificador_cafe.keras')
modelo_cargado = keras.models.load_model('clasificador_cafe.keras')

# Formato SavedModel (para despliegue TF: Serving, LiteRT, TF.js)
# En Keras 3 se genera con export() — save() exige extensión .keras/.h5
modelo.export('clasificador_cafe_savedmodel')
# Keras 3 también exporta directo: format='onnx' (3.8+) o format='litert' (3.13+)

# Para inferencia, el SavedModel se recarga como capa:
capa_inferencia = keras.layers.TFSMLayer(
    'clasificador_cafe_savedmodel', call_endpoint='serving_default')`} />
                    <p>
                        El formato <strong>.keras</strong> (recomendado desde Keras 3) guarda arquitectura, pesos y configuración en un archivo
                        agnóstico del <em>backend</em> <Cita k="keras_saving" />; <strong>SavedModel</strong> almacena el grafo completo y la lógica de servicio, estándar para TF
                        Serving, LiteRT y TF.js.
                    </p>

                    <h4>ONNX: el «pasaporte universal»</h4>
                    <Box type="info" label="Analogía local — el pasaporte">
                        Un modelo entrenado en PyTorch es como un viajero con documentos que solo reconoce su país. ONNX le da un{' '}
                        <strong>pasaporte</strong>: un formato común que deja al modelo cruzar de un <em>framework</em> o motor a otro
                        (ONNX Runtime, Triton, un acelerador) sin reescribir su código.
                    </Box>
                    <p>
                        <strong>ONNX</strong> (Open Neural Network Exchange) es un formato abierto que permite entrenar en PyTorch y ejecutar
                        con ONNX Runtime en un servidor (Python, C++, C#, Java), en el navegador o en un acelerador especializado, sin
                        reescribir código <Cita k="onnx_docs" />. Lo mantiene la LF AI &amp; Data Foundation (Linux Foundation) y lo soportan Microsoft, Meta, AWS y
                        NVIDIA. En los dos ejemplos siguientes, <span className="inline-code">modelo</span> es ya la CNN que clasifica fotos de
                        hojas (no el <span className="inline-code">DetectorRoya</span> de cuatro entradas del Capítulo 3.1).
                    </p>
                    <CodeBlock lang="pytorch" title="Exportar a ONNX (exportador basado en torch.export, predeterminado desde PyTorch 2.9)" code={`# En Colab: !pip -q install onnx onnxscript onnxruntime
import torch

modelo.eval()
x = torch.randn(2, 3, 224, 224)            # lote 2: evita fijar el lote en 1
lote = torch.export.Dim('lote')
torch.onnx.export(modelo, (x,), 'detector_roya.onnx',
                  input_names=['imagen'], output_names=['prediccion'],
                  dynamic_shapes=({0: lote},),   # tupla: no depende del nombre del argumento de forward()
                  external_data=False)           # un solo archivo (< 2 GB); dynamo=True ya es el predeterminado`} />
                    <p>
                        Desde PyTorch 2.9, <span className="inline-code">torch.onnx.export</span> usa por defecto el exportador basado en{' '}
                        <span className="inline-code">torch.export</span> <Cita k="pytorch_v29" />. Con{' '}
                        <span className="inline-code">external_data=False</span>, los pesos quedan dentro del mismo archivo; sin ese
                        argumento, el exportador escribe además <span className="inline-code">detector_roya.onnx.data</span>, y quien copie
                        solo el <span className="inline-code">.onnx</span> pierde los pesos <Cita k="pytorch_onnx" />. Tras exportar conviene comprobar que no existe
                        ese segundo archivo, validar el modelo con <span className="inline-code">onnx.checker.check_model</span> y comparar
                        sus salidas con las de PyTorch en lotes de distinto tamaño. Una vez exportado, el modelo corre con{' '}
                        <strong>ONNX Runtime</strong> <Cita k="onnxruntime_docs" />, que optimiza la ejecución para el hardware disponible (CPU, GPU, aceleradores).
                    </p>

                    <h4>torch.export: el sucesor de TorchScript</h4>
                    <p>
                        <strong>TorchScript</strong> fue <strong>declarado obsoleto en la documentación de PyTorch 2.9</strong>, de octubre de
                        2025 <Cita k="pytorch_jit" />, y emite avisos en tiempo de ejecución desde la 2.10 <Cita k="pytorch_v210" />. Su sucesor, <span className="inline-code">torch.export</span>,
                        captura el modelo como un grafo de compilación anticipada (<strong>AOT</strong>) de operadores ATen <Cita k="pytorch_export" />, base de ExecuTorch
                        y, vía el exportador ONNX, de ONNX Runtime; se integra con el compilador Dynamo y evita los problemas de compatibilidad
                        de TorchScript.
                    </p>
                    <CodeBlock lang="pytorch" title="Exportar con torch.export (.pt2)" code={`import torch

modelo.eval()
x = torch.randn(2, 3, 224, 224)            # lote 2: evita fijar el lote en 1
lote = torch.export.Dim('lote')
programa = torch.export.export(modelo, (x,), dynamic_shapes=({0: lote},))
torch.export.save(programa, 'detector_roya.pt2')

# Cargar en otra máquina (sin el código fuente de la clase, pero con PyTorch)
programa_cargado = torch.export.load('detector_roya.pt2')
resultado = programa_cargado.module()(torch.randn(4, 3, 224, 224))`} />
                    <Box type="code" label="Lectura del código">
                        <span className="inline-code">torch.export.export</span> traza el modelo con una entrada de ejemplo y lo congela como un
                        grafo autocontenido; el archivo <span className="inline-code">.pt2</span> que produce se vuelve a cargar en otra máquina{' '}
                        <strong>sin el código fuente de la clase del modelo</strong>, aunque sí con PyTorch —a diferencia del{' '}
                        <span className="inline-code">state_dict</span>, que exige volver a declarar la arquitectura antes de cargar—. Es el
                        punto de partida del despliegue sin Python: se compila con AOTInductor para C++ <Cita k="pytorch_aotinductor" /> o se convierte con ExecuTorch para el
                        móvil <Cita k="executorch_docs" />. Sin <span className="inline-code">dynamic_shapes</span>, el programa solo aceptaría el tamaño de lote del
                        ejemplo.
                    </Box>

                    <h4>Conceptos básicos de despliegue</h4>
                    <p>
                        Desplegar no es solo exportar un archivo: en un sistema real, el código del modelo es una fracción pequeña junto a
                        la recolección y verificación de datos, la infraestructura de servicio y el monitoreo, y descuidar esas piezas
                        acumula deuda técnica <Cita k="sculley2015hidden" />.
                    </p>
                    <DespliegueSVG />
                    <ul>
                        <li><strong>API REST:</strong> el modelo se encapsula en un servicio web —FastAPI con ONNX Runtime en servicios sencillos; NVIDIA Triton Inference Server <Cita k="triton_server" /> o TF Serving en producción— que expone un punto de acceso (<em>endpoint</em>) HTTP; la aplicación envía una imagen y recibe la predicción en JSON.</li>
                        <li><strong>Borde / móvil:</strong> el modelo se optimiza con cuantización <Cita k="jacob2018quantization" /> o poda y se convierte a LiteRT o ExecuTorch <Cita k="google_litert, executorch_docs" /> para correr en teléfonos o IoT <strong>sin internet</strong>.</li>
                        <li><strong>Navegador:</strong> TensorFlow.js ejecuta el modelo en el navegador, sin servidor de inferencia.</li>
                        <li><strong>Nube:</strong> Vertex AI, SageMaker o Azure ML sirven a escala con autoescalado, monitoreo y control de versiones.</li>
                    </ul>
                    <div className="overflow-x-auto">
                        <table>
                            <thead><tr><th>Formato</th><th><em>Framework</em> de origen</th><th>Casos de uso</th></tr></thead>
                            <tbody>
                                <tr><td>.pth / state_dict</td><td>PyTorch</td><td>Puntos de control, reanudación, transferencia de pesos</td></tr>
                                <tr><td>.keras</td><td>Keras 3</td><td>Guardado multi-<em>backend</em>, portabilidad TF/PyTorch/JAX</td></tr>
                                <tr><td>SavedModel</td><td>TensorFlow</td><td>TF Serving, LiteRT, TF.js, producción empresarial</td></tr>
                                <tr><td>.onnx</td><td>Universal</td><td>Interoperabilidad entre <em>frameworks</em>, hardware especializado</td></tr>
                                <tr><td>.pt2 (torch.export)</td><td>PyTorch 2.1+</td><td>Formato intermedio; base de AOTInductor (C++) y ExecuTorch (.pte)</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <Box type="eth" label="Despliegue responsable: confianza, privacidad y energía">
                        Llevar el modelo a la finca traslada sus errores a quien decide con él. Conviene fijar un{' '}
                        <strong>umbral de confianza</strong> por debajo del cual la aplicación pida otra foto o remita a un agrónomo, en
                        lugar de dar un diagnóstico firme, y vigilar la <strong>deriva</strong>: un modelo entrenado con fotos de una sola
                        región y de la estación seca puede fallar en otras zonas o con lluvia. Las fotos de celular suelen llevar la{' '}
                        <strong>ubicación GPS</strong> en sus metadatos; si se envían a una API en la nube, identifican la finca y a su
                        dueño, y su tratamiento se rige por la Ley 1581 de 2012. La inferencia local con un modelo cuantizado evita enviar
                        cada imagen a un servidor y reduce la energía de cada predicción. El <em>Marco ético para la inteligencia
                        artificial en Colombia</em> <Cita k="guio2021marco" /> ofrece principios para documentar estas decisiones, y las tarjetas de modelo de{' '}
                        <Cita k="mitchell2019model" n /> proponen un formato para hacerlo.
                    </Box>

            ['Precisión mixta automática (AMP, *automatic mixed precision*)', 'Calcula en FP16/BF16 y conserva los pesos maestros en FP32; acelera hasta 2–3× en GPU con Tensor Cores y ahorra sobre todo memoria de activaciones (el ahorro total es menor que la mitad).'],
            ['DataLoader (PyTorch)', 'Clase que gestiona la carga paralela de datos con num_workers, pin_memory y prefetch_factor para aprovechar al máximo la GPU.'],
            ['tf.data (TensorFlow)', 'API declarativa para construir flujos de datos eficientes con operaciones encadenadas (map, cache, shuffle, batch, prefetch).'],
            ['Precarga (*prefetch*)', 'Superpone la preparación del siguiente lote (CPU) con el entrenamiento del lote actual (GPU). Analogía: preparar el siguiente plato mientras el actual se cocina.'],
            ['pin_memory', <>Parámetro del DataLoader que asigna los tensores en memoria fijada (<em>page-locked</em>) de la CPU, lo que permite copias DMA asíncronas más rápidas a la GPU.</>],
            ['num_workers', 'Número de procesos de carga del DataLoader que preparan datos en paralelo en segundo plano. Analogía: varios meseros que trabajan en paralelo.'],
            ['Aumento de datos (*data augmentation*)', 'Técnica de regularización que aplica transformaciones aleatorias (volteo, rotación, color) a los datos de entrenamiento, nunca a los de validación. Analogía: entrenar a la Selección Colombia en condiciones variadas.'],
            ['Mixup / CutMix', 'Técnicas de aumento que mezclan dos muestras: Mixup interpola imágenes y etiquetas; CutMix recorta una región y la pega en otra, ajustando las etiquetas por área.'],
            ['AlbumentationsX', <>Biblioteca de aumento de imágenes basada en OpenCV, sucesora de Albumentations (MIT). Licencia AGPL-3.0 (<em>copyleft</em>, también para servicios en red) o comercial.</>],
            ['Hambruna de GPU (*GPU starvation*)', 'La GPU permanece ociosa esperando datos porque el flujo de datos no la alimenta a tiempo. Se mitiga con prefetch, num_workers y cache.'],
            ['ONNX', 'Open Neural Network Exchange: formato abierto para modelos, mantenido por la LF AI & Data Foundation (Linux Foundation). Desde PyTorch 2.9 se exporta con el exportador basado en torch.export. Analogía: el pasaporte del modelo.'],
            ['torch.export', 'Sucesor de TorchScript. Captura el modelo como un grafo AOT de operadores ATen (.pt2); introducido en PyTorch 2.1, es la base del exportador ONNX (predeterminado desde la 2.9), de AOTInductor y de ExecuTorch.'],
            ['Transferencia de aprendizaje (*transfer learning*)', 'Reutilizar un modelo preentrenado (ResNet-18, MobileNetV3) para una tarea nueva con menos datos y cómputo; clave en entornos con recursos limitados.'],
            ['Cuantización', 'Reducir la precisión de los pesos (p. ej., de FP32 a INT8): el modelo queda unas 4 veces más pequeño y, en hardware con aritmética entera de 8 bits, más rápido, con cierta pérdida de exactitud; clave para el borde.'],
            ['LiteRT', 'Sucesor de TensorFlow Lite. Proyecto independiente para inferencia optimizada en móviles y borde, con API nativas en Kotlin y C++.'],
            ['ExecuTorch', <>Entorno de ejecución (<em>runtime</em>) oficial de PyTorch para móviles y borde (sucesor de PyTorch Mobile). Ejecuta programas de torch.export convertidos a .pte; soporta Arm, Apple y Qualcomm.</>],
            ['SavedModel', 'Formato nativo de TensorFlow para despliegue. Almacena el grafo, los pesos y la lógica de servicio. Estándar para TF Serving, LiteRT y TF.js.'],
            ['Punto de control (*checkpoint*)', 'Guardado periódico del estado del modelo, del optimizador, de la época y de la pérdida; permite reanudar un entrenamiento interrumpido (esencial en Colab). No confundir con la recomputación de activaciones.'],
            ['FSDP', 'Fully Sharded Data Parallel: estrategia multi-GPU que fragmenta pesos, gradientes y estados del optimizador, para entrenar modelos que exceden la VRAM de una GPU.'],
            ['Google Colab', 'Entorno de cuadernos Jupyter en la nube de Google con acceso gratuito a GPU T4, con límites variables y no publicados. Planes Pro (≈10 USD/mes) y Pro+ (≈50 USD/mes), a octubre de 2026, con GPU más potentes.'],
            ['Kaggle Notebooks', 'Plataforma de ciencia de datos con GPU gratuitas (P100 o 2 × T4) y una cuota semanal visible en la cuenta (≈30 h a octubre de 2026). Integra conjuntos de datos y competiciones.'],
            ['torch.compile', 'Compila el modelo (vía Dynamo) para acelerarlo dentro de Python; no produce un archivo desplegable.'],
            ['TorchScript', 'Antiguo formato de serialización de PyTorch (torch.jit), declarado obsoleto en PyTorch 2.9; su sucesor es torch.export.'],
            ['Ejecución inmediata (*eager*)', <>Cada operación se ejecuta y devuelve su resultado en el acto; es el modo predeterminado de TensorFlow 2.x y de PyTorch (<em>define-by-run</em>). Analogía: la notaría digital.</>],
            ['Grafo estático y grafo dinámico', 'El grafo estático se define completo antes de ejecutarse (TensorFlow 1.x, tf.function); el dinámico se construye operación por operación mientras el código corre (PyTorch), lo que permite usar if y for de Python.'],
            ['Autograd', 'Motor de diferenciación automática de PyTorch: registra las operaciones sobre tensores con requires_grad=True y, al llamar a .backward(), aplica la regla de la cadena en orden inverso. Analogía: el secretario invisible del Módulo 1.'],
            ['SIMT', <><em>Single Instruction, Multiple Threads</em>: una misma instrucción se ejecuta en paralelo sobre muchos hilos con datos distintos; es el modelo de ejecución de la GPU.</>],
            ['DDP (DistributedDataParallel)', 'Estrategia multi-GPU recomendada en PyTorch: un proceso por GPU que sincroniza los gradientes con NCCL. Analogía: la minga.'],
            ['Recomputación de activaciones (*gradient checkpointing*)', 'Guarda solo algunas activaciones y recalcula las demás en el paso hacia atrás; ahorra VRAM a cambio de cómputo (no confundir con el punto de control del entrenamiento).'],
            ['Acumulación de gradientes', 'Suma los gradientes de k lotes pequeños antes de actualizar los pesos; simula un lote k veces mayor sin memoria adicional.'],
            ['Escalado de pérdida', 'Multiplica la pérdida antes de backward para que los gradientes pequeños no se anulen por subdesbordamiento en FP16; GradScaler ajusta el factor de forma dinámica. Innecesario con BF16.'],
            ['state_dict', 'Diccionario con los parámetros y búferes de un modelo (o con el estado de un optimizador); para cargarlo hay que declarar antes la arquitectura.'],
            ['weights_only', 'Argumento de torch.load (True por defecto desde PyTorch 2.6) que solo deserializa tensores y tipos primitivos, lo que evita ejecutar código arbitrario al cargar archivos ajenos.'],
            ['API REST', <>Servicio web que expone el modelo en un punto de acceso (<em>endpoint</em>) HTTP y devuelve la predicción en JSON; en el curso, FastAPI con ONNX Runtime.</>],
            ['Computación en el borde (*edge computing*)', 'Ejecutar el modelo en el propio dispositivo (teléfono, tablet, sensor) en lugar de en un servidor; funciona sin internet y no envía los datos fuera. Requiere modelos compactos o cuantizados.'],
        ];

                    cómputo de alto rendimiento (GPU, CUDA, VRAM, precisión mixta, DDP, FSDP) y flujos de datos y despliegue

                <div className="grid md:grid-cols-2 gap-2">
                    {[...GLOSARIO_M3].sort((a, b) => a[0].replace(/\*/g, '').localeCompare(b[0].replace(/\*/g, ''), 'es')).map(([t, d], i) => (

                <Box type="tip" label="Total de términos">

                </Box>

                <Referencias titulo="Bibliografía base" claves={['chollet2025deep', 'geron2025hands', 'stevens2020deep', 'zhang2023dive', 'goodfellow2016deep']} />
                <p className="text-sm text-gray-700 mt-3">
                    Las fuentes de cada herramienta y de cada cifra del módulo —documentación oficial, notas de versión y artículos sobre
                    TensorFlow, Keras 3, PyTorch, CUDA, la precisión mixta, el entrenamiento distribuido, tf.data, el aumento de datos y

                <Box type="info" label="Material de consulta">

        );

            { id: 'cap31', title: '3.1 Frameworks (TF/Keras 3 y PyTorch)', icon: 'Layers', component: Cap31Section },
            { id: 'cap32', title: '3.2 Computación de alto rendimiento (GPU)', icon: 'Cpu', component: Cap32Section },
            { id: 'cap33', title: '3.3 Pipelines de datos y despliegue', icon: 'Share', component: Cap33Section },
            { id: 'eval', title: 'Evaluación final', icon: 'Award', component: EvaluacionSection },
            { id: 'glosario', title: 'Glosario y referencias', icon: 'ListChecks', component: GlosarioSection },
        ];

        /* ============================================================
           APP — sidebar + barra de progreso + navegación + reanudar
        ============================================================ */
        const STORAGE_KEY = 'm3_deep_learning_leccion';

        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, String(safeIndex));

                const cont = document.getElementById('contenido-scroll');

                if (cont) cont.scrollTo({ top: 0, behavior: sinMovimiento ? 'auto' : 'smooth' });

            const irA = (idx) => {

                if (window.innerWidth < 1024) setSidebarOpen(false);

            return (
                <div className="flex h-screen overflow-hidden relative">

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg usta-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/70 border-t border-white/10">
                            <p>Maestría en Ciencia de Datos · EA-N-F-004</p>
                            <p>TensorFlow · PyTorch · Keras 3 · 3 créditos</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        {/* Barra de progreso */}
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">

                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3 pl-12 lg:pl-0">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">

                                        <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">

                                            <h1 className="text-2xl font-bold text-primary mb-2">Implementación y Herramientas Profesionales de Deep Learning</h1>

                                            <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">

                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">

                                    <div className="usta-header rounded-xl p-6 text-center">

                                        <p className="text-xs mt-2 text-white/70">Universidad Santo Tomás · Maestría en Ciencia de Datos</p>

                    </main>

        const root = ReactDOM.createRoot(document.getElementById('root'));
